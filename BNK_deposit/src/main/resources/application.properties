spring.application.name=BNK_deposit

spring.profiles.include=secret

mybatis.mapper-locations=classpath:mybatis/mapper/**/**.xml

spring.config.import=optional:classpath:application-secret.properties

# Local HTTPS for Spring Boot <-> Flutter development.
# Create the default keystore with:
# keytool -genkeypair -alias bnk-dev -keyalg RSA -keysize 2048 -validity 3650 -storetype PKCS12 -keystore ./certs/bnk-dev.p12 -storepass bnk-dev-pass -dname "CN=192.168.0.87, OU=Dev, O=BNK, L=Busan, ST=Busan, C=KR" -ext "SAN=ip:192.168.0.87,dns:localhost,ip:127.0.0.1"
server.port=${SERVER_PORT:8443}
server.ssl.enabled=${SERVER_SSL_ENABLED:true}
server.ssl.key-store=${SERVER_SSL_KEY_STORE:file:./certs/bnk-dev.p12}
server.ssl.key-store-type=${SERVER_SSL_KEY_STORE_TYPE:PKCS12}
server.ssl.key-store-password=${SERVER_SSL_KEY_STORE_PASSWORD:bnk-dev-pass}
server.ssl.key-alias=${SERVER_SSL_KEY_ALIAS:bnk-dev}
