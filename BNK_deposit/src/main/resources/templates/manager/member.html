<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>고객 관리 페이지</title>
<link rel="stylesheet" th:href="@{/css/managerStyle.css}">
</head>
<body>
	<!-- 헤더 -->
    <div th:replace="~{fragments/mngFragment :: mngHeader}"></div>
    
	<div class="manager-container">
        
        <!-- 사이드바 -->
        <div th:replace="~{fragments/mngFragment :: mngSideBar}"></div>
        
        <!-- 출력부 -->
        <main class="manager-main">
		    <div class="customer-manage-container">
		        <!-- 문구 -->
		        <h2 class="page-main-title">고객 관리</h2>
		        
		        <!-- 검색하기 -->
	            <div class="filter-row">
	                <div class="filter-field-box">
	                
	                	<!-- 입력 1 - 생년월일 -->
	                    <label>생년월일:</label>
	                    <input type="date" class="date-input" name="birth_date" id="birth_date">
	                    
	                </div>
	                
	                <div class="filter-field-box">
	                
	                	<!-- 입력 2 - 전화번호 -->
	                    <label>전화번호:</label>
	                    <input type="text" class="phone-input" name="phone_number" id="phone_number">
	                    
	                </div>
	            </div>
	            
	            <div class="name-search-wrapper">
	            
	            	<!-- 입력 3 - 이름 -->
	                <input type="text" placeholder="이름을 입력해주세요." class="name-search-input" name="member_name" id="member_name">
	                
	                <!-- 전송하기!! -->
	                <button type="button" id="showMember" class="name-search-btn">🔍</button>
	                
	            </div>
		        
		        
		        
	        	<!-- 출력하는 부분 -->
				<div class="customer-list-section">
				    <h3 class="list-section-title">고객 명단</h3>
				    
				    <!-- 비동기 fetch가 이 div 알맹이를 통째로 갈아 끼웁니다 -->
				    <div id="memberTableResult">
				        
				        <!-- Case 1: 출력될 데이터가 없다면 (최초 진입 또는 결과 없음) -->
				        <div th:if="${#lists.isEmpty(mmbList)}" class="empty-result-box">
				            <div id="result">조회된 회원 정보가 없습니다. 조건 입력 후 검색해주세요.</div>		            	
				        </div>
				        
				        <!-- Case 2: 출력될 데이터가 있다면 -->
				        <div th:if="${not #lists.isEmpty(mmbList)}">
				            <!-- id와 함께 공통 스타일 클래스인 mng-table을 부여합니다 -->
				            <table id="member-list-table" class="mng-table">
				                <thead>
				                    <tr>
				                        <th style="width: 80px;">번호</th>
				                        <th>이름</th>
				                        <th>생년월일</th>
				                        <th>전화번호</th>
				                    </tr>
				                </thead>
				                <tbody>
				                    <tr th:each="mmb, stat : ${mmbList}" class="mng-table-tr">
				                        <td th:text="${stat.count}"></td>
				                        <td th:text="${mmb.member_name}" class="font-weight-bold"></td>
				                        <td th:text="${mmb.birth_date}"></td>
				                        <td th:text="${mmb.phone_number}"></td>
				                    </tr>
				                </tbody>
				            </table>
				        </div>
				        
				    </div>
				</div>
		    </div>
		</main>
		
    </div>

<script>
	document.querySelector("#showMember").addEventListener('click', showMember);
	
	function showMember () {
	    const birth = document.querySelector("#birth_date").value;
	    const phone = document.querySelector("#phone_number").value;
	    const member = document.querySelector("#member_name").value;
	    
	    // 요청 경로는 동일하게 호출하되
	    fetch('/mmbPage/search?birth_date='+birth+"&phone_number="+phone+"&member_name="+member)
	    .then(response => {
	        if (!response.ok) throw new Error("에러 발생");
	        return response.text(); // 중요: json()이 아니라 text()로 HTML 코드를 그대로 받습니다.
	    })
	    .then(htmlFragment => {
	        // 서버에서 받아온 완성된 HTML 조각을 감싸고 있는 원래 div에 쏙 덮어씌웁니다.
	        document.querySelector("#memberTableResult").outerHTML = htmlFragment;
	    })
	    .catch(error => console.error("에러:", error));
	}
	
</script>


</body>
</html>
