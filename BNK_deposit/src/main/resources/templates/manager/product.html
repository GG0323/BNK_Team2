<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 관리 페이지</title>
<link rel="stylesheet" th:href="@{/css/managerStyle.css}">
</head>
<body>
	<!-- 헤더 -->
    <div th:replace="~{fragments/mngFragment :: mngHeader}"></div>
    
	<div class="manager-container">
        <!-- 사이드바 -->
        <div th:replace="~{fragments/mngFragment :: mngSideBar}"></div>
        
        <main class="manager-main">

	    <div class="search-bar-container">
	    	<!-- 출력 선택 -->
	        <select class="sort-select">
	            <option value="latest">전체</option>
	            <option value="oldest">예금</option>
	            <option value="oldest">적금</option>
	        </select>
	        
	        <!-- 검색부 -->
	        <div class="search-input-wrapper">
	            <input type="text" placeholder="검색어를 입력해주세요." class="search-input">
	            <button type="button" class="search-submit-btn">🔍</button>
	        </div>
	    </div>
		
		<!-- 여기가 화면(리스트라고 해야하나?) 출력부분 ~ -->
	    <div class="list-card-container">
	        <div class="card-header">
	            <h2 class="card-title">상품 목록</h2>
	            <span class="card-count" th:text="|[전체 상품 ${#lists.size(prdList)}건]|"></span>
	        </div>
	        
	        <div class="card-content" th:if="${not #lists.isEmpty(prdList)}">
	        	<table class="mng-table">
	        		<thead>
	        			<tr>
	        				<th>번호</th>
	        				<th>상품명</th>
	        				<th>기본 금리</th>
	        				<th>최대 금리</th>
	        			</tr>
	        		</thead>
	        		<tbody>
	        			<tr th:each="prd, stat : ${prdList}" class="mng-table-tr">
	        				<td th:text="${stat.count}"></td>
	        				<td th:text="${prd.product_name}" class="text-left"></td>
	        				<td th:text="${prd.min_interest_rate}"></td>
	        				<td th:text="${prd.max_interest_rate}"></td>
	        			</tr>
	        		</tbody>
	        	</table>
	            
	        </div>
	        
	        <div class="pagination-container">
	            <span class="page-number active">[1]</span>
	        </div>
	    </div>

</main>
        
    </div>

</body>
</html>
