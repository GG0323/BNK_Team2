<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK 마이페이지 - 영업점 예약 내역</title>

    <th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>

    <!-- 마이페이지 공통 디자인/네비 (mypage.html과 동일하게 사용) -->
    <link rel="stylesheet" href="/css/member/mypage.css">
    <link rel="stylesheet" href="/css/member/member-nav.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 서브 네비 active 처리 등 마이페이지 공통 스크립트 -->
    <script src="/js/members/common.js" defer></script>
</head>
<body>

    <div th:replace="~{fragments/header :: header_default}"></div>

    <!-- 마이페이지 공통 상단 배너 (mypage.html과 동일) -->
    <header class="top-header">
        <div class="header-inner">
            <div class="header-left">
                <h1>BNK</h1>
                <div class="header-title-group">
                    <h2>마이페이지</h2>
                    <p>회원 정보 · 계좌 · 상품 가입 내역</p>
                </div>
            </div>
            <div th:replace="~{fragments/nav :: member_top_mypage}"></div>
        </div>
    </header>

    <!-- 서브 네비게이션: 현재 페이지 키 전달 (예약 탭 active 처리용) -->
    <div th:replace="~{fragments/nav :: member_mypage('reservation')}"></div>

    <main class="mypage-container">

        <section class="page-header">
            <h3>영업점 예약 내역</h3>
            <p>영업점 방문 예약 내역을 확인하고 관리합니다.</p>
        </section>

        <div id="resList">
            <div class="loading">예약 목록을 불러오는 중...</div>
        </div>

        <div class="notice">
            · 예약 취소는 <b>접수(PENDING)</b> 또는 <b>확정(CONFIRMED)</b> 상태일 때만 가능합니다.<br>
            · 일정 변경이 필요하면 기존 예약을 취소한 뒤 새로 예약해 주세요.<br>
            · 영업점 사정으로 일정이 변경될 경우 변경통보 상태로 안내됩니다.
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
