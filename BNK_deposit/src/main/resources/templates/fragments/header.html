<!DOCTYPE html>
<html lang="ko"
      xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <th:block th:fragment="headerCss">
        <link rel="stylesheet" th:href="@{/css/header.css}">
        <script th:src="@{/js/header.js}" defer></script>
    </th:block>
</head>

<body>

<header th:fragment="header_default" class="header">
    <div class="header-inner">

        <!-- Logo -->
        <div class="logo">
            <a th:href="@{/}">
                <span class="logo-red">BNK</span>
                <span class="logo-text">부산은행</span>
            </a>
        </div>

        <!-- Navigation -->
        <nav class="nav">
            <a th:href="@{/}">홈</a>
            <a th:href="@{/products}">금융상품</a>
            <a th:href="@{/}">고객센터</a>

            <!-- 상품검색 아이콘 버튼 -->
            <button type="button"
                    class="nav-search-btn"
                    onclick="productSearch()"
                    aria-label="상품검색">
                <svg class="nav-search-icon" viewBox="0 0 24 24" aria-hidden="true">
                    <circle cx="10.5" cy="10.5" r="6.5"></circle>
                    <line x1="15.5" y1="15.5" x2="21" y2="21"></line>
                </svg>
            </button>
        </nav>

        <!-- Header Utils -->
        <div class="header-utils">

            <!-- 로그인 안 했을 때 -->
            <div class="guest-menu" sec:authorize="isAnonymous()">
                <a th:href="@{/loginPage}" class="login-link">로그인</a>
                <span class="divider">|</span>
                <a th:href="@{/signupPage}" class="signup-link">회원가입</a>
            </div>

            <!-- 로그인 했을 때 -->
            <div class="member-menu" sec:authorize="isAuthenticated()">
                <span class="welcome-text">
                    <strong sec:authentication="name">사용자</strong>님
                </span>

                <a th:href="@{/member/mypage}" class="mypage-link">마이페이지</a>

                <form th:action="@{/member/logout}" method="post" class="logout-form">
                    <th:block th:if="${_csrf != null}">
                        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                    </th:block>

                    <button type="submit" class="logout-btn">로그아웃</button>
                </form>
            </div>

        </div>

    </div>

    <!-- Header Search Modal -->
    <div id="searchModal" class="search-modal">
        <div class="search-overlay" onclick="closeSearchModal()"></div>

        <div class="search-modal-content">
            <div class="search-modal-top">
                <div class="search-brand">
                    <span class="search-brand-red">BNK</span>
                    <span class="search-brand-text">부산은행</span>
                </div>

                <button type="button" class="search-close-btn" onclick="closeSearchModal()">✕</button>
            </div>

            <div class="search-modal-box">
                <div class="search-input-wrap">
                    <input type="text" id="modalSearchInput" placeholder="검색어를 입력하세요.">
                    <button type="button" class="search-submit-btn" onclick="submitSearch()">검색</button>
                </div>

                <div class="recommend-keywords">
                    <strong>추천검색어</strong>

                    <div class="keyword-chips">
                        <button type="button" onclick="setKeyword('정기예금')">정기예금</button>
                        <button type="button" onclick="setKeyword('적금')">청년적금</button>
                        <button type="button" onclick="setKeyword('자유적금')">자유적금</button>
                        <button type="button" onclick="setKeyword('부산')">부산</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</header>

<header th:fragment="header_product" class="header header-product">
    <div class="header-inner">
        <div class="logo">
            <a th:href="@{/}">
                <img th:src="@{/images/logo.png}" alt="BNK 부산은행">
            </a>
        </div>
    </div>
</header>

</body>
</html>
