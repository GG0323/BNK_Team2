<!DOCTYPE html>
<html xmlns:th="www.thymeleaf.org">
<head><meta charset="UTF-8"></head>

<body>
	<!-- chatbot -->
	<div th:fragment="chatbot" class="chatbot">
		<div class="custom-chatbot" id="trailChatbot">
		    <img src="/images/bini.png" alt="챗봇" onerror="this.style.display='none'; this.parentNode.innerText='🤖';">
		</div>
		
		<div class="chatbot-window" id="chatbotWindow">
		    <div class="chatbot-header">
		        <div class="chatbot-title">
		            <span class="status-dot"></span>
		            <strong>부산은행 AI 부기</strong>
		        </div>
		        <button type="button" class="close-btn" id="closeChatbot">✕</button>
		    </div>
		
		    <div class="chatbot-messages">
		        <div class="message system">
		            <p>안녕하세요! BNK 부산은행 스마트 챗봇 <b>비니</b>입니다. 무엇을 도와드릴까요?</p>
		        </div>
		    </div>
		
		    <div class="chatbot-input-area">
		        <input type="text" placeholder="질문 내용을 입력해주세요..." id="chatbotInput">
		        <button type="button" id="sendBtn">전송</button>
		    </div>
		</div>
		
	</div>

</body>
</html>
