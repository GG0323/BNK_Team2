<!DOCTYPE html>
<html>
<head>
	<meta charset="UTF-8">
	<title>BNK 문의하기</title>
	<link rel="stylesheet" th:href="@{/css/inquiry/inquiryForm.css}">
	<th:block th:replace="~{fragments/header :: headerCss}"></th:block>
	<th:block th:replace="~{fragments/footer :: footerCss}"></th:block>
	<script th:src="@{/js/inquiry/inquiryForm.js}"></script>
</head>
<body>
<div th:replace="~{fragments/header :: header_default}"></div>

	<header class="page-header">
	  <p class="eyebrow">고객지원</p>
	  <h1>문의하기</h1>
	  <p class="sub">궁금한 점을 남겨주시면 확인 후 답변드립니다</p>
	</header>
    
	<form id="inquiryForm" >
		<div class="category-group">
		    <label class="category-btn">
		        <input type="radio" value="적금 상품" name="INQUIRY_CATEGORY">
		        <span>적금 상품</span>
		    </label>
		
		    <label class="category-btn">
		        <input type="radio" value="가입 관련" name="INQUIRY_CATEGORY">
		        <span>가입 관련</span>
		    </label>
		
		    <label class="category-btn">
		        <input type="radio" value="이자/수익률" name="INQUIRY_CATEGORY">
		        <span>이자/수익률</span>
		    </label>
		
		    <label class="category-btn">
		        <input type="radio" value="계좌 관련" name="INQUIRY_CATEGORY">
		        <span>계좌 관련</span>
		    </label>
		
		    <label class="category-btn">
		        <input type="radio" value="기타" name="INQUIRY_CATEGORY">
		        <span>기타</span>
		    </label>
		</div>
	
		<label class="field-label" for="title">제목</label>
		<input id="title" type="text" name="INQUIRY_TITLE" placeholder="제목을 입력하세요">
		
		<label class="field-label" for="content">문의 내용</label>
		<textarea id="content" name="MSG_CONTENT" placeholder="문의하실 내용을 자세히 적어주세요"></textarea>
		
		<input type="submit" value="문의 접수">
	</form>
	
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
