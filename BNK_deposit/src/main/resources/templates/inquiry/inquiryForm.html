<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>
	
	
	최초로 문의 사항을 작성하는 페이지
	
	문의사항 DB설계 
	
	문의사항을 조합해서 가장 많은 문의가 올라온것 가려내는 ai, -> 프롬프트 활용
	
    
	<form id="inquiryForm" >
		// 토큰 인증용 히든
		<div class="category-group">
		    <label class="category-btn">
		        <input type="radio" value="적금 상품" name="INQUIRY_CATEGORY">
		        <span>적금 상품</span>
		    </label>
		
		    <label class="category-btn">
		        <input type="radio" value="가입 관련" name="INQUIRY_CATEGORY">
		        <span>가입 관련</span>
		    </label>
		
		    <label class="category-btn">
		        <input type="radio" value="이자/수익률" name="INQUIRY_CATEGORY">
		        <span>이자/수익률</span>
		    </label>
		
		    <label class="category-btn">
		        <input type="radio" value="계좌 관련" name="INQUIRY_CATEGORY">
		        <span>계좌 관련</span>
		    </label>
		
		    <label class="category-btn">
		        <input type="radio" value="기타" name="INQUIRY_CATEGORY">
		        <span>기타</span>
		    </label>
		</div>
	
		<input type="text" name="INQUIRY_TITLE" placeholder="INQUIRY_TITLE" > -- 제목
		<input type="text" name="MSG_CONTENT" placeholder="MSG_CONTENT" >     -- 본문
		
		<input type="submit" value="문의 접수">
	</form>
	
	<script>
	
		const inquiryForm = document.querySelector("#inquiryForm");
		
		inquiryForm.addEventListener("submit", (e) => {
			e.preventDefault();
			
			//입력값 확인 
			const formData = new FormData(inquiryForm);

        	const inquiryCategory = formData.get("INQUIRY_CATEGORY");
        	const inquiryTitle = formData.get("INQUIRY_TITLE");
        	const msgContent = formData.get("MSG_CONTENT");
        	// 안내 메세지
            if (!inquiryCategory) {
                alert("문의 카테고리를 선택해주세요.");
                return;
            }

            if (!inquiryTitle || inquiryTitle.trim() === "") {
                alert("제목을 입력해주세요.");
                return;
            }

            if (!msgContent || msgContent.trim() === "") {
                alert("본문을 입력해주세요.");
                return;
            }
			
            
			//폼등록 fetch
			fetch("/api/inquiry/form", {
				method: "POST",
				body: formData
			})
			.then(res => {
				if (!res.ok) {
	                throw new Error(res.status+"문의 등록 실패"+res.body);
	            }
				
				return res.text()
			})
			.then(data => {
				
				// 등록 성공 메세지가 날아오면 등록 성공 alert와 함께 마이페이지의 문의 사항확인 페이지로 전송
				alert("문의가 정상적으로 접수되었습니다.");
				location.href="/inquiry/inquiryList";
			})
			.catch(e => console.log(e));
			
			
			
		});
		
		
		
	</script>
	
	
</body>
</html>
