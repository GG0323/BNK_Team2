<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>




faq리스트 불러오기까지 해둠, css 만들면 완성
	
	
<div id="faqList"></div>
<div class="pagination" id="pagination"></div>



	<script>
	const PAGE_SIZE = 5;    // 한 페이지에 보여줄 FAQ 개수
	let currentPage = 1;    // 현재 페이지 (1부터 시작)
	let openIndex = null;   // 현재 열려있는 FAQ의 인덱스 (없으면 null)
	let faqData = [];       // DB데이터
	
	// 페이지 시작 함수
	fetch("/api/inquiry/faq", {
		method: "GET"
	})
	.then(response => response.json())
	.then(data => {
		console.log(data);
		
		faqData = data;
	    renderFaq();
	
	})
	.catch(e=> console.log(e));
	
	// 페이지 내용 채우기
	function renderFaq(){
		const start = (currentPage - 1) * PAGE_SIZE; // 한페이지에 
		const pageData = faqData.slice(start, start + PAGE_SIZE); // 전체 배열을 페이지 사이즈 별로 분배한다.
		openIndex = null; // 페이지 바뀔때 열린거 닫기
		
		const list = document.querySelector("#faqList");
		list.innerHTML = `
			<button onclick="location.href='/inquiry/inquiryForm'">문의하기</button>
			// 스크립트 문법
			// 토글 함수
			${pageData.map((item, i) => `
			  <div>
			    <button onclick="toggleFaq(${i})">
			      Q${item.faq_no}. ${item.faq_question}
			      <span id="arrow-${i}">▼</span>
			    </button>
			    <div id="answer-${i}" style="display:none">
			      ${item.faq_answer.replace(/\n/g, '<br>')}
			    </div>
			  </div>
			`).join('')}

			<button onclick="location.href='/inquiry/inquiryForm'">문의하기</button>
		`;	
		renderPagination();  // FAQ 목록 다 그린 후 페이지 버튼도 그리기
	}
	
	// 토글 함수
	function toggleFaq(i) {
		const ans = document.getElementById('answer-' + i);
		
		// 다른 항목이 열려있으면 먼저 닫기
		if (openIndex !== null && openIndex !== i) {
		  document.getElementById('answer-' + openIndex).style.display = 'none';
		}
		
		// 현재 클릭한 항목 토글
		const isOpen = ans.style.display === 'block';
		ans.style.display = isOpen ? 'none' : 'block';
		
		// openIndex 업데이트
		openIndex = isOpen ? null : i;
	}
	
	// 페이지 네이션
	function renderPagination() {
		const totalPages = Math.ceil(faqData.length / PAGE_SIZE);
		// 34개 데이터, PAGE_SIZE=5 → Math.ceil(34/5) = 7페이지
		const list = document.querySelector("#faqList");
		
		
		let html = `<button onclick="changePage(${currentPage-1})" ${currentPage===1?'disabled':''}>‹</button>`;
		// 이전 버튼: 1페이지면 disabled
		
		for (let p = 1; p <= totalPages; p++) {
		  html += `<button onclick="changePage(${p})" ${p===currentPage?'style="font-weight:bold"':'' }>${p}</button>`;
		  // 현재 페이지 버튼은 bold 처리
		}
		
		html += `<button onclick="changePage(${currentPage+1})" ${currentPage===totalPages?'disabled':'' }>›</button>`;
		// 다음 버튼: 마지막 페이지면 disabled
		
		const pg = document.querySelector("#pagination");
		pg.innerHTML = html;
	}
	// 페이지 네이션 이동함수
	function changePage(p) {
		const total = Math.ceil(faqData.length / PAGE_SIZE);
		if (p < 1 || p > total) return;  // 범위 벗어나면 무시 (disabled 버튼 방어)
		currentPage = p;
		renderFaq();  // 페이지 바꾸고 다시 그리기
	}
	
	
	
	</script>





</body>
</html>
