<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 금리 등록 페이지</title>
<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}"/>
<link rel="stylesheet" th:href="@{/css/employee/product_rate_write.css}">
</head>
<body>
	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>
	
	<section>
<!-- 		<h2>상품 금리 등록</h2>
		<p class="table_name">테이블: TB_PRODUCT_INTEREST_RATE</p> -->
	
		<form th:action="@{/employee/staff/product/rate/save}" method="POST">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
		
			<!-- <div class="form_group">
				<label><span style="color: red">*</span>상품 FK:</label>
				<input type="number" name="product_no" required placeholder="연결할 상품 코드(NUMBER) 입력"/>
			</div> -->
			
			<!-- 연결할 승인 상품 -->
			<div class="form_group">
				<label for="suggestion_no"><span style="color: red">*</span>연결할 승인 상품 제안 :</label>
				<select id="suggestion_no" name="suggestion_no" required>
					<option value="">-- 승인된 상품 제안서를 선택하세요 --</option>
					<option th:each="aprsug : ${approvedSuggestion}" 
					        th:value="${aprsug.suggestion_no}" 
					        th:text="| [No.${aprsug.suggestion_no} - ${aprsug.product_name}] |">
					</option>
				</select>
			</div>
			
			<div class="form_group">
				<label for="rate_group">금리 구분:</label>
				<select id="rate_group" name="rate_group">
				    <option value="MATURITY" selected>만기 지급</option>
				    <option value="AFTER_MATURITY">만기 후</option>
				    <option value="EARLY_TERMINATION">중도 해지</option>
				</select>
			</div>
			
			<div class="form_group">
				<label><span style="color: red">*</span>금리 구간/조건명:</label>
				<input type="text" name="rate_label" required placeholder="예: 1개월 이상 6개월 미만"/>
			</div>
			
			<div class="form_group">
				<label>연이율:</label>
				<input type="text" name="annual_rate" placeholder="예: 2.10 / -"/>
			</div>
			
			<div class="form_group">
				<label>연수익률:</label>
				<input type="text" name="annual_return_rate" placeholder="예: 2.10 / -"/>
			</div>
			
			<div class="form_group">
				<label for="note">비고:</label>
				<textarea id="note" name="note" rows="4" placeholder="계산식 및 안내 문구 입력..."></textarea>
			</div>
			
			<div class="form_group">
				<label><span style="color: red">*</span>노출 순서:</label>
				<input type="number" name="display_order" required placeholder="화면 출력 순서 (숫자 입력)"/>
			</div>
			
			<div class="form_group">
				<label for="use_yn">사용 여부: </label>		
				<select id="use_yn" name="use_yn">
					<option value="Y">사용 (Y)</option>
					<option value="N">미사용 (N)</option>
				</select>
			</div>
			
			<div class="button_group">
				<button type="button" class="btn_cancel" onclick="history.back();">취소</button>
				<input type="submit" value="금리 등록하기"/>
			</div>
			
		</form>
	</section>
	
</body>
</html>
