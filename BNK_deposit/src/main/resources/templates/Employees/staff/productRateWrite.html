<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 구성 - 금리 정보 등록</title>
<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}"/>
<link rel="stylesheet" th:href="@{/css/employee/staff_CommonPlace.css}" />
<link rel="stylesheet" th:href="@{/css/employee/write/rateWrite.css}">
</head>
<body>

	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>
	
	<div class="main">
		<div th:replace="~{fragments/staffFragment :: goHomePage}"></div>

		<div class="breadcrumb">
			직원 페이지 › 상품 통합 관리 › <span class="current">금리 등록</span>
		</div>	

		<div class="page-title">상품 구성 컴포넌트 관리</div>

		<div class="card">
			<div class="card-title-group">
				<div class="card-title">상품별 금리 구간 및 이율 등록 (Interest Rate Setup)</div>
			</div>
	
			<form th:action="@{/employee/staff/product/rate/save}" method="POST">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
			
				<div class="form-group">
					<label for="suggestion_no"><span class="required">*</span> 연결할 승인 상품 제안서</label>
					<select id="suggestion_no" name="suggestion_no" required>
						<option value="">-- 사양이 승인되어 금리 설정을 대기 중인 상품 제안서를 선택하세요 --</option>
						<option th:each="aprsug : ${approvedSuggestion}" 
						        th:value="${aprsug.suggestion_no}" 
						        th:text="| [No.${aprsug.suggestion_no}] ${aprsug.product_name} |">
						</option>
					</select>
				</div>
				
				<div class="form-group">
					<label for="rate_group">금리 적용 구분</label>
					<select id="rate_group" name="rate_group">
					    <option value="MATURITY" selected>만기 정상 지급 금리 (MATURITY)</option>
					    <option value="AFTER_MATURITY">만기 후 경과 금리 (AFTER_MATURITY)</option>
					    <option value="EARLY_TERMINATION">중도 해지 패널티 금리 (EARLY_TERMINATION)</option>
					</select>
				</div>
				
				<div class="form-group">
					<label for="rate_label"><span class="required">*</span> 금리 적용 구간 및 조건 명칭</label>
					<input type="text" id="rate_label" name="rate_label" required placeholder="예시) 1개월 이상 ~ 6개월 미만 / 스마트 뱅킹 가입 우대 조건 등"/>
				</div>
				
				<div class="form-group">
					<label for="annual_rate">기본 연이율 (단위: %)</label>
					<input type="text" id="annual_rate" name="annual_rate" placeholder="예시) 2.10 (해당 사항 없을 시 '-' 입력)"/>
				</div>
				
				<div class="form-group">
					<label for="annual_return_rate">최대 연수익률 또는 최고 우대이율 (단위: %)</label>
					<input type="text" id="annual_return_rate" name="annual_return_rate" placeholder="예시) 3.50 (해당 사항 없을 시 '-' 입력)"/>
				</div>
				
				<div class="form-group">
					<label for="note">금리 세부 계산식 및 대고객 안내 텍스트 비고</label>
					<textarea id="note" name="note" rows="4" placeholder="중도해지이율 계산법이나 만기 후 기간별 차등 금리 산식 등 상세 안내 문구를 입력하세요..."></textarea>
				</div>
				
				<div class="form-group">
					<label for="display_order"><span class="required">*</span> 고객 화면 출력/노출 순서</label>
					<input type="number" id="display_order" name="display_order" min="1" required placeholder="숫자가 작을수록 상단에 먼저 노출됩니다 (예: 1)"/>
				</div>
				
				<div class="form-group">
					<label for="use_yn">마스터 활성화 사용 여부</label>		
					<select id="use_yn" name="use_yn">
						<option value="Y" selected>활성화 가동 (Y)</option>
						<option value="N">비활성화 대기 (N)</option>
					</select>
				</div>
				
				<div class="btn-group">
					<button type="button" class="btn btn-secondary" onclick="history.back();">취소 및 돌아가기</button>
					<button type="submit" class="btn btn-primary">금리 사양 등록 완료</button>
				</div>
				
			</form>
		</div>
	</div>
	
</body>
</html>
