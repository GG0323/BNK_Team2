<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>영업점 예약 관리</title>
<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}"/>
<link rel="stylesheet" th:href="@{/css/employee/staff/reservation.css}" />
</head>
<body>

<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>

<main class="main">
    <div th:replace="~{fragments/staffFragment :: goHomePage}"></div>

    <div class="breadcrumb">
        <span>직원 페이지</span>
        <span>›</span>
        <span class="current">영업점 예약 관리</span>
    </div>

    <div class="page-title">영업점 예약 관리</div>
    <p class="page-desc">고객의 예약을 확인하고 확정·거절·일정 변경을 처리합니다.</p>

    <!-- 필터 바 -->
    <div class="filter-bar">
        <select id="filterBranch">
            <option value="">전체 영업점</option>
        </select>
        <select id="filterStatus">
            <option value="">전체 상태</option>
            <option value="PENDING">접수</option>
            <option value="CONFIRMED">확정</option>
            <option value="REASSIGNED">변경통보</option>
            <option value="REJECTED">거절</option>
            <option value="CANCELED">취소</option>
        </select>
        <input type="date" id="filterDate" placeholder="날짜 선택">
        <button class="btn-search" onclick="loadReservations()">조회</button>
    </div>

    <!-- 목록 -->
    <div class="res-count" id="resCount"></div>
    <div class="res-list" id="resList">
        <div class="empty-state">조회 버튼을 눌러 예약 목록을 불러오세요.</div>
    </div>

    <!-- 상세·처리 패널 -->
    <div class="detail-panel" id="detailPanel">
        <h3>예약 상세 및 처리</h3>

        <div class="detail-rows" id="detailRows"></div>

        <!-- 처리 세그먼트 (PENDING·CONFIRMED 상태일 때만 활성) -->
        <div class="seg-wrap" id="segWrap">
            <button class="seg-btn" id="segConfirm"  onclick="selectSeg('confirm')">✓ 확정</button>
            <button class="seg-btn" id="segReassign" onclick="selectSeg('reassign')">↔ 매장 사정 변경</button>
            <button class="seg-btn" id="segReject"   onclick="selectSeg('reject')">✕ 거절</button>
        </div>

        <!-- 확정 폼 -->
        <div class="action-form" id="formConfirm">
            <label>처리 사유 (선택)</label>
            <textarea id="confirmReason" placeholder="확정 안내 메시지 (선택)"></textarea>
            <button class="btn-submit confirm" onclick="submitAction('confirm')">예약 확정</button>
        </div>

        <!-- 매장 사정 변경 폼 -->
        <div class="action-form" id="formReassign">
            <label>변경 사유 (필수)</label>
            <textarea id="reassignReason" placeholder="변경 사유를 입력하세요."></textarea>
            <label>변경 영업점</label>
            <select id="reassignBranch" style="width:100%;height:38px;border:1px solid #e0e0e0;border-radius:8px;padding:0 12px;font-size:13px;margin-bottom:10px;"></select>
            <label>변경 날짜·시간</label>
            <div class="date-row">
                <div>
                    <input type="date" id="reassignDate">
                </div>
                <div>
                    <select id="reassignTime" style="width:100%;height:38px;border:1px solid #e0e0e0;border-radius:8px;padding:0 12px;font-size:13px;font-family:inherit;outline:none;">
                        <option value="">시간 선택</option>
                        <option value="09:00">09:00</option>
                        <option value="09:30">09:30</option>
                        <option value="10:00">10:00</option>
                        <option value="10:30">10:30</option>
                        <option value="11:00">11:00</option>
                        <option value="11:30">11:30</option>
                        <option value="13:00">13:00</option>
                        <option value="13:30">13:30</option>
                        <option value="14:00">14:00</option>
                        <option value="14:30">14:30</option>
                        <option value="15:00">15:00</option>
                        <option value="15:30">15:30</option>
                    </select>
                </div>
            </div>
            <button class="btn-submit reassign" onclick="submitAction('reassign')">변경 통보</button>
        </div>

        <!-- 거절 폼 -->
        <div class="action-form" id="formReject">
            <label>거절 사유 (필수)</label>
            <textarea id="rejectReason" placeholder="거절 사유를 입력하세요."></textarea>
            <button class="btn-submit reject" onclick="submitAction('reject')">예약 거절</button>
        </div>
    </div>
</main>

<script th:src="@{/js/staff_reservation.js}"></script>
</body>
</html>
