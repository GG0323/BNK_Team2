<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 구성 - 금리 사양 세부설정</title>
<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}" />
<link rel="stylesheet" th:href="@{/css/employee/staff_CommonPlace.css}" />
<link rel="stylesheet" th:href="@{/css/employee/composition/rateDetail.css}" />
</head>
<body>

	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>

	<div class="main">
		<div class="topbar">
			<button class="logout-btn">로그아웃</button>
		</div>
		<div class="breadcrumb">
			직원 페이지 › 승인된 제안서 리스트 › 제안서 상세보기 › <span class="current">상품 금리 사양</span>
		</div>
		<div class="page-title">상품 구성 컴포넌트 관리</div>

		<div class="card">
			<div class="card-title-group">
				<div class="card-title">금리 정보 (Rate Info)</div>
				<div>
					<span th:if="${rateDto != null}" class="mode-badge badge-view">데이터
						조회 모드</span> <span th:if="${rateDto == null}"
						class="mode-badge badge-new">신규 구성 등록 모드</span>
				</div>
			</div>

			<form id="rateForm">
				<input type="hidden" id="suggestion_no" name="suggestion_no"
					th:value="${suggestion_no}" /> <input type="hidden" id="rate_no"
					name="rate_no" th:value="${rateDto != null ? rateDto.rate_no : ''}" />

				<div class="form-grid">

					<div class="form-group">
						<label>금리 구분 (Rate Group) *</label> <select id="rate_group"
							name="rate_group" required th:disabled="${rateDto != null}">
							<option value="">-- 구분 선택 --</option>
							<option value="MATURITY"
								th:selected="${rateDto != null && rateDto.rate_group == 'MATURITY'}">만기지급
								(MATURITY)</option>
							<option value="AFTER_MATURITY"
								th:selected="${rateDto != null && rateDto.rate_group == 'AFTER_MATURITY'}">만기
								후 금리 (AFTER_MATURITY)</option>
							<option value="EARLY_TERMINATION"
								th:selected="${rateDto != null && rateDto.rate_group == 'EARLY_TERMINATION'}">중도
								해지 금리 (EARLY_TERMINATION)</option>
						</select>
					</div>

					<div class="form-group">
						<label>노출 순서 (Display Order) *</label> <input type="number"
							id="display_order" name="display_order" min="1" max="99999"
							th:value="${rateDto != null ? rateDto.display_order : '1'}"
							th:disabled="${rateDto != null}" />
					</div>

					<div class="form-group full-width">
						<label>금리 구간 / 조건명 (Rate Label) *</label> <input type="text"
							id="rate_label" name="rate_label" required maxlength="200"
							th:value="${rateDto != null ? rateDto.rate_label : ''}"
							th:disabled="${rateDto != null}" />
					</div>

					<div class="form-group">
						<label>연이율 (Annual Rate, %) *</label> <input type="text"
							id="annual_rate" name="annual_rate" maxlength="20"
							th:value="${rateDto != null ? rateDto.annual_rate : ''}"
							th:disabled="${rateDto != null}" />
					</div>

					<div class="form-group">
						<label>연수익률 (Annual Return Rate, %) *</label> <input type="text"
							id="annual_return_rate" name="annual_return_rate" maxlength="20"
							th:value="${rateDto != null ? rateDto.annual_return_rate : ''}"
							th:disabled="${rateDto != null}" />
					</div>

					<div class="form-group">
						<label>사용 여부 (Use YN) *</label>
						<div class="radio-group">
							<label class="radio-label"> <input type="radio"
								name="use_yn" value="Y"
								th:checked="${rateDto == null || rateDto.use_yn == 'Y'}"
								th:disabled="${rateDto != null}"> 사용 (Y)
							</label> <label class="radio-label"> <input type="radio"
								name="use_yn" value="N"
								th:checked="${rateDto != null && rateDto.use_yn == 'N'}"
								th:disabled="${rateDto != null}"> 미사용 (N)
							</label>
						</div>
					</div>

					<div class="form-group"></div>

					<div class="form-group full-width">
						<label>금리 계산식 및 안내 비고 사항 (Note)</label>
						<textarea id="note" name="note" rows="4" maxlength="1000"
							th:text="${rateDto != null ? rateDto.note : ''}"
							th:disabled="${rateDto != null}"></textarea>
					</div>

				</div>
			</form>
		</div>

		<div class="btn-group">
			<a th:href="@{/employee/manager/SUG/approvedList}"
				class="btn btn-secondary">목록으로</a>
			<button type="button" class="btn btn-secondary"
				onclick="goBackToParent()">← 컴포넌트 현황판으로</button>

			<button th:if="${rateDto == null}" type="button"
				class="btn btn-primary" onclick="submitRate()">금리 사양 등록 완료</button>
		</div>
	</div>

	<div class="toast" id="toast"></div>

	<script>
		const parentSugNo = document.getElementById("suggestion_no").value;
		
		/* ── 토스트 알림창 함수 ── */
		function showToast(msg, type = 'success') {
			const t = document.getElementById('toast');
			t.textContent = msg;
			t.className = `toast ${type} show`;
			setTimeout(() => { t.className = 'toast'; }, 3000);
		}
		
		/* ── 이전 승인 제안서 상세 컴포넌트 현황 화면으로 리턴하는 백 스페이스 함수 ── */
		function goBackToParent() {
			if(parentSugNo) {
				location.href = `/employee/manager/SUG/approvedDetail?suggestion_no=${parentSugNo}`;
			} else {
				location.href = "/employee/manager/SUG/approvedList";
			}
		}
		
		/* ── 금리 양식 데이터를 JSON 포맷화 하여 저장 API로 전송하는 함수 ── */
		function submitRate() {
			const form = document.getElementById("rateForm");
			  
			// 브라우저 빌트인 필수 피드백 검증
			if(!form.checkValidity()) {
				form.reportValidity();
				return;
			}
			
			const formData = new FormData(form);
			const jsonObject = {};
			
			formData.forEach((value, key) => {
				jsonObject[key] = value;
			});
			
			console.log("전송할 금리 구성 사양 데이터:", jsonObject);
			
			// 백엔드 비동기 통신 요청 처리
			fetch("/api/employee/approved/registerRate", {
				method: "POST",
				headers: { "Content-Type": "application/json" },
				body: JSON.stringify(jsonObject)
			})
			.then(res => res.json())
			.then(result => {
				if (result === 1) {
					showToast('금리 구성 사양이 성공적으로 셋업되었습니다.', 'success');
					setTimeout(() => {
						goBackToParent();
					}, 1500);
				} else {
					showToast('데이터 저장 도중 예기치 못한 결함이 식별되었습니다.', 'error');
				}
			})
			.catch(err => {
				console.error(err);
				showToast('서버 통신 중 장애가 발생했습니다.', 'error');
			});
		}
	</script>
</body>
</html>
