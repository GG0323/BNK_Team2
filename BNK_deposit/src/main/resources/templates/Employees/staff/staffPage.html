<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta>
<title>Staff MainPage</title>
<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}" />
<link rel="stylesheet" th:href="@{/css/employee/staff/staffPage.css}" />

</head>
<body>

	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>

	<main class="main">
		<div th:replace="~{fragments/staffFragment :: goHomePage}"></div>

		<div class="breadcrumb">
			<span class="current">직원 페이지</span>
		</div>

		<div class="page-header">
			<h1 class="page-title">메인 페이지</h1>
			<p class="page-desc">좋은 하루입니다. 업무를 선택해 주세요</p>
		</div>
		<div class="menu-grid">
			<!-- 업무 활동 카드 -->

			<a class="menu-card primary" th:href="@{/employee/staff/writeSuggestionPage}">
				<div class="card-icon">
					<!-- 아이콘 -->
				</div>
				<div>
					<p class="card-title">제안서 작성 페이지</p>
					<p class="card-sub">신규 상품 제안서를 작성합니다.</p>
				</div>
			</a> 
			<a class="menu-card primary" th:href="@{/employee/financedictionary}">
				<div class="card-icon">
					<!-- 아이콘 -->
				</div>
				<div>
					<p class="card-title">금융 용어 사전 관리</p>
					<p class="card-sub">등록된 금융용어를 조회, 수정, 등록 합니다.</p>
				</div>
			</a> 
			<a class="menu-card primary" th:href="@{/inquiry/inquiryAnswerList}">
				<div class="card-icon">
					<!-- 아이콘 -->
				</div>
				<div>
					<p class="card-title">문의 답변</p>
					<p class="card-sub">문의사항 확인</p>
				</div>
			</a>
			
			<a class="menu-card primary" th:href="@{/employee/staff/reservation}">
			    <div class="card-icon"></div>
			    <div>
			        <p class="card-title">영업점 예약 관리</p>
			        <p class="card-sub">고객 예약을 확정·거절·변경 처리합니다.</p>
			    </div>
			</a>
			
			<a class="menu-card primary" th:href="@{/inquiry/faqCandidateList}">
			    <div class="card-icon"></div>
			    <div>
			        <p class="card-title">FaQ 등록 후보</p>
			        <p class="card-sub">1 : 1 문의를 정리해 표시합니다.</p>
			    </div>
			</a>
			
		</div>

	</main>

</body>
</html>
