<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>승인된 상품 리스트</title>
<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}" />
<link rel="stylesheet" th:href="@{/css/employee/staff_CommonPlace.css}" />
<link rel="stylesheet" th:href="@{/css/employee/apr_product_list.css}" />
</head>
<body>
	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>

	<div class="main">
		<div th:replace="~{fragments/staffFragment :: goHomePage}"></div>


		<div class="breadcrumb">
			직원 페이지 › <span class="current">승인된 제안서 리스트</span>
		</div>

		<div class="page-title">승인된 제안서 리스트</div>
		<div class="form-card">
			<div class="section-title">상품 컴포넌트 구성 현황</div>
			<div class="table-responsive">
				<table>
					<thead>
						<tr>
							<th style="width: 80px;">제안 FK</th>
							<th>제안 상품명</th>
							<th style="width: 120px;">최저 금리</th>
							<th style="width: 120px;">최고 금리</th>
							<th style="width: 120px;">금리 번호</th>
							<th style="width: 120px;">약관 번호</th>
							<th style="width: 120px;">설명 번호</th>
							<th style="width: 120px;">조건 번호</th>
							<th style="width: 100px; text-align: center;">상세보기</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="aprsug : ${approvedSuggestion}">

							<td class="text-id" th:text="${aprsug.suggestion_no}">1</td>
							<td class="text-name" th:text="${aprsug.product_name}">기본 상품
								제안명</td>
							<td class="text-rate"
								th:text="|${aprsug.proposed_min_interest_rate}%|">0.00%</td>
							<td class="text-rate"
								th:text="|${aprsug.proposed_max_interest_rate}%|">0.00%</td>
							<td>
								<div th:if="${aprsug.rate_no != null and aprsug.rate_no != 0}">
									<span class="comp-status status-assigned">구성 완료</span> <span
										class="sub-no" th:text="|No. ${aprsug.rate_no}|"></span>
								</div>
								<div th:if="${aprsug.rate_no == null or aprsug.rate_no == 0}">
									<span class="comp-status status-empty">미등록</span>
								</div>
							</td>
							<td>
								<div th:if="${aprsug.terms_no != null and aprsug.terms_no != 0}">
									<span class="comp-status status-assigned">구성 완료</span> <span
										class="sub-no" th:text="|No. ${aprsug.terms_no}|"></span>
								</div>
								<div th:if="${aprsug.terms_no == null or aprsug.terms_no == 0}">
									<span class="comp-status status-empty">미등록</span>
								</div>
							</td>
							<td>
								<div
									th:if="${aprsug.description_no != null and aprsug.description_no != 0}">
									<span class="comp-status status-assigned">구성 완료</span> <span
										class="sub-no" th:text="|No. ${aprsug.description_no}|"></span>
								</div>
								<div
									th:if="${aprsug.description_no == null or aprsug.description_no == 0}">
									<span class="comp-status status-empty">미등록</span>
								</div>
							</td>
							<td>
								<div
									th:if="${aprsug.condition_no != null and aprsug.condition_no != 0}">
									<span class="comp-status status-assigned">구성 완료</span> <span
										class="sub-no" th:text="|No. ${aprsug.condition_no}|"></span>
								</div>
								<div
									th:if="${aprsug.condition_no == null or aprsug.condition_no == 0}">
									<span class="comp-status status-empty">미등록</span>
								</div>
							</td>
							<td style="text-align: center;"><a class="btn-action"
								th:href="@{|/employee/staff/product/approved/details/${aprsug.suggestion_no}|}">
									상세보기 </a></td>
						</tr>
						<tr th:if="${#lists.isEmpty(approvedSuggestion)}">
							<td colspan="9" class="empty-row">현재 등록 처리할 승인된 상품 내역이 존재하지
								않습니다.</td>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>

</body>
</html>
