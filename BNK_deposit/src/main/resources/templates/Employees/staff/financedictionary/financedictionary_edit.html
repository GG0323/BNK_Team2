<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>금융 용어 수정</title>

<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

<style>
    body { font-family: sans-serif; }
    .detail-table { width: 100%; border-collapse: collapse; margin-top: 20px; border-top: 2px solid #111; }
    .detail-table th, .detail-table td { border-bottom: 1px solid #ddd; padding: 15px; }
    .detail-table th { background-color: #f9f9f9; width: 20%; text-align: center; }
    .detail-table input, .detail-table textarea, .detail-table select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    .btn-wrap { text-align: center; margin-top: 30px; }
    .submit-btn { padding: 10px 30px; background: #d71920; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold;}
</style>
</head>
<body>
    <h1 style="background-color: #111; color: white; padding: 15px; border-radius: 10px;">금융 용어 수정</h1>
    
    <form id="editForm">
        <input type="hidden" name="dictionary_no" id="dictionary_no">
        
        <table class="detail-table">
            <tr>
                <th>카테고리</th>
                <td>
                    <select name="dictionary_category" id="dictionary_category" required>
					    <option value="예적금">예적금</option>
					    <option value="대출">대출</option>
					    <option value="보험">보험</option>
					    <option value="카드">카드</option>
					    <option value="청약">청약</option>
					</select>
                </td>
            </tr>
            <tr>
                <th>용어명</th>
                <td><input type="text" name="dictionary_nm" id="dictionary_nm" required></td>
            </tr>
            <tr>
                <th>용어 설명</th>
                <td><textarea name="dictionary_content" id="dictionary_content" rows="10" required></textarea></td>
            </tr>
        </table>
        <div class="btn-wrap">
		    <button type="submit" class="submit-btn">수정완료</button>
		
		    <button type="button" id="deleteBtn" class="delete-btn">
		        삭제하기
		    </button>
		
		    <a href="/finance/employee/financedictionary" id="cancelBtn"
		       style="margin-left: 10px; color: #666; text-decoration: none;">
		        취소
		    </a>
		</div>
    </form>

    <script src="/js/members/common.js"></script>
    <script src="/js/common/financedictionary_edit.js"></script>
</body>
</html>
