<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>금융 용어 등록</title>

<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

<link rel="stylesheet" th:href="@{/css/common/employee_financedictionary.css}">
<script src="/js/members/common.js" defer></script>
<script src="/js/common/financedictionary_write.js" defer></script>
</head>

<body>
<div class="admin-wrap">

    <div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>

    <!-- 우측 본문 -->
    <main class="main">

	    <div class="topbar">
		    <form th:action="@{/employee/logout}" method="post">
		        <input type="hidden"
		               th:name="${_csrf.parameterName}"
		               th:value="${_csrf.token}">
		        <button type="submit" class="logout-btn">
		            로그아웃
		        </button>
		    </form>
		</div>

        <div class="breadcrumb">
		    로그인 &gt; 금융 사전 관리 &gt; <span class="current">신규 용어 등록</span>
		</div>
		
		<div class="page-header">
		    <h1 class="page-title">신규 용어 등록</h1>
		    <p class="page-desc">사용자 금융 용어 사전에 노출할 용어와 설명을 등록합니다.</p>
		</div>
	
		<section class="content-box form-content-box">
            <form id="writeForm" class="dictionary-form">
                <table class="detail-table">
                    <tr>
                        <th>카테고리</th>
                        <td>
                            <select name="dictionary_category" id="dictionary_category" required>
                                <option value="예적금">예적금</option>
                                <option value="대출">대출</option>
                                <option value="보험">보험</option>
                                <option value="카드">카드</option>
                                <option value="청약">청약</option>
                            </select>
                        </td>
                    </tr>

                    <tr>
                        <th>용어명</th>
                        <td>
                            <input type="text" name="dictionary_nm" required placeholder="예: 복리">
                        </td>
                    </tr>

                    <tr>
                        <th>용어 설명</th>
                        <td>
                            <textarea name="dictionary_content" rows="10" required placeholder="상세 설명을 입력하세요"></textarea>
                        </td>
                    </tr>
                </table>

                <div class="btn-wrap">
                    <button type="submit" class="submit-btn">저장하기</button>
                    <a href="/employee/financedictionary" class="cancel-btn">취소</a>
                </div>
            </form>
        </section>

    </main>
</div>
</body>
</html>
