<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>금융 용어 등록</title>

<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">

<style>
    body { font-family: sans-serif; }
    .detail-table { width: 100%; border-collapse: collapse; margin-top: 20px; border-top: 2px solid #111; }
    .detail-table th, .detail-table td { border-bottom: 1px solid #ddd; padding: 15px; }
    .detail-table th { background-color: #f9f9f9; width: 20%; text-align: center; }
    .detail-table input, .detail-table textarea, .detail-table select { width: 100%; padding: 10px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 5px; }
    .btn-wrap { text-align: center; margin-top: 30px; }
    .submit-btn { padding: 10px 30px; background: #d71920; color: white; border: none; cursor: pointer; border-radius: 5px; font-weight: bold;}
</style>


</head>
<body>
    <h1 style="background-color: #111; color: white; padding: 15px; border-radius: 10px;">금융 용어 등록</h1>
    
    <form id="writeForm">
        <table class="detail-table">
            <tr>
                <th>카테고리</th>
                <td>
                    <select name="dictionary_category" id="dictionary_category" required>
					    <option value="예적금">예적금</option>
					    <option value="대출">대출</option>
					    <option value="보험">보험</option>
					    <option value="카드">카드</option>
					    <option value="청약">청약</option>
					</select>
                </td>
            </tr>
            <tr>
                <th>용어명</th>
                <td><input type="text" name="dictionary_nm" required placeholder="예: 복리"></td>
            </tr>
            <tr>
                <th>용어 설명</th>
                <td><textarea name="dictionary_content" rows="10" required placeholder="상세 설명을 입력하세요"></textarea></td>
            </tr>
        </table>
        <div class="btn-wrap">
            <button type="submit" class="submit-btn">저장하기</button>
            <a href="/financedictionary" style="margin-left: 10px; color: #666; text-decoration: none;">취소</a>
        </div>
    </form>

    <script src="/js/members/common.js"></script>
    <script src="/js/common/financedictionary_write.js"></script>
</body>
</html>
