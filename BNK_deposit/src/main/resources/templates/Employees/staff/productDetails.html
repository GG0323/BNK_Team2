<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>제안서 상세보기 및 사양 관리</title>
<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}"/>
<link rel="stylesheet" th:href="@{/css/employee/staff_CommonPlace.css}"/>
<style>
/* ===== 리스트 보관용 폼 카드 크기 맞춤 ===== */
.form-card {
background: #fff;
border-radius: 12px;
border: 1px solid #E8E8E8;
padding: 2rem;
max-width: 1100px;
margin-bottom: 2rem;
}

.section-title {
font-size: 11px;
font-weight: 700;
color: #E8282F;
letter-spacing: 0.5px;
text-transform: uppercase;
margin-bottom: 1.5rem;
padding-bottom: 8px;
border-bottom: 1px solid #F0F0F0;
}

/* ===== 테이블 고급화 서식 ===== */
.table-responsive {
width: 100%;
overflow-x: auto;
margin-bottom: 2rem;
}

table {
width: 100%;
border-collapse: collapse;
text-align: left;
font-size: 13px;
}

th {
color: #555;
font-weight: 600;
font-size: 12px;
padding: 12px 10px;
border-bottom: 2px solid #E0E0E0;
background: #fff;
}

td {
padding: 14px 10px;
color: #333;
border-bottom: 1px solid #EEEEEE;
vertical-align: middle;
}

tr:last-child td {
border-bottom: none;
}

.text-id { font-size: 12px; font-weight: 500; color: #888; }
.text-name { font-size: 13px; font-weight: 600; color: #111; }
.text-rate { font-weight: 600; color: #222; }

/* ===== 관제탑 전용 한 행 정렬 컴포넌트 서식 ===== */
.comp-row {
display: flex;
justify-content: space-between;
align-items: center;
padding: 1rem 10px;
border-bottom: 1px solid #EEEEEE;
}
.comp-row:last-child { border-bottom: none; }

.comp-info { display: flex; align-items: center; gap: 15px; }
.comp-label { font-size: 13px; font-weight: 600; color: #111; min-width: 150px; }

/* ===== 컴포넌트 상태 뱃지 ===== */
.comp-status {
display: inline-block;
padding: 4px 10px;
border-radius: 6px;
font-size: 11px;
font-weight: 600;
text-align: center;
}
.status-assigned { background: #EAF7EE; color: #1E7E34; }
.status-empty { background: #FDF2F2; color: #E8282F; }
.sub-no { font-size: 11px; color: #999; }

/* ===== 상세보기 및 액션 버튼 가이드 ===== */
.btn-action {
display: inline-block;
padding: 6px 14px;
font-size: 12px;
font-weight: 600;
border: 1px solid #E0E0E0;
border-radius: 6px;
background: #fff;
color: #555;
cursor: pointer;
transition: all 0.15s;
text-decoration: none;
text-align: center;
white-space: nowrap;
}
.btn-action:hover { border-color: #111; color: #111; background: #FAFAFA; }

.btn-action.assign-trigger { border-color: #E8282F; color: #E8282F; background: #FFFBFB; }
.btn-action.assign-trigger:hover { background: #E8282F; color: #fff; }

.btn-row-bottom { display: flex; justify-content: flex-end; max-width: 1100px; margin-top: 1.5rem; }
</style>
</head>
<body>
	
	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>
	
	<div class="main">
		<div class="topbar">
			<button class="logout-btn">로그아웃</button>
		</div>
	
		<div class="breadcrumb">
			직원 페이지 › 승인된 제안서 리스트 › <span class="current">제안서 상세보기</span>
		</div>
	
		<div class="page-title">제안서 상세보기</div>
	
		<div class="form-card">
			<div class="section-title">기본 정보</div>
			<div class="table-responsive">
				<table>
					<thead>
						<tr>
							<th style="width: 100px;">제안서 번호</th>
							<th>상품명</th>
							<th style="width: 150px;">최저 금리</th>
							<th style="width: 150px;">최고 금리</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td class="text-id" th:text="${aprSugDto.suggestion_no}">1</td>
							<td class="text-name" th:text="${aprSugDto.product_name}">기본 상품 제안명</td>
							<td class="text-rate" th:text="|${aprSugDto.proposed_min_interest_rate}%|">0.00%</td>
							<td class="text-rate" th:text="|${aprSugDto.proposed_max_interest_rate}%|">0.00%</td>
						</tr>
					</tbody>
				</table>
			</div>
			
			<div class="section-title">상품 컴포넌트 연계 제어 구조</div>
			
			<div class="comp-row">
				<div class="comp-info">
					<span class="comp-label">상품 금리 사양</span>
					<th:block th:if="${aprSugDto.rate_no != null and aprSugDto.rate_no != 0}">
						<span class="comp-status status-assigned">구성 완료</span>
						<span class="sub-no" th:text="|No. ${aprSugDto.rate_no}|"></span>
					</th:block>
					<th:block th:if="${aprSugDto.rate_no == null or aprSugDto.rate_no == 0}">
						<span class="comp-status status-empty">미등록</span>
					</th:block>
				</div>
				<div>
					<button th:if="${aprSugDto.rate_no == null or aprSugDto.rate_no == 0}" class="btn-action assign-trigger" onclick="rateWrite()">상품 금리 작성하기</button>
					<button th:if="${aprSugDto.rate_no != null and aprSugDto.rate_no != 0}" class="btn-action" th:onclick="ratePage([[${aprSugDto.rate_no}]])">자세히 보기</button>
				</div>
			</div>
			
			<div class="comp-row">
				<div class="comp-info">
					<span class="comp-label">상품 약관 사양</span>
					<th:block th:if="${aprSugDto.terms_no != null and aprSugDto.terms_no != 0}">
						<span class="comp-status status-assigned">구성 완료</span>
						<span class="sub-no" th:text="|No. ${aprSugDto.terms_no}|"></span>
					</th:block>
					<th:block th:if="${aprSugDto.terms_no == null or aprSugDto.terms_no == 0}">
						<span class="comp-status status-empty">미등록</span>
					</th:block>
				</div>
				<div>
					<button th:if="${aprSugDto.terms_no == null or aprSugDto.terms_no == 0}" class="btn-action assign-trigger" onclick="termsWrite()">상품 약관 작성하기</button>
					<button th:if="${aprSugDto.terms_no != null and aprSugDto.terms_no != 0}" class="btn-action" th:onclick="termsPage([[${aprSugDto.terms_no}]])">자세히 보기</button>
				</div>
			</div>
			
			<div class="comp-row">
				<div class="comp-info">
					<span class="comp-label">상품 요약 설명 사양</span>
					<th:block th:if="${aprSugDto.description_no != null and aprSugDto.description_no != 0}">
						<span class="comp-status status-assigned">구성 완료</span>
						<span class="sub-no" th:text="|No. ${aprSugDto.description_no}|"></span>
					</th:block>
					<th:block th:if="${aprSugDto.description_no == null or aprSugDto.description_no == 0}">
						<span class="comp-status status-empty">미등록</span>
					</th:block>
				</div>
				<div>
					<button th:if="${aprSugDto.description_no == null or aprSugDto.description_no == 0}" class="btn-action assign-trigger" onclick="descWrite()">상품 설명 작성하기</button>
					<button th:if="${aprSugDto.description_no != null and aprSugDto.description_no != 0}" class="btn-action" th:onclick="descPage([[${aprSugDto.description_no}]])">자세히 보기</button>
				</div>
			</div>
			
			<div class="comp-row">
				<div class="comp-info">
					<span class="comp-label">가입 제약 조건 사양</span>
					<th:block th:if="${aprSugDto.condition_no != null and aprSugDto.condition_no != 0}">
						<span class="comp-status status-assigned">구성 완료</span>
						<span class="sub-no" th:text="|No. ${aprSugDto.condition_no}|"></span>
					</th:block>
					<th:block th:if="${aprSugDto.condition_no == null or aprSugDto.condition_no == 0}">
						<span class="comp-status status-empty">미등록</span>
					</th:block>
				</div>
				<div>
					<button th:if="${aprSugDto.condition_no == null or aprSugDto.condition_no == 0}" class="btn-action assign-trigger" onclick="condWrite()">상품 조건 작성하기</button>
					<button th:if="${aprSugDto.condition_no != null and aprSugDto.condition_no != 0}" class="btn-action" th:onclick="condPage([[${aprSugDto.condition_no}]])">자세히 보기</button>
				</div>
			</div>
		</div>
		
		<div class="btn-row-bottom">
			<a class="btn-action" style="padding: 10px 24px;" th:href="@{/employee/staff/product/approved/list}">승인된 제안서 목록으로 돌아가기</a>
		</div>
		
	</div>

	<script th:inline="javascript">
	/*<![CDATA[*/
		// 상위 제안서 번호 (공통으로 사용됨)
		const suggestionNo = /*[[${aprSugDto.suggestion_no}]]*/ 0;
		
		// --- [작성하기 동선] ---
		// 새 스펙 생성 페이지로 갈 때는 항상 상위 제안서 번호(?suggestion_no=X)를 달고 가야 매핑이 됩니다.
		function rateWrite(){
			location.href = '/employee/staff/product/rate?suggestion_no=' + suggestionNo;
		}
		function termsWrite(){
			location.href = '/employee/staff/productTerm?suggestion_no=' + suggestionNo;
		}
		
		// --- [조건 조회 및 등록 연계] ---
		function descWrite(){
			location.href = '/employee/staff/product/description?suggestion_no=' + suggestionNo;
		}
		function condWrite(){
			location.href = '/employee/staff/product/condition?suggestion_no=' + suggestionNo;
		}
		
		// --- [자세히 보기 동선] ---
		// 타임리프가 동적으로 태그에 심어준 각 고유 시퀀스 번호(no)를 받아서 전송하며,
		// 돌아올 관제탑 번호 지정을 위해 뒤에 suggestion_no를 함께 파라미터로 붙여 보냅니다.
		function ratePage(no){
			location.href = '/employee/staff/product/rate/detail/' + no + '?suggestion_no=' + suggestionNo;
		}
		
		function termsPage(no){
			location.href = '/employee/staff/productTerm/detail/' + no + '?suggestion_no=' + suggestionNo;
		}
		
		function descPage(no){
			location.href = '/employee/staff/product/description/detail/' + no + '?suggestion_no=' + suggestionNo;
		}
		
		// 조건 상세 페이지 바인딩 연계 주소 수정 완료
		function condPage(no){
			location.href = '/employee/staff/product/condition/detail/' + no + '?suggestion_no=' + suggestionNo;
		}
	/*]]>*/
	</script>
</body>
</html>
