<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 디테일 페이지</title>
</head>
<body>

<h2 th:text="|상품명: ${prdDtResDto.product.product_name}|"></h2>
<hr>
<div style="border: 1px solid black; width: 450px; margin-top: 20px; padding: 15px; border-radius: 5px;">
	<form th:action="@{/employee/staff/product/status/update}" method="POST">
	    <h3 style="color: black; margin-top: 0;">상품 기본 정보</h3>
	    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />	
		<div class="form_group">
	        <label>상품 PK (수정 불가):</label>
	        <input type="text" th:value="${prdDtResDto.product.product_no}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
		<div class="form_group">
			<label>상품명 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.product_name}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
			<label>상품 구분(수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.product_type}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>기본/최저 금리(수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.min_interest_rate}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>최고 우대 금리 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.max_interest_rate}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>이자 지급 방식 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.interest_payment_type}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>이자 계산 방식 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.interest_calc_type}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>판매 시작일 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.sale_start_date}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>판매 종료일 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.sale_end_date}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
		<div class="form_group" style="margin-top: 10px;">
			<label for="product_status">판매 상태 (수정 가능):</label>
			<select id="product_status" name="product_status">
				<option value="SALE" th:selected="${prdDtResDto.product.product_status == '판매중'}">판매중</option>
				<option value="NON_SALE" th:selected="${prdDtResDto.product.product_status == '판매중지'}">판매중지</option>
			</select>
		</div>
	    <div class="form_group">
	    	<label>지점 가입 가능 여부 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.branch_join_yn}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>인터넷 가입 가능 여부(수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.internet_join_yn}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>모바일 가입 가능 여부 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.mobile_join_yn}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>생성일 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.created_at}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div class="form_group">
	    	<label>수정일 (수정 불가):</label>
		    <input type="text" th:value="${prdDtResDto.product.updated_at}" disabled="disabled" style="background-color: #eee;"/><br>
	    </div>
	    <div style="margin: 0 auto; margin-top: 15px;">
	        <button type="submit" style="padding: 5px 20px; font-weight: bold; cursor: pointer; margin: 0 auto;">상품 상태 변경하기</button>
	    </div>
	</form>
</div>


<div style="border: 1px solid #1e88e5; width: 450px; margin-top: 20px; padding: 15px; border-radius: 5px;">
	<form th:action="@{/employee/staff/product/status/update}" method="POST">
	    <h3 style="color: #1e88e5; margin-top: 0;">상품 금리 정보 (수정 불가)</h3>
	    <div class="form_group">
	        <label>금리 번호 PK:</label>
	        <input type="text" th:value="${prdDtResDto.rate != null ? prdDtResDto.rate.rate_no : '등록 정보 없음'}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>금리 구분:</label>
	        <input type="text" th:value="${prdDtResDto.rate != null ? prdDtResDto.rate.rate_group : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>금리 구간/조건명:</label>
	        <input type="text" th:value="${prdDtResDto.rate != null ? prdDtResDto.rate.rate_label : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>연이율:</label>
	        <input type="text" th:value="${prdDtResDto.rate != null ? prdDtResDto.rate.annual_rate : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>연수익률:</label>
	        <input type="text" th:value="${prdDtResDto.rate != null ? prdDtResDto.rate.annual_return_rate : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>비고:</label>
	        <input type="text" th:value="${prdDtResDto.rate != null ? prdDtResDto.rate.note : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>노출 순서:</label>
	        <input type="text" th:value="${prdDtResDto.rate != null ? prdDtResDto.rate.display_order : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>사용 여부:</label>
	        <input type="text" th:value="${prdDtResDto.rate != null ? prdDtResDto.rate.use_yn : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
    </form>
</div>


<div style="border: 1px solid #43a047; width: 450px; margin-top: 20px; padding: 15px; border-radius: 5px;">
	<form th:action="@{/employee/staff/product/status/update}" method="POST">
	    <h3 style="color: #43a047; margin-top: 0;">상품 설명 정보 (수정 불가)</h3>
	    
	    <div class="form_group" th:if="${prdDtResDto.description != null && prdDtResDto.description.image_url != null}">
	        <label>상품 대표 이미지:</label><br>
	        <img th:src="${prdDtResDto.description.image_url}" alt="상품 이미지" style="max-width: 100%; height: auto; margin-top: 5px; border: 1px solid #ccc;"/>
	    </div>
	    
	    <div class="form_group">
	        <label>부제목:</label>
	        <input type="text" th:value="${prdDtResDto.description != null ? prdDtResDto.description.subtitle : ''}" disabled="disabled" style="background-color: #eee; width: 100%;"/>
	    </div>
	    <div class="form_group">
	        <label>홍보 문구:</label>
	        <textarea rows="2" th:text="${prdDtResDto.description != null ? prdDtResDto.description.content : ''}" disabled="disabled" style="background-color: #eee; width: 100%; resize: none;"></textarea>
	    </div>
	    <div class="form_group">
	        <label>가입 자격 설명:</label>
	        <textarea rows="2" th:text="${prdDtResDto.description != null ? prdDtResDto.description.eligibility_desc : ''}" disabled="disabled" style="background-color: #eee; width: 100%; resize: none;"></textarea>
	    </div>
	    <div class="form_group">
	        <label>우대 금리 요약:</label>
	        <input type="text" th:value="${prdDtResDto.description != null ? prdDtResDto.description.preferential_rate_summary : ''}" disabled="disabled" style="background-color: #eee; width: 100%;"/>
	    </div>
	    <div class="form_group">
	        <label>상품 특징 설명:</label>
	        <textarea rows="2" th:text="${prdDtResDto.description != null ? prdDtResDto.description.product_feature_desc : ''}" disabled="disabled" style="background-color: #eee; width: 100%; resize: none;"></textarea>
	    </div>
	    <div class="form_group">
	        <label>가입 방법 설명:</label>
	        <input type="text" th:value="${prdDtResDto.description != null ? prdDtResDto.description.join_method_desc : ''}" disabled="disabled" style="background-color: #eee; width: 100%;"/>
	    </div>
	    <div class="form_group">
	        <label>세제 혜택 설명:</label>
	        <input type="text" th:value="${prdDtResDto.description != null ? prdDtResDto.description.tax_benefit_desc : ''}" disabled="disabled" style="background-color: #eee; width: 100%;"/>
	    </div>
	    <div class="form_group">
	        <label>유의 사항 안내:</label>
	        <textarea rows="2" th:text="${prdDtResDto.description != null ? prdDtResDto.description.caution_note : ''}" disabled="disabled" style="background-color: #eee; width: 100%; resize: none;"></textarea>
	    </div>
	    <div class="form_group">
	        <label>공시 승인 번호:</label>
	        <input type="text" th:value="${prdDtResDto.description != null ? prdDtResDto.description.disclosure_approval_desc : ''}" disabled="disabled" style="background-color: #eee; width: 100%;"/>
	    </div>
    </form>
</div>


<div style="border: 1px solid #e65100; width: 450px; margin-top: 20px; padding: 15px; border-radius: 5px;">
	<form th:action="@{/employee/staff/product/status/update}" method="POST">
	    <h3 style="color: #e65100; margin-top: 0;">상품 가입 조건 정보 (수정 불가)</h3>
	    <div class="form_group">
	        <label>최소 가입 나이:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null ? prdDtResDto.condition.min_age + ' 세' : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>최대 가입 나이:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null && prdDtResDto.condition.max_age != null ? prdDtResDto.condition.max_age + ' 세' : '제한 없음'}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>성별 제한:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null && prdDtResDto.condition.gender != null ? prdDtResDto.condition.gender : '제한 없음(ALL)'}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>고객 유형:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null ? prdDtResDto.condition.customer_type : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>외국인 가입 가능 여부:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null ? prdDtResDto.condition.foreigner_available_yn : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>최소 가입 금액:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null ? #numbers.formatInteger(prdDtResDto.condition.min_join_amount, 0, 'COMMA') + ' 원' : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>최대 가입 금액:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null && prdDtResDto.condition.max_join_amount != null ? #numbers.formatInteger(prdDtResDto.condition.max_join_amount, 0, 'COMMA') + ' 원' : '제한 없음'}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>최소 가입 기간:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null ? prdDtResDto.condition.min_term_months + ' 개월' : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>최대 가입 기간:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null && prdDtResDto.condition.max_term_months != null ? prdDtResDto.condition.max_term_months + ' 개월' : '제한 없음'}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>예금자 보호 여부:</label>
	        <input type="text" th:value="${prdDtResDto.condition != null ? prdDtResDto.condition.depositor_protection_yn : ''}" disabled="disabled" style="background-color: #eee;"/>
	    </div>
	    <div class="form_group">
	        <label>조건 관련 비고:</label>
	        <textarea rows="2" th:text="${prdDtResDto.condition != null ? prdDtResDto.condition.condition_note : ''}" disabled="disabled" style="background-color: #eee; width: 100%; resize: none;"></textarea>
	    </div>
    </form>
</div>

</body>
</html>
