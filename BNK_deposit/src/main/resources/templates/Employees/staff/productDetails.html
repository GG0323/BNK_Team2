<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>제안서 상세보기 및 사양 관리</title>

	<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}" />
	<link rel="stylesheet" th:href="@{/css/employee/staff_CommonPlace.css}" />
	<link rel="stylesheet" th:href="@{/css/employee/productDetails.css}" />
	
	<script th:src="@{/js/employees/productDetails.js}" defer></script>

</head>
<body>
	
	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>

	<input type="hidden" id="suggestion_no" th:value="${aprSugDto.suggestion_no}" />
	<input type="hidden" id="rate_no" th:value="${aprSugDto.rate_no}" />
	<input type="hidden" id="condition_no" th:value="${aprSugDto.condition_no}" />
	<input type="hidden" id="description_no" th:value="${aprSugDto.description_no}" />
	<input type="hidden" id="terms_no" th:value="${aprSugDto.terms_no}" />

	<div class="main">
		<div th:replace="~{fragments/staffFragment :: goHomePage}"></div>


		<div class="breadcrumb">
			직원 페이지 › 승인된 제안서 리스트 › <span class="current">제안서 상세보기</span>
		</div>

		<div class="page-title">제안서 상세보기</div>

		<div class="form-card">
			<div class="section-title">기본 정보</div>
			<div class="table-responsive">
				<table>
					<thead>
						<tr>
							<th style="width: 100px;">제안서 번호</th>
							<th>상품명</th>
							<th style="width: 150px;">최저 금리</th>
							<th style="width: 150px;">최고 금리</th>
						</tr>
					</thead>
					<tbody>
						<tr>
							<td class="text-id" th:text="${aprSugDto.suggestion_no}">1</td>
							<td class="text-name" th:text="${aprSugDto.product_name}">기본 상품 제안명</td>
							<td class="text-rate" th:text="|${aprSugDto.proposed_min_interest_rate}%|">0.00%</td>
							<td class="text-rate" th:text="|${aprSugDto.proposed_max_interest_rate}%|">0.00%</td>
						</tr>
					</tbody>
				</table>
			</div>

			<div class="section-title">상품 컴포넌트 연계 제어 구조</div>

			<div class="comp-row">
				<div class="comp-info">
					<span class="comp-label">상품 금리 사양</span>
					<th:block th:if="${aprSugDto.rate_no != null and aprSugDto.rate_no != 0}">
						<span class="comp-status status-assigned">구성 완료</span>
						<span class="sub-no" th:text="|No. ${aprSugDto.rate_no}|"></span>
					</th:block>
					<th:block th:if="${aprSugDto.rate_no == null or aprSugDto.rate_no == 0}">
						<span class="comp-status status-empty">미등록</span>
					</th:block>
				</div>
				<div>
					<button th:if="${aprSugDto.rate_no == null or aprSugDto.rate_no == 0}" 
							class="btn-action assign-trigger" 
							onclick="rateWrite()">
							상품 금리 작성하기
					</button>
					
					<button	th:if="${aprSugDto.rate_no != null and aprSugDto.rate_no != 0}"
							class="btn-action" th:onclick="ratePage([[${aprSugDto.rate_no}]])">
							자세히 보기
					</button>
				</div>
			</div>

			<div class="comp-row">
				<div class="comp-info">
					<span class="comp-label">상품 약관 사양</span>
					<th:block
						th:if="${aprSugDto.terms_no != null and aprSugDto.terms_no != 0}">
						<span class="comp-status status-assigned">구성 완료</span>
						<span class="sub-no" th:text="|No. ${aprSugDto.terms_no}|"></span>
					</th:block>
					<th:block
						th:if="${aprSugDto.terms_no == null or aprSugDto.terms_no == 0}">
						<span class="comp-status status-empty">미등록</span>
					</th:block>
				</div>
				<div>
					<button
						th:if="${aprSugDto.terms_no == null or aprSugDto.terms_no == 0}"
						class="btn-action assign-trigger" onclick="termsWrite()">상품
						약관 작성하기</button>
					<button
						th:if="${aprSugDto.terms_no != null and aprSugDto.terms_no != 0}"
						class="btn-action"
						th:onclick="termsPage([[${aprSugDto.terms_no}]])">자세히 보기</button>
				</div>
			</div>

			<div class="comp-row">
				<div class="comp-info">
					<span class="comp-label">상품 요약 설명 사양</span>
					<th:block
						th:if="${aprSugDto.description_no != null and aprSugDto.description_no != 0}">
						<span class="comp-status status-assigned">구성 완료</span>
						<span class="sub-no" th:text="|No. ${aprSugDto.description_no}|"></span>
					</th:block>
					<th:block
						th:if="${aprSugDto.description_no == null or aprSugDto.description_no == 0}">
						<span class="comp-status status-empty">미등록</span>
					</th:block>
				</div>
				<div>
					<button
						th:if="${aprSugDto.description_no == null or aprSugDto.description_no == 0}"
						class="btn-action assign-trigger" onclick="descWrite()">상품
						설명 작성하기</button>
					<button
						th:if="${aprSugDto.description_no != null and aprSugDto.description_no != 0}"
						class="btn-action"
						th:onclick="descPage([[${aprSugDto.description_no}]])">자세히
						보기</button>
				</div>
			</div>

			<div class="comp-row">
				<div class="comp-info">
					<span class="comp-label">가입 제약 조건 사양</span>
					<th:block
						th:if="${aprSugDto.condition_no != null and aprSugDto.condition_no != 0}">
						<span class="comp-status status-assigned">구성 완료</span>
						<span class="sub-no" th:text="|No. ${aprSugDto.condition_no}|"></span>
					</th:block>
					<th:block
						th:if="${aprSugDto.condition_no == null or aprSugDto.condition_no == 0}">
						<span class="comp-status status-empty">미등록</span>
					</th:block>
				</div>
				<div>
					<button
						th:if="${aprSugDto.condition_no == null or aprSugDto.condition_no == 0}"
						class="btn-action assign-trigger" onclick="condWrite()">상품
						조건 작성하기</button>
					<button
						th:if="${aprSugDto.condition_no != null and aprSugDto.condition_no != 0}"
						class="btn-action"
						th:onclick="condPage([[${aprSugDto.condition_no}]])">자세히
						보기</button>
				</div>
			</div>
		</div>

		<th:block th:if="${prdDtResDto != null}">

			<div class="modify-box" style="border: 1px solid #43a047;">
				<form th:action="@{/employee/staff/product/update/description}"
					method="POST">
					<h3 style="color: #43a047; margin-top: 0;">상품 설명 정보 변경</h3>

					<input type="hidden" name="product_no"
						th:value="${prdDtResDto.product != null ? prdDtResDto.product.product_no : ''}" />

					<div class="form-inline-group">
						<label>상품 설명 PK</label> <input type="text" name="description_no"
							th:value="${prdDtResDto.description != null ? prdDtResDto.description.description_no : ''}"
							readonly style="background-color: #f5f5f5;" />
					</div>

					<div class="form-inline-group"
						th:if="${prdDtResDto.description != null && prdDtResDto.description.image_url != null}">
						<label>상품 대표 이미지:</label><br> <img
							th:src="${prdDtResDto.description.image_url}" alt="상품 이미지"
							style="max-width: 200px; height: auto; margin-top: 5px; border: 1px solid #ccc;" />
						<input type="hidden" name="image_url"
							th:value="${prdDtResDto.description.image_url}" />
					</div>

					<div class="form-inline-group">
						<label>부제목:</label> <input type="text" name="subtitle"
							th:value="${prdDtResDto.description != null ? prdDtResDto.description.subtitle : ''}" />
					</div>
					<div class="form-inline-group">
						<label>홍보 문구:</label>
						<textarea rows="2" name="content"
							th:text="${prdDtResDto.description != null ? prdDtResDto.description.content : ''}"
							style="resize: none;"></textarea>
					</div>
					<div class="form-inline-group">
						<label>가입 자격 설명:</label>
						<textarea rows="2" name="eligibility_desc"
							th:text="${prdDtResDto.description != null ? prdDtResDto.description.eligibility_desc : ''}"
							style="resize: none;"></textarea>
					</div>
					<div class="form-inline-group">
						<label>우대 금리 요약:</label> <input type="text"
							name="preferential_rate_summary"
							th:value="${prdDtResDto.description != null ? prdDtResDto.description.preferential_rate_summary : ''}" />
					</div>

					<div style="margin-top: 15px;">
						<button type="submit" class="btn-action"
							style="border-color: #43a047; color: #43a047;">상품 설명
							변경하기</button>
					</div>
				</form>
			</div>

			<div class="modify-box" style="border: 1px solid #e65100;">
				<form th:action="@{/employee/staff/product/update/condition}"
					method="POST">
					<h3 style="color: #e65100; margin-top: 0;">상품 가입 조건 정보 변경</h3>

					<input type="hidden" name="product_no"
						th:value="${prdDtResDto.product != null ? prdDtResDto.product.product_no : ''}" />

					<div class="form-inline-group">
						<label>상품 가입조건 PK: </label> <input type="text" name="condition_no"
							th:value="${prdDtResDto.condition != null ? prdDtResDto.condition.condition_no : ''}"
							readonly style="background-color: #f5f5f5;" />
					</div>

					<div style="margin-top: 15px;">
						<button type="submit" class="btn-action"
							style="border-color: #e65100; color: #e65100;">가입 조건
							변경하기</button>
					</div>
				</form>
			</div>
		</th:block>

		<div class="btn-row-bottom">
			<a class="btn-action" style="padding: 10px 24px;"
				th:href="@{/employee/staff/product/approved/list}">승인된 제안서 목록으로
				돌아가기</a>
		</div>

	</div>

</body>
</html>
