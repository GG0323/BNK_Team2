<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 구성 - 약관 등록</title>
<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}" />
<link rel="stylesheet" th:href="@{/css/employee/staff_CommonPlace.css}" />
<style>
* {
	box-sizing: border-box;
	margin: 0;
	padding: 0;
}

body {
	font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
	background: #F5F5F5;
	display: flex;
	min-height: 100vh;
}

.main {
	flex: 1;
	padding: 2rem;
	min-width: 0;
}

.breadcrumb {
	display: flex;
	align-items: center;
	gap: 6px;
	font-size: 12px;
	color: #aaa;
	margin-bottom: 1.5rem;
}

.breadcrumb .current {
	color: #111;
	font-weight: 600;
}

.page-title {
	font-size: 18px;
	font-weight: 700;
	color: #111;
	letter-spacing: -0.5px;
	margin-bottom: 1.5rem;
}

/* ===== 가입 조건 등록 카드 스타일 매칭 ===== */
.card {
	background: #fff;
	border-radius: 12px;
	border: 1px solid #E8E8E8;
	padding: 2rem;
	max-width: 780px;
}

.card-title-group {
	margin-bottom: 1.5rem;
}

.card-title {
	font-size: 14px;
	font-weight: 700;
	color: #111;
}

/* ===== 폼 그리드 시스템 ===== */
.form-grid {
	display: grid;
	grid-template-columns: repeat(2, 1fr);
	gap: 16px;
}

.form-group {
	display: flex;
	flex-direction: column;
	gap: 6px;
}

.form-group.full-width {
	grid-column: 1 / -1;
}

.form-group label {
	font-size: 12px;
	font-weight: 600;
	color: #555;
}

.form-group label .required {
	color: #E8282F;
	margin-left: 2px;
}

.form-group input[type="text"],
.form-group select,
.form-group textarea {
	padding: 9px 12px;
	border: 1px solid #E0E0E0;
	border-radius: 8px;
	font-size: 13px;
	color: #111;
	background: #fff;
	outline: none;
	transition: border-color 0.15s;
	width: 100%;
}

.form-group input:focus, .form-group select:focus, .form-group textarea:focus {
	border-color: #111;
}

.form-group textarea {
	resize: vertical;
	font-family: inherit;
	line-height: 1.6;
}

/* ===== 파일 업로드 박스 모던 디자인 정립 ===== */
.file-upload-box {
	border: 1.5px dashed #D0D0D0;
	border-radius: 8px;
	padding: 1rem;
	background: #FAFAFA;
	transition: all 0.15s;
	cursor: pointer;
	display: flex;
	align-items: center;
	justify-content: center;
	min-height: 90px;
}

.file-upload-box:hover {
	border-color: #111;
	background: #FDFDFD;
}

.file-upload-box input[type="file"] {
	display: none; /* 실제 파일 인풋은 숨김 */
}

.file-upload-inner {
	display: flex;
	flex-direction: column;
	align-items: center;
	gap: 4px;
	color: #999;
	font-size: 12px;
	text-align: center;
}

.file-upload-icon {
	font-size: 20px;
	margin-bottom: 2px;
}

.file-name {
	font-size: 12px;
	color: #22863a;
	font-weight: 600;
	margin-top: 2px;
	word-break: break-all;
}

/* 유효성 에러 메시지 스타일 */
.field-error {
	font-size: 11px;
	color: #E8282F;
	display: none;
	margin-top: 2px;
}
.field-error.show {
	display: block;
}

/* ===== 버튼 그룹 ===== */
.btn-group {
	display: flex;
	justify-content: flex-end;
	gap: 10px;
	margin-top: 1.75rem;
}

.btn {
	padding: 10px 24px;
	font-size: 13px;
	font-weight: 600;
	border-radius: 8px;
	cursor: pointer;
	transition: all 0.15s;
	border: none;
}

.btn-secondary {
	border: 1px solid #E0E0E0;
	background: #fff;
	color: #555;
}

.btn-secondary:hover {
	border-color: #111;
	color: #111;
}

.btn-primary {
	background: #E8282F;
	color: #fff;
}

.btn-primary:hover {
	background: #C5202A;
}
</style>
</head>
<body>

	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>

	<div class="main">
		<div th:replace="~{fragments/staffFragment :: goHomePage}"></div>

		<div class="breadcrumb">
			직원 페이지 › 상품 통합 관리 › <span class="current">약관 등록</span>
		</div>	

		<div class="page-title">약관 등록</div>

		<div class="card">
			<div class="card-title-group">
				<div class="card-title">약관 명세 신규 등록 (Terms Registration)</div>
			</div>

			<form th:action="@{/employee/staff/product/terms/save}" method="POST" id="termsRegistForm" enctype="multipart/form-data">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div class="form-grid">
					
					<div class="form-group full-width">
						<label for="product_no"><span class="required">*</span> 연결할 승인 상품 제안서</label>
						<select id="product_no" name="product_no" required>
							<option value="">-- 사양이 승인되어 공식 약관 결합을 대기 중인 상품 제안서를 선택하세요 --</option>
							<option th:each="aprsug : ${approvedSuggestion}"
								th:value="${aprsug.suggestion_no}"
								th:text="| [No.${aprsug.suggestion_no}] ${aprsug.product_name} |">
							</option>
						</select>
					</div>

					<div class="form-group full-width">
						<label for="terms_title"><span class="required">*</span>약관명</label>
						<input type="text" id="terms_title" name="terms_title" placeholder="예: 예금거래기본약관" required />
					</div>

					<div class="form-group">
						<label for="terms_type"><span class="required">*</span> 약관 구분</label>
						<select id="terms_type" name="terms_type" required>
							<option value="REQUIRED" selected>필수 동의 (REQUIRED)</option>
							<option value="OPTIONAL">선택 동의 (OPTIONAL)</option>
						</select>
					</div>

					<div class="form-group">
						<label for="terms_version">약관 관리 버전</label>
						<input type="text" id="terms_version" name="terms_version" value="1.0" placeholder="예: 1.0" />
					</div>

					<div class="form-group">
						<label><span class="required">*</span> 원본 약관 PDF 업로드</label>
						<div class="file-upload-box" onclick="document.getElementById('pdf_file').click()">
							<input type="file" id="pdf_file" name="pdf_file" accept=".pdf" onchange="showFileName(this, 'pdf-name')" required>
							<div class="file-upload-inner">
								<div class="file-upload-icon">📄</div>
								<div>클릭하여 PDF 파일 선택</div>
								<div class="file-name" id="pdf-name">선택된 파일 없음</div>
							</div>
						</div>
						<span class="field-error" id="err-pdf">약관 PDF 파일은 필수 등록 사항입니다.</span>
					</div>

					<div class="form-group">
						<label>미리보기 대표 이미지 업로드 (JPG / PNG)</label>
						<div class="file-upload-box" onclick="document.getElementById('image_file').click()">
							<input type="file" id="image_file" name="image_file" accept="image/*" onchange="showFileName(this, 'img-name'); previewImage(this)">
							<div class="file-upload-inner">
								<div class="file-upload-icon" id="img-icon">🖼️</div>
								<div>클릭하여 이미지 파일 선택</div>
								<div class="file-name" id="img-name">선택된 파일 없음</div>
							</div>
						</div>
					</div>

					<div class="form-group">
						<label for="use_yn">약관 사용 여부</label>
						<select id="use_yn" name="use_yn">
							<option value="Y" selected>사용 활성화 (Y)</option>
							<option value="N">미사용 보존 (N)</option>
						</select>
					</div>
					
					<div class="form-group"></div>

					<div class="form-group full-width">
						<label for="terms_summary">약관 핵심 요약 정의 및 고지사항 (CLOB)</label>
						<textarea id="terms_summary" name="terms_summary" rows="3" placeholder="약관의 주요 핵심 요약 내용을 작성해주세요..."></textarea>
					</div>

				</div>

				<div class="btn-group">
					<button type="button" class="btn btn-secondary" onclick="history.back();">취소 및 돌아가기</button>
					<button type="submit" class="btn btn-primary" onclick="return validateForm()">신규 약관 명세 등록 완료</button>
				</div>
			</form>
		</div>
	</div>

	<script th:inline="javascript">
	/*<![CDATA[*/
		
		// ── 파일 선택 시 해당 파일명을 박스 안에 선명하게 표시해주는 함수 ──
		function showFileName(input, targetId) {
			const el = document.getElementById(targetId);
			if (input.files && input.files[0]) {
				el.textContent = input.files[0].name;
			} else {
				el.textContent = '선택된 파일 없음';
			}
		}

		// ── 이미지 파일을 선택하면 기존 액자 이모티콘 자리에 실제 썸네일을 띄워주는 자바스크립트 엔진 ──
		function previewImage(input) {
			const iconZone = document.getElementById('img-icon');
			
			if (input.files && input.files[0]) {
				const reader = new FileReader();
				reader.onload = function(e) {
					iconZone.innerHTML = `<img src="${e.target.result}" style="width:46px; height:46px; object-fit:cover; border-radius:6px; border:1px solid #E0E0E0;">`;
				};
				reader.readAsDataURL(input.files[0]);
			} else {
				iconZone.innerHTML = "🖼️"; // 파일 취소 시 기본 이모티콘 환원
			}
		}
		
		// ── 서브밋 전 필수 파일 유효성 최종 디펜스 검증 ──
		function validateForm() {
			const pdfFile = document.getElementById('pdf_file').files[0];
			const pdfErr = document.getElementById('err-pdf');
			
			if (!pdfFile) {
				pdfErr.classList.add('show');
				document.getElementById('pdf_file').focus();
				return false;
			} else {
				pdfErr.classList.remove('show');
			}
			return true;
		}
		
	/*]]>*/
	</script>
</body>
</html>
