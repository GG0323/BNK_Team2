<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 구성 - 약관 등록</title>
	<link rel="stylesheet" th:href="@{/css/employee/staff_SideBar.css}" />
	<link rel="stylesheet" th:href="@{/css/employee/staff_CommonPlace.css}" />
	<link rel="stylesheet" th:href="@{/css/employee/write/termsWrite.css}" />

</head>
<body>

	<div th:replace="~{fragments/staffFragment :: staffSideBar}"></div>

	<div class="main">
		<div th:replace="~{fragments/staffFragment :: goHomePage}"></div>

		<div class="breadcrumb">
			직원 페이지 › 승인된 제안서 리스트 › 제안서 상세보기 › <span class="current">약관 등록</span>
		</div>

		<div class="page-title">약관 등록</div>

		<div class="card">
			<div class="card-title-group">
				<div class="card-title">약관 신규 등록 (Terms Registration)</div>
			</div>

			<form th:action="@{/employee/staff/product/terms/save}" method="POST" enctype="multipart/form-data" id="termsRegistForm">
				<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />

				<div class="form-grid">

					<input type="hidden" th:value="@{suggestion_no}">
					
					<div class="form-div">
						<span th:text="| [No.${suggestion_no}] / 상품명: ${approvedSug.product_name} |"></span>
					</div>

					<div class="form-group full-width">
						<label for="terms_title"><span class="required">*</span>약관명</label>
						<input type="text" id="terms_title" name="terms_title"
							placeholder="예: 예금거래기본약관" required />
					</div>

					<div class="form-group">
						<label for="terms_type"><span class="required">*</span> 약관
							구분</label> <select id="terms_type" name="terms_type" required>
							<option value="REQUIRED" selected>필수 동의 (REQUIRED)</option>
							<option value="OPTIONAL">선택 동의 (OPTIONAL)</option>
						</select>
					</div>

					<div class="form-group">
						<label for="terms_version">약관 관리 버전</label> <input type="text"
							id="terms_version" name="terms_version" value="1.0"
							placeholder="예: 1.0" />
					</div>

					<div class="form-group">
						<label><span class="required">*</span> 원본 약관 PDF 업로드</label>
						<div class="file-upload-box"
							onclick="document.getElementById('pdf_file').click()">
							<input type="file" id="pdf_file" name="pdf_file" accept=".pdf" onchange="showFileName(this, 'pdf-name')" required>
							<div class="file-upload-inner">
								<div class="file-upload-icon">📄</div>
								<div>클릭하여 PDF 파일 선택</div>
								<div class="file-name" id="pdf-name">선택된 파일 없음</div>
							</div>
						</div>
						<span class="field-error" id="err-pdf">약관 PDF 파일은 필수 등록
							사항입니다.</span>
					</div>

					<div class="form-group">
						<label>미리보기 대표 이미지 업로드 (JPG / PNG)</label>
						<div class="file-upload-box" onclick="document.getElementById('image_file').click()">
							<input type="file" id="image_file" name="image_file" accept="image/*" onchange="showFileName(this, 'img-name')">
							<div class="file-upload-inner">
								<div class="file-upload-icon" id="img-icon">🖼️</div>
								<div>클릭하여 이미지 파일 선택</div>
								<div class="file-name" id="img-name">선택된 파일 없음</div>
							</div>
						</div>
					</div>

					<div class="form-group">
						<label for="use_yn">약관 사용 여부</label> <select id="use_yn"
							name="use_yn">
							<option value="Y" selected>사용 활성화 (Y)</option>
							<option value="N">미사용 보존 (N)</option>
						</select>
					</div>

					<div class="form-group"></div>

					<div class="form-group full-width">
						<label for="terms_summary">약관 핵심 요약 정의 및 고지사항 (CLOB)</label>
						<textarea id="terms_summary" name="terms_summary" rows="3"
							placeholder="약관의 주요 핵심 요약 내용을 작성해주세요..."></textarea>
					</div>

				</div>

				<div class="btn-group">
					<button type="button" class="btn btn-secondary"
						onclick="history.back();">취소 및 돌아가기</button>
					<button type="submit" class="btn btn-primary"
						onclick="return validateForm()">신규 약관 명세 등록 완료</button>
				</div>
			</form>
		</div>
	</div>

	<script th:inline="javascript">
		/*<![CDATA[*/

		// ── 파일 선택 시 해당 파일명을 박스 안에 선명하게 표시해주는 함수 ──
		function showFileName(input, targetId) {
			const el = document.getElementById(targetId);
			if (input.files && input.files[0]) {
				el.textContent = input.files[0].name;
			} else {
				el.textContent = '선택된 파일 없음';
			}
		}

		// ── 이미지 파일을 선택하면 기존 액자 이모티콘 자리에 실제 썸네일을 띄워주는 자바스크립트 엔진 ──
		function previewImage(input) {
			const iconZone = document.getElementById('img-icon');

			if (input.files && input.files[0]) {
				const reader = new FileReader();
				reader.onload = function(e) {
					iconZone.innerHTML = `<img src="${e.target.result}" style="width:46px; height:46px; object-fit:cover; border-radius:6px; border:1px solid #E0E0E0;">`;
				};
				reader.readAsDataURL(input.files[0]);
			} else {
				iconZone.innerHTML = "🖼️"; // 파일 취소 시 기본 이모티콘 환원
			}
		}

		// ── 서브밋 전 필수 파일 유효성 최종 디펜스 검증 ──
		function validateForm() {
			const pdfFile = document.getElementById('pdf_file').files[0];
			const pdfErr = document.getElementById('err-pdf');

			if (!pdfFile) {
				pdfErr.classList.add('show');
				document.getElementById('pdf_file').focus();
				return false;
			} else {
				pdfErr.classList.remove('show');
			}
			return true;
		}

		/*]]>*/
	</script>
</body>
</html>
