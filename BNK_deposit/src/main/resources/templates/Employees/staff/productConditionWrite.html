<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>상품 가입 조건 등록</title>
<style>
	body{
		padding: 20px;
		font-family: sans-serif;
	}
	.table_name{
		color: gray;
		font-size: 0.9rem;
	}
	
	/* 	선택에 따라서 입력 공간이 나왔다 안나왔다 하게 하는 거!
		처음 페이지 열렸을 때는 기본이 'N(자유선택)'이므로 고정 기간 입력창을 숨깁니다~~
	*/
    .hidden_group {
        display: none; 
    }
</style>
</head>
<body>
	
	<h2>상품 가입 조건 등록</h2>
	<p class="table_name">테이블: TB_PRODUCT_CONDITION</p>
	<hr>
	
	<form th:action="@{/employee/staff/product/condition/save}" method="POST">
		<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" />
    
    <!-- 1. 식별 키값 -->
        <!-- 
        <label for="condition_no">가입조건 PK :</label>
        <input type="text" id="condition_no" name="condition_no" placeholder="그냥 띄워놓을게요~"><br>
    	 -->
    	 
    	<!-- 키값 22... -->
        <label for="product_no"><span style="color: red">*</span>상품 FK :</label>
        <input type="text" id="product_no" name="product_no" required placeholder="연결할 상품 코드 입력"><br>

    <!-- 2. 나이 제한 -->
        <label for="min_age"><span style="color: red">*</span>최소 가입 나이 (세) :</label>
        <input type="number" id="min_age" name="min_age" min="0" Required placeholder="0"><br>
    	
        <label for="max_age">최대 가입 나이 (세) :</label>
        <input type="number" id="max_age" name="max_age" min="0" placeholder="제한 없을 경우 비워둠"><br>

    <!-- 3. 여부(Y/N) 관련 조건들 -->
        <label for="foreigner_available_yn">외국인 가입 가능 여부 :</label>
        <select id="foreigner_available_yn" name="foreigner_available_yn">
            <option value="N">불가능 (N)</option>
            <option value="Y">가능 (Y)</option>
        </select><br>

        <label for="overseas_tax_yn">해외 납세 의무 확인 필요 :</label>
        <select id="overseas_tax_yn" name="overseas_tax_yn">
            <option value="Y">필요 (Y)</option>
            <option value="N" selected>불필요 (N)</option>
        </select><br>
        
    <!-- 4. 성별 및 고객 유형 -->
        <label for="gender">성별 제한 :</label>
        <select id="gender" name="gender">
            <option value="ALL">제한 없음 (ALL)</option>
            <option value="F">여성 전용 (F)</option>
            <option value="M">남성 전용 (M)</option>
        </select><br>

        <label for="customer_type">고객 유형 :</label>
        <select id="customer_type" name="customer_type">
            <option value="PERSONAL">개인</option>
            <option value="BUSINESS">기업</option>
            <option value="ALL">제한없음</option>
        </select><br>

    <!-- 5. 혜택 및 보호 여부 (Y/N) -->
        <label for="tax_benefit_yn">세제혜택 가능 여부 :</label>
        <select id="tax_benefit_yn" name="tax_benefit_yn">
            <option value="N" selected>불가능 (N)</option>
            <option value="Y">가능 (Y)</option>
        </select><br>

        <label for="non_taxable_savings_yn">비과세 종합 저축 가능 :</label>
        <select id="non_taxable_savings_yn" name="non_taxable_savings_yn">
            <option value="N" selected>불가능 (N)</option>
            <option value="Y">가능 (Y)</option>
        </select><br>

        <label for="depositor_protection_yn">예금자 보호 대상 여부 :</label>
        <select id="depositor_protection_yn" name="depositor_protection_yn">
            <option value="Y" selected>대상 (Y)</option>
            <option value="N">비대상 (N)</option>
        </select><br>

    <!-- 6. 금액 관련 -->
        <label for="min_join_amount"><span style="color: red">*</span>최소 가입 금액 (원) :</label>
        <input type="number" id="min_join_amount" name="min_join_amount" min="0" required placeholder="10000"><br>

        <label for="max_join_amount">최대 가입 금액 (원) :</label>
        <input type="number" id="max_join_amount" name="max_join_amount" min="0" placeholder="제한 없으면 비워둠"><br>

        <label for="deposit_unit">입금 단위 (원) :</label>
        <input type="number" id="deposit_unit" name="deposit_unit" min="0" placeholder="10000"><br>

    <!-- 7. 가입 기간 관련 설정 -->
        <label for="min_term_months"><span style="color: red">*</span>최소 가입 기간 (월) :</label>
        <input type="number" id="min_term_months" name="min_term_months" min="0" value="6" required><br>

        <label for="max_term_months">최대 가입 기간 (월) :</label>
        <input type="number" id="max_term_months" name="max_term_months" min="0" placeholder="36"><br>

	<!-- 가입 기간 단위 유형 -->
        <div class="form_group">
		    <label for="term_unit_type">가입 기간 단위 유형 :</label>
		    <!-- select가 바뀔 때마다 실행할 함수(changeTermUnit)를 연결합니다 -->
		    <select id="term_unit_type" name="term_unit_type" onchange="changeTermUnit()">
		        <option value="MONTH" selected>월 단위 (MONTH)</option>
		        <option value="DAY">일 단위 (DAY)</option>
		        <option value="YEAR">년 단위 (YEAR)</option>
		    </select>
		</div>
			
		<div class="form_group">
		    <label for="term_unit_value"><span style="color: red">*</span>가입 기간 단위 값 :</label>
		    <input type="number" id="term_unit_value" name="term_unit_value" min="1" value="1" required>
		    <!-- 👈 입력창 뒤에 동적으로 변할 단위 글자 칸을 만들어 둡니다 -->
		    <span id="unit_text" style="font-weight: bold; color: #555;">개월</span>
		</div>
	<!-- 가입 기간 고정 -->
        <div class="form_group">
	        <label for="fixed_term_yn">가입 기간 고정 여부 :</label>
	        <!-- 이벤트 감지를 위해 onchange 속성을 추가했습니다 -->
	        <select id="fixed_term_yn" name="fixed_term_yn" onchange="toggleFixedTermInput()">
	            <option value="N" selected>자유 선택 (N)</option>
	            <option value="Y">지정 기간만 가능 (Y)</option>
	        </select>
	    </div>

    	<!-- JS로 통째로 숨겼다 켰다 하기 위해 div(id="fixed_term_div")로 감싸고 숨김 클래스를 주었스비낟! -->
	    <div class="form_group hidden_group" id="fixed_term_div">
	        <label for="fixed_term_values">고정 가입 기간 값 :</label>
	        <input type="text" id="fixed_term_values" name="fixed_term_values" placeholder="Ex) 3, 6, 12">
	    </div>
    
    <br>

    <!-- 8. 비고 -->
        <label for="condition_note" style="margin-top: 5px;">가입 조건 비고 :</label>
        <textarea id="condition_note" name="condition_note" rows="4" style="width: 250px; padding: 5px;" placeholder="Ex) 미성년자는 가입 불가"></textarea><br>

    	<hr>
        <input type="submit" value="등록하기"></input>
	</form>


	<script>
	function toggleFixedTermInput() {
	    const fixedTermYn = document.getElementById("fixed_term_yn").value;
	    const fixedTermDiv = document.getElementById("fixed_term_div");
	    
	    if (fixedTermYn === "Y") {
	        fixedTermDiv.classList.remove("hidden_group");
	    } else {
	        fixedTermDiv.classList.add("hidden_group");
	        document.getElementById("fixed_term_values").value = "";
	    }
	}
	
	function changeTermUnit() {
	    const unitType = document.getElementById("term_unit_type").value;
	    const unitText = document.getElementById("unit_text");
	    
	    if (unitType === "MONTH") unitText.innerText = "개월";
	    else if (unitType === "DAY") unitText.innerText = "일";
	    else if (unitType === "YEAR") unitText.innerText = "년";
	}
	</script>
</body>
</html>
