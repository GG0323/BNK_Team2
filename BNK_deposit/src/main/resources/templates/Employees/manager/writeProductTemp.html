<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>상품 등록</title>
  <!-- CSS는 나중에 작업. 지금은 최소한의 가독성만 -->
  <style>
    body { font-family: sans-serif; max-width: 640px; margin: 20px auto; }
    .row { margin-bottom: 12px; }
    label { display: inline-block; width: 160px; vertical-align: top; }
    input[type=text], input[type=number], input[type=date], select { width: 240px; }
    .required::after { content: " *"; color: red; }
    #result { margin-top: 16px; padding: 10px; display: none; }
    .ok { background: #e6ffe6; }
    .err { background: #ffe6e6; }
  </style>
</head>
<body>

<h2>상품 등록</h2>
<p>등록하면 <b>판매대기(PENDING)</b> 상태로 저장됩니다. 이후 약관·설명·금리 작성 화면으로 이동합니다.</p>

	<form id="productForm">
		<div class="row">
			<label class="required" for="product_name">상품명</label>
			<input type="text" id="product_name" maxlength="100" required>
		</div>
	
		<div class="row">
			<label class="required" for="product_type">상품유형</label>
			<input type="text" id="product_type" maxlength="10" required>
			DEPOSIT: 예금 / SAVINGS: 적금
		</div>
	
		<div class="row">
			<label for="min_interest_rate">최저금리(%)</label>
			<input type="number" id="min_interest_rate" step="0.01" min="0" max="99.99">
		</div>
	
		<div class="row">
			<label for="max_interest_rate">최고금리(%)</label>
			<input type="number" id="max_interest_rate" step="0.01" min="0" max="99.99">
		</div>
	
		<div class="row">
			<label for="interest_payment_type">이자지급방식</label>
			<input type="text" id="interest_payment_type" maxlength="20">
			MATURITY: 만기일시 / MONTHLY: 월이자 / SETTLEMENT: 결산주기
		</div>
		
		<div class="row">
			<label for="interest_calc_type">이자계산방식</label>
			<input type="text" id="interest_calc_type" maxlength="10">
			SIMPLE: 단리 / COMPOUND: 복리
		</div>
	
		<div class="row">
			<label for="sale_start_date">판매시작일</label>
			<input type="date" id="sale_start_date">
		</div>

		<div class="row">
			<label for="sale_end_date">판매종료일</label>
			<input type="date" id="sale_end_date">
		</div>
	
		<div class="row">
			<label>가입채널</label>
			<span>
				<label style="width:auto;"><input type="checkbox" id="branch_join_yn"> 영업점</label>
				<label style="width:auto;"><input type="checkbox" id="internet_join_yn"> 인터넷</label>
				<label style="width:auto;"><input type="checkbox" id="mobile_join_yn" checked> 모바일</label>
			</span>
		</div>
	
		<div class="row">
			<button type="submit">등록</button>
		</div>
	</form>
	
	<div id="result"></div>

  <script>
    const form = document.getElementById('productForm');
    const resultBox = document.getElementById('result');

    form.addEventListener('submit', (e) => {
    	  e.preventDefault();
    	  resultBox.style.display = 'none';

    	  // 체크박스 → 'Y' / 'N' 변환
    	  const yn = (id) => document.getElementById(id).checked ? 'Y' : 'N';

    	  // 빈 문자열은 null로 보내 DB nullable 컬럼과 맞춤
    	  const nullable = (id) => {
    	    const v = document.getElementById(id).value;
    	    return v === '' ? null : v;
    	  };

    	  const payload = {
    	    product_name: document.getElementById('product_name').value,
    	    product_type: document.getElementById('product_type').value,
    	    min_interest_rate: nullable('min_interest_rate'),
    	    max_interest_rate: nullable('max_interest_rate'),
    	    interest_payment_type: nullable('interest_payment_type'),
    	    interest_calc_type: nullable('interest_calc_type'),
    	    sale_start_date: nullable('sale_start_date'),
    	    sale_end_date: nullable('sale_end_date'),
    	    branch_join_yn: yn('branch_join_yn'),
    	    internet_join_yn: yn('internet_join_yn'),
    	    mobile_join_yn: yn('mobile_join_yn')
    	  };

    	  if (payload.min_interest_rate !== null && payload.max_interest_rate !== null
    	      && Number(payload.min_interest_rate) > Number(payload.max_interest_rate)) {
    	    showResult(false, '최저금리가 최고금리보다 클 수 없습니다.');
    	    return;
    	  }

    	  // [수정] '/ap' → '/api/products' (엔드포인트 경로)
    	  fetch('/api/manager/product/insertProduct', {
    	    method: 'POST',
    	    headers: { 'Content-Type': 'application/json' },
    	    body: JSON.stringify(payload)
    	  })
    	    .then((res) => {
    	      if (!res.ok) {
    	        // 실패 응답: 본문 텍스트를 읽어서 에러로 던짐
    	        return res.text().then((msg) => {
    	          throw new Error(msg || res.status);
    	        });
    	      }
    	      return res.json();
    	    })
    	    .then((data) => {
    	      // [수정] data.productNo → data.product_no (스네이크 케이스 규칙)
    	      const productNo = data.product_no;
    	      showResult(true, '등록 완료. 상품번호: ' + productNo);

    	      alert("다음페이지로 이동하기!");
    	      location.href = '/employee/manager/pendingProductList';
    	    })
    	    .catch((err) => {
    	      showResult(false, '오류: ' + err.message);
    	    });
    	});

    function showResult(ok, msg) {
      resultBox.textContent = msg;
      resultBox.className = ok ? 'ok' : 'err';
      resultBox.style.display = 'block';
    }
  </script>

</body>
</html>
