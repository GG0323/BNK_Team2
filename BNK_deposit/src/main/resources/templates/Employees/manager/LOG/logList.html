<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
<style>
/* ===== BNK 관리자 - 사원 활동 로그 ===== */

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  background: #F5F5F5;
  display: flex;
  min-height: 100vh;
}

/* ===== 사이드바 ===== */
.sidebar {
  width: 190px;
  background: #111111;
  flex-shrink: 0;
  min-height: 100vh;
}

.sidebar .logo {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  padding: 1.5rem 1.25rem;
  letter-spacing: -0.3px;
  border-bottom: 1px solid #2a2a2a;
}

.sidebar .logo span {
  color: #E8282F;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 1.25rem;
  font-size: 13px;
  color: #888888;
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: all 0.15s;
}

.nav-item:hover {
  color: #ffffff;
  background: #1c1c1c;
}

.nav-item.active {
  color: #ffffff;
  background: #1c1c1c;
  border-left-color: #E8282F;
}

/* ===== 메인 콘텐츠 ===== */
.main {
  flex: 1;
  padding: 2rem;
  min-width: 0;
  overflow-x: auto;
}

.topbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 2rem;
}

.logout-btn {
  font-size: 12px;
  color: #555555;
  background: #ffffff;
  border: 1px solid #E0E0E0;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
}

.logout-btn:hover {
  border-color: #111111;
  color: #111111;
}

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #aaaaaa;
  margin-bottom: 1.5rem;
}

.breadcrumb .current {
  color: #111111;
  font-weight: 600;
}

.page-title {
  font-size: 18px;
  font-weight: 700;
  color: #111111;
  letter-spacing: -0.5px;
  margin-bottom: 1.5rem;
}

/* ===== 검색 카드 ===== */
.search-card {
  background: #ffffff;
  border-radius: 12px;
  border: 1px solid #E8E8E8;
  padding: 1.5rem;
  margin-bottom: 1rem;
}

.search-grid-4 {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 1.25rem;
}

.search-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: #555555;
}

.form-group input,
.form-group select {
  padding: 8px 12px;
  border: 1px solid #E0E0E0;
  border-radius: 8px;
  font-size: 13px;
  color: #111111;
  background: #ffffff;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}

.form-group input:focus,
.form-group select:focus {
  border-color: #111111;
}

.divider {
  border: none;
  border-top: 1px solid #F0F0F0;
  margin: 1.25rem 0;
}

/* ===== 검색 버튼 ===== */
.btn-row {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 1.5rem;
}

.btn-search {
  background: #E8282F;
  color: #ffffff;
  border: none;
  border-radius: 8px;
  padding: 9px 28px;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-search:hover {
  background: #C5202A;
}

/* ===== 로그 테이블 ===== */
.table-card {
  background: #ffffff;
  border-radius: 12px;
  border: 1px solid #E8E8E8;
  overflow: hidden;
}

.table-wrap {
  overflow-x: auto;
}

table {
  width: 100%;
  border-collapse: collapse;
  min-width: 900px;
}

thead tr {
  background: #111111;
}

thead th {
  padding: 11px 14px;
  font-size: 12px;
  font-weight: 600;
  color: #ffffff;
  text-align: left;
  white-space: nowrap;
}

tbody tr {
  border-bottom: 1px solid #F0F0F0;
  transition: background 0.12s;
}

tbody tr:last-child {
  border-bottom: none;
}

tbody tr:hover {
  background: #FFF5F5;
}

tbody td {
  padding: 11px 14px;
  font-size: 12.5px;
  color: #444444;
  white-space: nowrap;
}

/* ===== 상태 & 액션 뱃지 ===== */
.badge {
  display: inline-block;
  padding: 2px 8px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 600;
}

/* 응답 상태 */
.badge-200 { background: #F0FFF4; color: #22863a; }
.badge-400 { background: #FFF8E1; color: #B8860B; }
.badge-403 { background: #FFF0F0; color: #E8282F; }
.badge-500 { background: #F3E8FF; color: #6B21A8; }

/* 액션 타입 */
.badge-login   { background: #EFF6FF; color: #1D4ED8; }
.badge-insert  { background: #F0FFF4; color: #22863a; }
.badge-update  { background: #FFF8E1; color: #B8860B; }
.badge-delete  { background: #FFF0F0; color: #E8282F; }
.badge-approve { background: #F3E8FF; color: #6B21A8; }
.badge-reject  { background: #FFF0F0; color: #E8282F; }

.sidebar { position: fixed; top: 0; left: 0; }
.main    { margin-left: 190px; }



</style>


</head>
<body>
	
	<aside class="sidebar">
    	<div class="logo">BNK <span>관리자</span> 페이지</div>
    	<!-- nav 항목들 -->	
    	
    	<a class="nav-item" th:href="@{/employee/manager/managerPage}">메인 페이지</a>
    	<a class="nav-item" th:href="@{/employee/manager/HRM/hrmRegist}">신규사원 등록</a>
    	<a class="nav-item active" th:href="@{/employee/manager/LOG/logList}">사원활동 로그</a>
    	<a class="nav-item" th:href="@{/employee/manager/HRM/hrmEmployeeList}">직원 리스트</a>
    	<a class="nav-item" th:href="@{/employee/manager/SUG/suggestionList}">제안서 리스트</a>
    	<a class="nav-item" th:href="@{/employee/manager/SUG/approvedList}">승인된 제안서</a>
    	
  	</aside>
	
	<div class="main"> 
		<div class="search-card">
	    	<div class="search-grid-4">
	    		<div class="form-group">
					<label>직원 번호</label>
					<input type="number" id="condition-employee_no" placeholder="사원 번호">
				</div>
			
				<div class="form-group">
			  		<label>작업 유형</label>
			  		<select id="condition-action_type">
			    		<option value="">전체</option>
			    		<option value="LOGIN">LOGIN</option>
			    		<option value="INSERT">INSERT</option>
			   			<option value="UPDATE">UPDATE</option>
			    		<option value="DELETE">DELETE</option>
			    		<option value="APPROVE">APPROVE</option>
			    		<option value="REJECT">REJECT</option>
			    	</select>
				</div>
	      	
				<div class="form-group">
			  		<label>대상 테이블</label>
			  		<select id="condition-target_table">
			  			<option value="">전체</option>
			        	<option value="TB_EMPLOYEE">TB_EMPLOYEE : 사원정보</option>
			        	<option value="TB_EMPLOYEE_LOG">TB_EMPLOYEE_LOG : 직원 활동 </option>
			        	<option value="TB_PRODUCTS_SUGGESTION">TB_PRODUCTS_SUGGESTION : 제안서</option>
			        	<option value="TB_APPROVED_SUGGESTION">TB_APPROVED_SUGGESTION : 승인된 제안서</option>
					</select>
				</div>
			
			
				<div class="form-group">
			    	<label>응답 상태</label>
			      	<select id="condition-response_status">
			        	<option value="">전체</option>
			    		<option value="200">200 성공</option>
			    		<option value="400">400 오류</option>
			    		<option value="403">403 권한 없음</option>
			    		<option value="500">500 서버오류</option>
			      	</select>
			    </div>
	    	
	    	</div>
			
	<hr class="divider">	
			
		<div class="search-grid-3">
	    	<div class="form-group">
	      		<label>시작일</label>
	      		<input type="date" id="condition-fromDate" style="width:100%;">
			</div>
			<div class="form-group">
	  			<label>종료일</label>
	  			<input type="date" id="condition-toDate" style="width:100%;">
			</div>
			<div class="form-group">
	  			<label>요청 IP</label>
	  			<input type="text" id="condition-ip" placeholder="예: 192.168.0" style="width:100%;">
	  		</div>
		
		</div>
	</div>
	
		<div class="btn-row">
			<button class="btn-search" onclick="setSearchCondition()">검색</button>
		</div>

		<div class="table-card">
			<div class="table-wrap">
				<table>
					<thead>
						<tr>
							<th>log_no</th>
							<th>employee_no</th>
							<th>action_type</th>
							<th>target_table</th>
							<th>target_pk</th>
							<th>action_detail</th>
							<th>request_method</th>
							<th>request_url</th>
							<th>request_ip</th>
							<th>response_status</th>
							<th>created_at</th>
						</tr>
					</thead>
					<tbody id="logtablebody">
						
					</tbody>
				
				</table>
			
			</div>
		</div>
	
	
	
	</div>
	
	
	
	
	
	<script>
		fetch("/api/log/employee/allList",{
			method: "GET"
		})
		.then(response =>{
			
			return response.json();
		})
		.then(data =>{
			console.log(data);
			
			const logtablebody = document.querySelector("#logtablebody");
			
			let html = "";
			
			data.forEach(log => {

		        html += `
		            <tr>
		                <td>${log.log_no}</td>
		                <td>${log.employee_no}</td>
		                <td>${log.action_type}</td>
		                <td>${log.target_table}</td>
		                <td>${log.target_pk}</td>
		                <td>${log.action_detail}</td>
		                <td>${log.request_method}</td>
		                <td>${log.request_url}</td>
		                <td>${log.request_ip}</td>
		                <td>${log.response_status}</td>
		                <td>${log.created_at}</td>
		            </tr>
		        `;
		    });

		    logtablebody.innerHTML = html;
			
			
		})
		.catch(e => {
			console.log(e);
		});
		
		
		function setSearchCondition() {
		    const params = {}; // 빈 객체 생성 
		    const empno = document.getElementById('condition-employee_no').value;
		    const action = document.getElementById('condition-action_type').value;
		    const table = document.getElementById('condition-target_table').value;
		    const status = document.getElementById('condition-response_status').value;
		    const fromDate = document.getElementById('condition-fromDate').value;
		    const toDate = document.getElementById('condition-toDate').value;
		    const ip = document.getElementById('condition-ip').value;
			
		    // params 안에 값 집어 넣기
		    if (empno)    params.employee_no    = empno;
		    if (action)   params.action_type    = action;
		    if (table)    params.target_table   = table;
		    if (status)   params.response_status = status;
		    if (fromDate) params.from_date = fromDate;
		    if (toDate)   params.to_date = toDate;
		    if (ip)       params.request_ip = ip;
			
		    const query = new URLSearchParams(params).toString();
			
		    // fetch 문 + 쿼리 스트링
		    fetch('/api/log/employee/conditionList?' + query)
		        .then(r => r.json())
		        .then(data => {
		            const logtablebody = document.querySelector("#logtablebody");
		            
		            let html = "";
		            
		            data.forEach(log => {
		                html += `<tr>
		                    <td>${log.log_no}</td>
		                    <td>${log.employee_no}</td>
		                    <td>${log.action_type}</td>
		                    <td>${log.target_table ?? '-'}</td>
		                    <td>${log.target_pk ?? '-'}</td>
		                    <td>${log.action_detail}</td>
		                    <td>${log.request_method}</td>
		                    <td>${log.request_url}</td>
		                    <td>${log.request_ip}</td>
		                    <td>${log.response_status}</td>
		                    <td>${log.created_at}</td>
		                </tr>`;
		            });
		            
		            logtablebody.innerHTML = html || '<tr><td colspan="11">검색 결과가 없습니다.</td></tr>';
		        
		        });
		}
		
		
	
	
	</script>
	
</body>
</html>
