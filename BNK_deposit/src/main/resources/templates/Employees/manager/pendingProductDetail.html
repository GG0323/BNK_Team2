<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>미승인 상품 상세</title>
	<!-- CSS는 나중에 작업. 클래스명은 이전 페이지와 동일하게 사용 -->
</head>
<body>
	<div class="main">
		<h2>미승인 상품 상세</h2>

		<div class="content">
			<!-- 왼쪽 패널: 상품 기본 정보 -->
			<div class="left-panel">
				<div class="card">
					<div class="card-title">상품 정보</div>

					<table>
						<tr>
							<th>상품번호</th>
							<td id="product_no"></td>
						</tr>
						<tr>
							<th>상품명</th>
							<td id="product_name"></td>
						</tr>
						<tr>
							<th>상품유형</th>
							<td id="product_type"></td>
						</tr>
						<tr>
							<th>판매상태</th>
							<td id="product_status_badge"></td>
						</tr>
						<tr>
							<th>최저금리</th>
							<td id="min_interest_rate"></td>
						</tr>
						<tr>
							<th>최고금리</th>
							<td id="max_interest_rate"></td>
						</tr>
						<tr>
							<th>이자지급방식</th>
							<td id="interest_payment_type"></td>
						</tr>
						<tr>
							<th>이자계산방식</th>
							<td id="interest_calc_type"></td>
						</tr>
						<tr>
							<th>판매시작일</th>
							<td id="sale_start_date"></td>
						</tr>
						<tr>
							<th>판매종료일</th>
							<td id="sale_end_date"></td>
						</tr>
						<tr>
							<th>가입채널</th>
							<td id="join_channels"></td>
						</tr>
						<tr>
							<th>등록일</th>
							<td id="created_at"></td>
						</tr>
					</table>
				</div>
			</div>

			<!-- 오른쪽 패널 -->
			<div class="right-panel">
				<!-- 상품 구성 현황 -->
				<div class="card">
					<div class="card-title">상품 구성 현황</div>

					<div class="component-list">
						<div class="component-item" onclick="goComponentPage('rate')" style="cursor: pointer;">
							<span class="comp-name">금리</span>
							<span id="rate_status" class="status-no">미등록</span>
						</div>

						<div class="component-item" onclick="goComponentPage('terms')" style="cursor: pointer;">
							<span class="comp-name">약관</span>
							<span id="terms_status" class="status-no">미등록</span>
						</div>

						<div class="component-item" onclick="goComponentPage('description')" style="cursor: pointer;">
							<span class="comp-name">설명</span>
							<span id="description_status" class="status-no">미등록</span>
						</div>

						<div class="component-item" onclick="goComponentPage('condition')" style="cursor: pointer;">
							<span class="comp-name">조건</span>
							<span id="condition_status" class="status-no">미등록</span>
						</div>
					</div>
				</div>

				<!-- 승인 버튼 -->
				<div class="register-card">
					<button class="btn-register" id="approveBtn" onclick="openApprovePopup()" style="display: none;">
						상품 승인 (판매 개시)
					</button>

					<div class="register-notice show" id="approveBtnMsg">
						※ 금리 / 약관 / 설명 / 조건이 모두 등록되어야 승인이 가능합니다.
					</div>
				</div>
				
				
			</div>
		</div>

		<a class="btn-back" th:href="@{/employee/manager/pendingProductList}">← 목록으로</a>
		toDo : 상품 부속  등록시 PENDING 중인 상품을 대상으로 등록 할 수 있도록 바꿔야함
		
	</div>

	<!-- 승인 확인 모달 -->
	<div class="modal-overlay" id="approvePopup" style="display: none;">
		<div class="modal">
			<div class="modal-icon">📋</div>
			<div class="modal-title">상품을 승인하시겠습니까?</div>
			<div class="modal-desc">
				승인 시 상태가 <b>PENDING → SALE</b>로 변경되어 판매가 시작됩니다.
			</div>

			<div class="modal-btns">
				<button class="modal-btn cancel" onclick="closeApprovePopup()">취소</button>
				<button class="modal-btn confirm" onclick="approveProduct()">확인</button>
			</div>
		</div>
	</div>

	<div class="toast" id="toast"></div>

	<script>
		const product_no = new URLSearchParams(location.search).get("product_no");

		/* ── 토스트 ── */
		function showToast(msg, type = 'success') {
			const t = document.getElementById('toast');

			t.textContent = msg;
			t.className = `toast ${type} show`;

			setTimeout(() => {
				t.className = 'toast';
			}, 3000);
		}

		/* ── 상태 뱃지 (판매상태) ── */
		function statusBadge(status) {
			const labelMap = {
				PENDING: '판매대기',
				SALE: '판매중',
				NON_SALE: '판매중지'
			};

			return `<span class="badge badge-${status}">${labelMap[status] ?? status}</span>`;
		}

		/* ── 구성 현황 셀 ── */
		function setComponentStatus(id, val) {
			const el = document.getElementById(id);
			// 상태 셀의 부모(component-item div) 자체를 제어
			const item = el.closest('.component-item');
			
			if (val) {
			  el.textContent = '등록됨';
			  el.className = 'status-ok';
			  item.style.cursor = 'pointer';
			  item.classList.remove('disabled');
			  item.dataset.enabled = 'true';   // 클릭 핸들러에서 사용
			} else {
			  el.textContent = '미등록';
			  el.className = 'status-no';
			  item.style.cursor = 'default';
			  item.classList.add('disabled');
			  item.dataset.enabled = 'false';
			}

		}

		/* ── 승인 버튼 활성화 체크 ── */
		function checkApproveBtn(data) {
			const ready = data.product_status === 'PENDING'
				&& data.rate_no
				&& data.terms_no
				&& data.description_no
				&& data.condition_no;
			
			if (ready) {
				document.getElementById("approveBtn").style.display = '';   // 노출
				document.getElementById("approveBtnMsg").classList.remove('show');
			}
			// 미충족 시엔 기본값(숨김) 유지
		}

		/* ── 가입채널 표시 ── */
		function renderJoinChannels(data) {
			const arr = [];

			if (data.branch_join_yn === 'Y') {
				arr.push('영업점');
			}

			if (data.internet_join_yn === 'Y') {
				arr.push('인터넷');
			}

			if (data.mobile_join_yn === 'Y') {
				arr.push('모바일');
			}

			return arr.length ? arr.join(', ') : '-';
		}

		/* ── 데이터 로드 ── */
		fetch("/api/manager/product/pendingDetail?product_no=" + product_no, {
			method: "GET"
		})
		.then((r) => {
			if (!r.ok) {
				throw new Error(r.status);
			}

			return r.json();
		})
		.then((data) => {
			console.log(data);

			document.getElementById("product_no").textContent = data.product_no;
			document.getElementById("product_name").textContent = data.product_name;
			document.getElementById("product_type").textContent = data.product_type;
			document.getElementById("product_status_badge").innerHTML = statusBadge(data.product_status);
			document.getElementById("min_interest_rate").textContent = (data.min_interest_rate ?? '-') + (data.min_interest_rate != null ? '%' : '');
			document.getElementById("max_interest_rate").textContent = (data.max_interest_rate ?? '-') + (data.max_interest_rate != null ? '%' : '');
			document.getElementById("interest_payment_type").textContent = data.interest_payment_type ?? '-';
			document.getElementById("interest_calc_type").textContent = data.interest_calc_type ?? '-';
			document.getElementById("sale_start_date").textContent = data.sale_start_date ?? '-';
			document.getElementById("sale_end_date").textContent = data.sale_end_date ?? '-';
			document.getElementById("join_channels").textContent = renderJoinChannels(data);
			document.getElementById("created_at").textContent = data.created_at ?? '-';

			setComponentStatus("rate_status", data.rate_no);
			setComponentStatus("terms_status", data.terms_no);
			setComponentStatus("description_status", data.description_no);
			setComponentStatus("condition_status", data.condition_no);

			checkApproveBtn(data);
		})
		.catch((e) => {
			console.error(e);
			showToast('데이터를 불러오지 못했습니다.', 'error');
		});

		/* ── 모달 ── */
		function openApprovePopup() {
			document.getElementById("approvePopup").style.display = 'block';
			document.getElementById("approvePopup").classList.add('show');
		}

		function closeApprovePopup() {
			document.getElementById("approvePopup").style.display = 'none';
			document.getElementById("approvePopup").classList.remove('show');
		}

		/* ── 상품 승인 ── */
		function approveProduct() {
			closeApprovePopup();

			fetch("/api/manager/product/approvePending", {
				method: "POST",
				headers: {
					"Content-Type": "application/json"
				},
				body: JSON.stringify({
					product_no: product_no
				})
			})
			.then((r) => {
				if (!r.ok) {
					throw new Error(r.status);
				}

				return r.json();;
			})
			.then((data) => {
				if (data.result === 1) {
					showToast('상품 승인이 완료되었습니다.', 'success');

					setTimeout(() => {
						location.href = "/employee/manager/pendingProductList";
					}, 1500);
				} else {
					showToast('승인에 실패했습니다. 부속정보 등록 상태를 다시 확인해주세요.', 'error');
				}
			})
			.catch((e) => {
				console.error(e);
				showToast('상품 승인 중 오류가 발생했습니다.', 'error');
			});
		}

		/* ── 부속 구성 클릭 시 해당 작성/조회 페이지로 이동 ── */
		function goComponentPage(type) {
			if (!product_no) {
				showToast("상품번호가 올바르지 않습니다.", "error");
				return;
			}
			// 미등록 항목 클릭 차단
			const item = document.getElementById(`${type}_status`).closest('.component-item');
			if (item.dataset.enabled !== 'true') {
			  return;  // 조용히 무시 (원하시면 showToast로 안내 메시지 띄워도 됨)
			}
			
			const basePath = "employee/manager/SUG/approvedDetail/productDetail";
			location.href = `${basePath}?type=${type}&product_no=${product_no}`;
		}
	</script>
	
	
	
	
</body>
</html>
