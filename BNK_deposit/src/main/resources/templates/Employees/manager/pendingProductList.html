<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>미승인 상품 리스트</title>
</head>
<body>
<table border="1" cellpadding="6">
	<thead>
		<tr>
			<th>상품번호</th>
			<th>상품명</th>
			<th>유형</th>
			<th>등록일</th>
			<th>가입조건</th>
			<th>설명</th>
			<th>금리</th>
			<th>약관</th>
			<th>상세</th>
		</tr>
	</thead>

	<tbody id="listBody"></tbody>
</table>

	<script>
		fetch('/api/manager/product/pendingList', {
			method: "GET"
		})
		.then((res) => {
			if (!res.ok) {
				throw new Error(res.status);
			}

			return res.json();
		})
		.then((rows) => {
			const tbody = document.getElementById('listBody');

			if (rows.length === 0) {
				tbody.innerHTML = '<tr><td colspan="9">대기 중인 상품이 없습니다.</td></tr>';
				return;
			}

			rows.forEach((row) => {
				const tr = document.createElement('tr');

				tr.innerHTML = `
					<td>${row.product_no}</td>
					<td>${row.product_name}</td>
					<td>${row.product_type}</td>
					<td>${row.created_at ?? ''}</td>
					<td>${row.has_join_condition}</td>
					<td>${row.has_description}</td>
					<td>${row.has_interest_rate}</td>
					<td>${row.has_terms}</td>
					<td>
						<a href="/employee/manager/pendingProductDetail?product_no=${row.product_no}">보기</a>
					</td>
				`;

				tbody.appendChild(tr);
			});
			
		})
		.catch((err) => {
			alert('조회 오류: ' + err.message);
		});
		
	</script>
</body>
</html>
