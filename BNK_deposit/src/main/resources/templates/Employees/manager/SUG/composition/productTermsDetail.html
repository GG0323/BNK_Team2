<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>약관 상세</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  background: #F5F5F5;
  display: flex;
  min-height: 100vh;
}

/* ===== 사이드바 ===== */
.sidebar {
  width: 190px;
  background: #111111;
  flex-shrink: 0;
  min-height: 100vh;
  position: fixed;
  top: 0; left: 0;
}

.sidebar .logo {
  font-size: 14px;
  font-weight: 700;
  color: #fff;
  padding: 1.5rem 1.25rem;
  letter-spacing: -0.3px;
  border-bottom: 1px solid #2a2a2a;
}

.sidebar .logo span { color: #E8282F; }

.nav-item {
  display: flex;
  align-items: center;
  padding: 11px 1.25rem;
  font-size: 13px;
  color: #888;
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: all 0.15s;
}

.nav-item:hover { color: #fff; background: #1c1c1c; }

.nav-item.active {
  color: #fff;
  background: #1c1c1c;
  border-left-color: #E8282F;
}

/* ===== 메인 ===== */
.main {
  margin-left: 190px;
  flex: 1;
  padding: 2rem;
  min-width: 0;
}

.topbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 2rem;
}

.logout-btn {
  font-size: 12px;
  color: #555;
  background: #fff;
  border: 1px solid #E0E0E0;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
}

.logout-btn:hover { border-color: #111; color: #111; }

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #aaa;
  margin-bottom: 1.5rem;
}

.breadcrumb a { color: #aaa; text-decoration: none; }
.breadcrumb a:hover { color: #111; }
.breadcrumb .current { color: #111; font-weight: 600; }

.page-title {
  font-size: 18px;
  font-weight: 700;
  color: #111;
  letter-spacing: -0.5px;
  margin-bottom: 1.5rem;
}

/* ===== 레이아웃 ===== */
.detail-layout {
  display: grid;
  grid-template-columns: 1fr 340px;
  gap: 1.25rem;
  align-items: start;
  max-width: 1100px;
}

/* ===== 카드 ===== */
.card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #E8E8E8;
  padding: 1.5rem;
}

.card-title {
  font-size: 11px;
  font-weight: 700;
  color: #E8282F;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 1.25rem;
  padding-bottom: 8px;
  border-bottom: 1px solid #F0F0F0;
}

/* 메타 정보 */
.meta-row {
  display: flex;
  align-items: flex-start;
  gap: 8px;
  margin-bottom: 12px;
}

.meta-label {
  font-size: 11px;
  font-weight: 600;
  color: #999;
  min-width: 90px;
  padding-top: 2px;
}

.meta-value {
  font-size: 13px;
  color: #222;
  flex: 1;
  line-height: 1.5;
}

.divider { border: none; border-top: 1px solid #F0F0F0; margin: 1.25rem 0; }

/* 뱃지 */
.badge {
  display: inline-block;
  padding: 3px 10px;
  border-radius: 20px;
  font-size: 11px;
  font-weight: 600;
}

.badge-REQUIRED { background: #FFF0F0; color: #E8282F; }
.badge-OPTIONAL { background: #EFF6FF; color: #1D4ED8; }
.badge-Y { background: #F0FFF4; color: #22863a; }
.badge-N { background: #F5F5F5; color: #aaa; }

/* 약관 요약 */
.summary-box {
  background: #F8F8F8;
  border-radius: 8px;
  padding: 14px;
  font-size: 13px;
  color: #555;
  line-height: 1.7;
  white-space: pre-wrap;
}

/* ===== PDF 미리보기 패널 ===== */
.preview-panel { display: flex; flex-direction: column; gap: 1.25rem; }

.preview-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 1rem;
}

.page-count {
  font-size: 12px;
  color: #888;
  background: #F5F5F5;
  padding: 3px 10px;
  border-radius: 20px;
}

/* 썸네일 그리드 */
.pdf-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 10px;
}

.pdf-thumb {
  position: relative;
  border-radius: 8px;
  overflow: hidden;
  border: 1.5px solid #E8E8E8;
  cursor: pointer;
  transition: all 0.15s;
  background: #F8F8F8;
}

.pdf-thumb:hover {
  border-color: #E8282F;
  box-shadow: 0 2px 12px rgba(232,40,47,0.15);
  transform: translateY(-2px);
}

.pdf-thumb img {
  width: 100%;
  display: block;
  object-fit: cover;
}

.pdf-thumb .page-label {
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  background: rgba(0,0,0,0.55);
  color: #fff;
  font-size: 11px;
  font-weight: 600;
  text-align: center;
  padding: 4px 0;
}

.pdf-empty {
  text-align: center;
  color: #bbb;
  padding: 2rem;
  font-size: 13px;
}

/* PDF 원본 다운로드 버튼 */
.btn-pdf-download {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  width: 100%;
  padding: 10px;
  font-size: 13px;
  font-weight: 600;
  border: 1.5px solid #E0E0E0;
  border-radius: 8px;
  background: #fff;
  color: #333;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
}

.btn-pdf-download:hover { border-color: #111; color: #111; background: #F8F8F8; }

/* ===== 목록 버튼 ===== */
.btn-back {
  display: inline-block;
  margin-top: 1.5rem;
  padding: 8px 20px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid #E0E0E0;
  border-radius: 8px;
  background: #fff;
  color: #555;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
}

.btn-back:hover { border-color: #111; color: #111; }

/* ===== PDF 전체보기 모달 ===== */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 200;
  align-items: center;
  justify-content: center;
  flex-direction: column;
}

.modal-overlay.show { display: flex; }

.modal-close-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  width: 90vw;
  max-width: 760px;
  margin-bottom: 12px;
}

.modal-page-info {
  font-size: 13px;
  color: #ccc;
  font-weight: 500;
}

.modal-close-btn {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: #E8282F;
  border: none;
  border-radius: 8px;
  padding: 6px 16px;
  cursor: pointer;
  transition: background 0.15s;
}

.modal-close-btn:hover { background: #C5202A; }

.modal-img-wrap {
  width: 90vw;
  max-width: 760px;
  max-height: 80vh;
  overflow-y: auto;
  border-radius: 10px;
  background: #fff;
}

.modal-img-wrap img {
  width: 100%;
  display: block;
}

/* 모달 내비게이션 */
.modal-nav {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-top: 14px;
}

.modal-nav-btn {
  font-size: 13px;
  font-weight: 600;
  color: #fff;
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  border-radius: 8px;
  padding: 7px 20px;
  cursor: pointer;
  transition: background 0.15s;
}

.modal-nav-btn:hover { background: rgba(255,255,255,0.25); }
.modal-nav-btn:disabled { opacity: 0.3; cursor: not-allowed; }

/* ===== 토스트 ===== */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s;
  pointer-events: none;
  z-index: 999;
}

.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #111; }
.toast.error   { background: #E8282F; }
</style>
</head>
<body>

  <aside class="sidebar">
    <div class="logo">BNK <span>관리자</span> 페이지</div>
    <a class="nav-item" th:href="@{/employee/manager/managerPage}">메인 페이지</a>
    <a class="nav-item" th:href="@{/employee/manager/HRM/hrmRegist}">신규사원 등록</a>
    <a class="nav-item" th:href="@{/employee/manager/LOG/logList}">사원활동 로그</a>
    <a class="nav-item" th:href="@{/employee/manager/HRM/hrmEmployeeList}">직원 리스트</a>
    <a class="nav-item" th:href="@{/employee/manager/SUG/suggestionList}">제안서 리스트</a>
    <a class="nav-item active" th:href="@{/employee/manager/SUG/approvedList}">승인된 제안서</a>
    <a class="nav-item" th:href="@{/employee/manager/LOG/bankMemberLog}">고객 로그</a>
    <a class="nav-item" th:href="@{/employee/manager/PRD/productList}">상품 리스트</a>
  </aside>

  <div class="main">

    <div class="topbar">
      <button class="logout-btn">로그아웃</button>
    </div>

    <div class="breadcrumb">
      관리자 페이지 ›
      <a th:href="@{/employee/manager/SUG/approvedList}">승인된 제안서</a> ›
      <a id="breadcrumb-back" href="#">상세보기</a> ›
      <span class="current">약관 상세</span>
    </div>

    <div class="page-title">약관 상세</div>

    <div class="detail-layout">

      <!-- 왼쪽: 약관 정보 -->
      <div class="card">
        <div class="card-title">약관 정보</div>

        <div class="meta-row">
          <span class="meta-label">약관 번호</span>
          <span class="meta-value" id="terms_no">-</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">약관명</span>
          <span class="meta-value" id="terms_title" style="font-weight:600;font-size:15px;">-</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">약관 구분</span>
          <span class="meta-value" id="terms_type_badge">-</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">약관 버전</span>
          <span class="meta-value" id="terms_version">-</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">사용 여부</span>
          <span class="meta-value" id="use_yn_badge">-</span>
        </div>

        <hr class="divider">

        <div class="meta-row">
          <span class="meta-label">등록 직원</span>
          <span class="meta-value" id="uploaded_by">-</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">등록일시</span>
          <span class="meta-value" id="uploaded_at">-</span>
        </div>
        <div class="meta-row">
          <span class="meta-label">수정일시</span>
          <span class="meta-value" id="updated_at">-</span>
        </div>

        <hr class="divider">

        <div class="card-title" style="margin-bottom:0.75rem;">약관 요약</div>
        <div class="summary-box" id="terms_summary">요약 내용 없음</div>
      </div>

      <!-- 오른쪽: PDF 미리보기 -->
      <div class="preview-panel">
        <div class="card">
          <div class="preview-header">
            <div class="card-title" style="margin-bottom:0;">PDF 미리보기</div>
            <span class="page-count" id="page-count">0 페이지</span>
          </div>
          <div class="pdf-grid" id="imagesPDF">
            <div class="pdf-empty">PDF를 불러오는 중...</div>
          </div>
        </div>

        <!-- PDF 원본 다운로드 -->
        <!-- <a class="btn-pdf-download" id="pdf-download-link" href="#" target="_blank">
          📄 원본 PDF 다운로드
        </a> -->
      </div>

    </div>

    <a class="btn-back" id="backBtn" href="#">← 제안서 상세로 돌아가기</a>

  </div>

  <!-- PDF 전체보기 모달 -->
  <div class="modal-overlay" id="pdfModal">
    <div class="modal-close-bar">
      <span class="modal-page-info" id="modal-page-info">1 / 1</span>
      <button class="modal-close-btn" onclick="closeModal()">✕ 닫기</button>
    </div>
    <div class="modal-img-wrap">
      <img id="modal-img" src="" alt="약관 전체보기">
    </div>
    <div class="modal-nav">
      <button class="modal-nav-btn" id="prevBtn" onclick="changeModalPage(-1)" disabled>← 이전</button>
      <button class="modal-nav-btn" id="nextBtn" onclick="changeModalPage(1)">다음 →</button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    const params       = new URLSearchParams(location.search);
    const suggestion_no = params.get('suggestion_no');
    const terms_no_param = params.get('terms_no'); // 직접 접근 시

    // 뒤로가기 링크 세팅
    const backUrl = `/employee/manager/SUG/approvedDetail?suggestion_no=${suggestion_no}`;
    document.getElementById('backBtn').href = backUrl;
    document.getElementById('breadcrumb-back').href = backUrl;

    /* ── 토스트 ── */
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    /* ── PDF 페이지 상태 ── */
    let pdfPages = [];
    let currentPage = 0;

    // 페이지 진입시 작동
    fetch(`/api/employee/approved/termsDetail?suggestion_no=${suggestion_no}`, { method: 'GET' })
      .then(r => r.json())
      .then(data => {
        console.log(data);

        document.getElementById('terms_no').textContent      = data.terms_no ?? '-';
        document.getElementById('terms_title').textContent   = data.terms_title ?? '-';
        document.getElementById('terms_version').textContent = data.terms_version ?? '-';
        document.getElementById('uploaded_by').textContent = data.uploaded_by ?? '-';
        document.getElementById('uploaded_at').textContent   = data.uploaded_at ?? '-';
        document.getElementById('updated_at').textContent    = data.updated_at ?? '-';
        document.getElementById('terms_summary').textContent = data.terms_summary ?? '요약 내용 없음';

        // 약관 구분 뱃지
        const typeMap = { REQUIRED: '필수', OPTIONAL: '선택' };
        document.getElementById('terms_type_badge').innerHTML =
          `<span class="badge badge-${data.terms_type}">${typeMap[data.terms_type] ?? data.terms_type}</span>`;

        // 사용 여부 뱃지
        document.getElementById('use_yn_badge').innerHTML =
          `<span class="badge badge-${data.use_yn}">${data.use_yn === 'Y' ? '사용 중' : '미사용'}</span>`;

        // PDF 원본 링크
        if (data.pdf_url) {
          document.getElementById('pdf-download-link').href = data.pdf_url;
        }
      })
      .catch(e => {
        console.error(e);
        showToast('약관 정보를 불러오지 못했습니다.', 'error');
      });

    /* ── PDF → JPG 미리보기 로드 ── */
    fetch(`/api/employee/approved/pdf?suggestion_no=${suggestion_no}`)
      .then(r => r.json())
      .then(data => {
        console.log(data);
        pdfPages = data;

        const grid = document.getElementById('imagesPDF');
        document.getElementById('page-count').textContent = `${data.length} 페이지`;

        if (!data.length) {
          grid.innerHTML = '<div class="pdf-empty">미리보기 이미지가 없습니다.</div>';
          return;
        }

        grid.innerHTML = data.map((pdf, i) => `
          <div class="pdf-thumb" onclick="openModal(${i})">
            <img src="data:image/jpg;base64,${pdf}" alt="약관 ${i + 1}페이지">
            <div class="page-label">${i + 1} / ${data.length}</div>
          </div>
        `).join('');
      })
      .catch(e => {
        console.error(e);
        document.getElementById('imagesPDF').innerHTML =
          '<div class="pdf-empty">PDF 미리보기를 불러오지 못했습니다.</div>';
      });

    /* ── 모달: 전체보기 ── */
    function openModal(index) {
      currentPage = index;
      updateModalImage();
      document.getElementById('pdfModal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('pdfModal').classList.remove('show');
    }
	
    // 모달 이미지!!
    function updateModalImage() {
      document.getElementById('modal-img').src =
        `data:image/jpg;base64,${pdfPages[currentPage]}`;
      document.getElementById('modal-page-info').textContent =
        `${currentPage + 1} / ${pdfPages.length}`;
      document.getElementById('prevBtn').disabled = currentPage === 0;
      document.getElementById('nextBtn').disabled = currentPage === pdfPages.length - 1;
      // 스크롤 상단으로
      document.querySelector('.modal-img-wrap').scrollTop = 0;
    }

    function changeModalPage(dir) {
      const next = currentPage + dir;
      if (next < 0 || next >= pdfPages.length) return;
      currentPage = next;
      updateModalImage();
    }

    // ESC 키로 모달 닫기
    document.addEventListener('keydown', e => {
      if (e.key === 'Escape') closeModal();
      if (e.key === 'ArrowRight') changeModalPage(1);
      if (e.key === 'ArrowLeft')  changeModalPage(-1);
    });

    // 모달 오버레이 클릭 시 닫기
    document.getElementById('pdfModal').addEventListener('click', function(e) {
      if (e.target === this) closeModal();
    });
  </script>

</body>
</html>
