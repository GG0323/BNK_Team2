<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>신규사원 등록</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
  background: #F5F5F5;
  display: flex;
  min-height: 100vh;
}

/* ===== 사이드바 ===== */
.sidebar {
  width: 190px;
  background: #111111;
  flex-shrink: 0;
  min-height: 100vh;
  position: fixed;
  top: 0; left: 0;
}

.sidebar .logo {
  font-size: 14px;
  font-weight: 700;
  color: #ffffff;
  padding: 1.5rem 1.25rem;
  letter-spacing: -0.3px;
  border-bottom: 1px solid #2a2a2a;
}

.sidebar .logo span { color: #E8282F; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 1.25rem;
  font-size: 13px;
  color: #888888;
  text-decoration: none;
  border-left: 3px solid transparent;
  transition: all 0.15s;
}

.nav-item:hover { color: #ffffff; background: #1c1c1c; }

.nav-item.active {
  color: #ffffff;
  background: #1c1c1c;
  border-left-color: #E8282F;
}

/* ===== 메인 ===== */
.main {
  margin-left: 190px;
  flex: 1;
  padding: 2rem;
  min-width: 0;
}

.topbar {
  display: flex;
  justify-content: flex-end;
  margin-bottom: 2rem;
}

.logout-btn {
  font-size: 12px;
  color: #555;
  background: #fff;
  border: 1px solid #E0E0E0;
  padding: 6px 16px;
  border-radius: 6px;
  cursor: pointer;
  font-weight: 500;
  transition: all 0.15s;
  text-decoration: none;
}

.logout-btn:hover { border-color: #111; color: #111; }

.breadcrumb {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  color: #aaa;
  margin-bottom: 1.5rem;
}

.breadcrumb .current { color: #111; font-weight: 600; }

.page-title {
  font-size: 18px;
  font-weight: 700;
  color: #111;
  letter-spacing: -0.5px;
  margin-bottom: 1.5rem;
}

/* ===== 폼 카드 ===== */
.form-card {
  background: #fff;
  border-radius: 12px;
  border: 1px solid #E8E8E8;
  padding: 2rem;
  max-width: 860px;
}

/* 섹션 구분 */
.form-section {
  margin-bottom: 1.75rem;
}

.form-section-title {
  font-size: 12px;
  font-weight: 700;
  color: #E8282F;
  letter-spacing: 0.5px;
  text-transform: uppercase;
  margin-bottom: 1rem;
  padding-bottom: 6px;
  border-bottom: 1px solid #F0F0F0;
}

/* 그리드 */
.form-grid-2 {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 16px;
}

.form-grid-3 {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
}

.form-col-full { grid-column: 1 / -1; }

/* 개별 필드 */
.form-group {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.form-group label {
  font-size: 12px;
  font-weight: 600;
  color: #555;
}

.form-group input[type="text"],
.form-group input[type="date"],
.form-group input[type="number"],
.form-group input[type="file"],
.form-group select {
  padding: 9px 12px;
  border: 1px solid #E0E0E0;
  border-radius: 8px;
  font-size: 13px;
  color: #111;
  background: #fff;
  outline: none;
  transition: border-color 0.15s;
  width: 100%;
}

.form-group input:focus,
.form-group select:focus { border-color: #111; }

.form-group input[type="file"] {
  padding: 7px 12px;
  color: #555;
  cursor: pointer;
}

/* 전화번호 3분할 */
.phone-row {
  display: flex;
  align-items: center;
  gap: 6px;
}

.phone-row input {
  flex: 1;
  padding: 9px 12px;
  border: 1px solid #E0E0E0;
  border-radius: 8px;
  font-size: 13px;
  color: #111;
  background: #fff;
  outline: none;
  text-align: center;
  transition: border-color 0.15s;
}

.phone-row input:focus { border-color: #111; }
.phone-sep { font-size: 14px; color: #bbb; font-weight: 600; }

/* 라디오 그룹 */
.radio-group {
  display: flex;
  gap: 12px;
  flex-wrap: wrap;
  align-items: center;
  padding: 4px 0;
}

.radio-item {
  display: flex;
  align-items: center;
  gap: 5px;
  cursor: pointer;
}

.radio-item input[type="radio"] {
  accent-color: #E8282F;
  width: 15px;
  height: 15px;
  cursor: pointer;
}

.radio-item label {
  font-size: 13px;
  color: #333;
  cursor: pointer;
  font-weight: 400;
}

/* 사진 미리보기 */
.photo-preview {
  width: 90px;
  height: 110px;
  border-radius: 8px;
  border: 1px solid #E0E0E0;
  background: #F5F5F5;
  display: flex;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  flex-shrink: 0;
}

.photo-preview img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.photo-placeholder {
  font-size: 11px;
  color: #bbb;
  text-align: center;
}

.photo-row {
  display: flex;
  align-items: flex-end;
  gap: 14px;
}

.photo-row .form-group { flex: 1; }

/* 구분선 */
.divider {
  border: none;
  border-top: 1px solid #F0F0F0;
  margin: 1.5rem 0;
}

/* 에러 메시지 */
.field-error {
  font-size: 11px;
  color: #E8282F;
  margin-top: 2px;
  display: none;
}

.field-error.show { display: block; }

/* 제출 버튼 */
.btn-row {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-top: 1.75rem;
}

.btn-cancel {
  padding: 10px 24px;
  font-size: 13px;
  font-weight: 600;
  border: 1px solid #E0E0E0;
  border-radius: 8px;
  background: #fff;
  color: #555;
  cursor: pointer;
  transition: all 0.15s;
  text-decoration: none;
}

.btn-cancel:hover { border-color: #111; color: #111; }

.btn-submit {
  padding: 10px 28px;
  font-size: 13px;
  font-weight: 600;
  border: none;
  border-radius: 8px;
  background: #E8282F;
  color: #fff;
  cursor: pointer;
  transition: background 0.15s;
}

.btn-submit:hover { background: #C5202A; }
.btn-submit:disabled { background: #ccc; cursor: not-allowed; }

/* 토스트 알림 */
.toast {
  position: fixed;
  bottom: 2rem;
  right: 2rem;
  padding: 12px 20px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: #fff;
  box-shadow: 0 4px 20px rgba(0,0,0,0.15);
  opacity: 0;
  transform: translateY(10px);
  transition: all 0.25s;
  pointer-events: none;
  z-index: 999;
}

.toast.show { opacity: 1; transform: translateY(0); }
.toast.success { background: #111; }
.toast.error   { background: #E8282F; }
</style>
</head>
<body>

  <!-- 사이드바 -->
  <aside class="sidebar">
    <div class="logo">BNK <span>관리자</span> 페이지</div>
    <a class="nav-item" th:href="@{/employee/toMain}">메인 페이지</a>
    <a class="nav-item active" th:href="@{/employee/manager/HRM/hrmRegist}">신규사원 등록</a>
    <a class="nav-item" th:href="@{/employee/manager/LOG/logList}">사원활동 로그</a>
    <a class="nav-item" th:href="@{/employee/manager/HRM/hrmEmployeeList}">직원 리스트</a>
    <a class="nav-item" th:href="@{/employee/manager/SUG/suggestionList}">제안서 리스트</a>
    <a class="nav-item" th:href="@{/employee/manager/SUG/approvedList}">승인된 제안서</a>
  </aside>

  <!-- 메인 -->
  <div class="main">

    <div class="topbar">
      <button class="logout-btn">로그아웃</button>
    </div>

    <div class="breadcrumb">
      관리자가 할 일 › 인사관리 › <span class="current">신규사원 등록</span>
    </div>

    <div class="page-title">신규사원 등록</div>

    <div class="form-card">

      <!-- 계정 정보 -->
      <div class="form-section">
        <div class="form-section-title">계정 정보</div>
        <div class="form-grid-2">
          <div class="form-group">
            <label>아이디 *</label>
            <input type="text" id="login_id" name="login_id" placeholder="login_id">
            <span class="field-error" id="err-login_id">아이디를 입력해주세요.</span>
          </div>
          <div class="form-group">
            <label>비밀번호 *</label>
            <input type="password" id="unHashPassword" name="unHashPassword" placeholder="비밀번호">
            <span class="field-error" id="err-unHashPassword">비밀번호를 입력해주세요.</span>
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- 기본 정보 -->
      <div class="form-section">
        <div class="form-section-title">기본 정보</div>
        <div class="form-grid-2">
          <div class="form-group">
            <label>이름 *</label>
            <input type="text" id="employee_name" name="employee_name" placeholder="홍길동">
            <span class="field-error" id="err-employee_name">이름을 입력해주세요.</span>
          </div>
          <div class="form-group">
            <label>생년월일</label>
            <input type="date" id="birth_date" name="birth_date">
          </div>

          <div class="form-group">
            <label>성별</label>
            <div class="radio-group">
              <div class="radio-item">
                <input type="radio" name="gender" value="M" id="M">
                <label for="M">남</label>
              </div>
              <div class="radio-item">
                <input type="radio" name="gender" value="F" id="F">
                <label for="F">여</label>
              </div>
            </div>
          </div>

          <div class="form-group">
            <label>전화번호</label>
            <div class="phone-row">
              <input type="text" id="phone_number1" name="phone_number1" placeholder="010" maxlength="3">
              <span class="phone-sep">-</span>
              <input type="text" id="phone_number2" name="phone_number2" placeholder="xxxx" maxlength="4">
              <span class="phone-sep">-</span>
              <input type="text" id="phone_number3" name="phone_number3" placeholder="xxxx" maxlength="4">
            </div>
          </div>

          <div class="form-group">
            <label>이메일</label>
            <input type="text" id="email" name="email" placeholder="example@bnk.com">
          </div>

          <div class="form-group">
            <label>집 주소</label>
            <input type="text" id="home_address" name="home_address" placeholder="주소를 입력해주세요">
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- 인사 정보 -->
      <div class="form-section">
        <div class="form-section-title">인사 정보</div>
        <div class="form-grid-3">
          <div class="form-group">
            <label>부서</label>
            <select id="dept_no" name="dept_no">
              <option value="1">경영지원부 : MGMT-001</option>
              <option value="2">상품기획부 : PROD-001</option>
              <option value="3">개발부 : DEV-001</option>
              <option value="4">인사부 : HR-001</option>
              <option value="5">마케팅부 : MKT-001</option>
            </select>
          </div>

          <div class="form-group">
            <label>직급</label>
            <select id="job_title" name="job_title">
              <option value="시스템 관리자">시스템 관리자</option>
              <option value="임원">임원</option>
              <option value="부장">부장</option>
              <option value="차장">차장</option>
              <option value="과장">과장</option>
              <option value="주임">주임</option>
              <option value="대리">대리</option>
              <option value="사원">사원</option>
              <option value="인턴">인턴</option>
            </select>
          </div>

          <div class="form-group">
            <label>입사일</label>
            <input type="date" id="hire_date" name="hire_date">
          </div>

          <div class="form-group form-col-full">
            <label>권한</label>
            <div class="radio-group">
              <div class="radio-item">
                <input type="radio" name="employee_role" value="ADMIN" id="ADMIN">
                <label for="ADMIN">ADMIN</label>
              </div>
              <div class="radio-item">
                <input type="radio" name="employee_role" value="MANAGER" id="MANAGER">
                <label for="MANAGER">MANAGER</label>
              </div>
              <div class="radio-item">
                <input type="radio" name="employee_role" value="EMPLOYEE" id="EMPLOYEE" checked>
                <label for="EMPLOYEE">EMPLOYEE</label>
              </div>
              <div class="radio-item">
                <input type="radio" name="employee_role" value="INTERN" id="INTERN">
                <label for="INTERN">INTERN</label>
              </div>
            </div>
          </div>
        </div>
      </div>

      <hr class="divider">

      <!-- 사진 -->
      <div class="form-section">
        <div class="form-section-title">프로필 사진</div>
        <div class="photo-row">
          <div class="photo-preview" id="photoPreview">
            <div class="photo-placeholder">미리보기</div>
          </div>
          <div class="form-group">
            <label>사진 업로드</label>
            <input type="file" id="img" name="img" accept="image/*">
          </div>
        </div>
      </div>

      <!-- 버튼 -->
      <div class="btn-row">
        <a class="btn-cancel" th:href="@{/employee/toMain}">취소</a>
        <button class="btn-submit" id="submitBtn" type="button" onclick="submitForm()">신규 사원 등록</button>
      </div>

    </div><!-- /.form-card -->
  </div><!-- /.main -->

  <!-- 토스트 -->
  <div class="toast" id="toast"></div>

  <script>
    /* ── 사진 미리보기 ── */
    document.getElementById('img').addEventListener('change', function () {
      const file = this.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        const preview = document.getElementById('photoPreview');
        preview.innerHTML = `<img src="${e.target.result}" alt="미리보기">`;
      };
      reader.readAsDataURL(file);
    });

    /* ── 전화번호 자동 다음 칸 이동 ── */
    document.getElementById('phone_number1').addEventListener('input', function () {
      if (this.value.length >= 3) document.getElementById('phone_number2').focus();
    });
    document.getElementById('phone_number2').addEventListener('input', function () {
      if (this.value.length >= 4) document.getElementById('phone_number3').focus();
    });

    /* ── 토스트 ── */
    function showToast(msg, type = 'success') {
      const t = document.getElementById('toast');
      t.textContent = msg;
      t.className = `toast ${type} show`;
      setTimeout(() => { t.className = 'toast'; }, 3000);
    }

    /* ── 유효성 검사 ── */
    function validate() {
      const required = ['login_id', 'unHashPassword', 'employee_name'];
      let valid = true;
      required.forEach(id => {
        const val = document.getElementById(id).value.trim();
        const err = document.getElementById('err-' + id);
        if (!val) { err.classList.add('show'); valid = false; }
        else       { err.classList.remove('show'); }
      });
      return valid;
    }

    /* ── 폼 제출 (fetch + FormData) ── */
    function submitForm() {
      if (!validate()) {
        showToast('필수 항목을 입력해주세요.', 'error');
        return;
      }

      const btn = document.getElementById('submitBtn');
      btn.disabled = true;
      btn.textContent = '등록 중...';

      const formData = new FormData();
      formData.append('dept_no',         document.getElementById('dept_no').value);
      formData.append('login_id',        document.getElementById('login_id').value.trim());
      formData.append('unHashPassword',  document.getElementById('unHashPassword').value);
      formData.append('employee_name',   document.getElementById('employee_name').value.trim());
      formData.append('birth_date',      document.getElementById('birth_date').value);
      formData.append('email',           document.getElementById('email').value.trim());
      formData.append('home_address',    document.getElementById('home_address').value.trim());
      formData.append('hire_date',       document.getElementById('hire_date').value);
      formData.append('job_title',       document.getElementById('job_title').value);

      const gender = document.querySelector('input[name="gender"]:checked');
      if (gender) formData.append('gender', gender.value);

      const role = document.querySelector('input[name="employee_role"]:checked');
      if (role) formData.append('employee_role', role.value);

      const p1 = document.getElementById('phone_number1').value;
      const p2 = document.getElementById('phone_number2').value;
      const p3 = document.getElementById('phone_number3').value;
      if (p1 && p2 && p3) {
        formData.append('phone_number1', p1);
        formData.append('phone_number2', p2);
        formData.append('phone_number3', p3);
      }

      const imgFile = document.getElementById('img').files[0];
      if (imgFile) formData.append('img', imgFile);
	  
      
      // 페치문
      fetch('/api/employee/HRM/regist', {
        method: 'POST',
        body: formData
      })
      .then(response => {
        if (!response.ok) throw new Error('서버 오류: ' + response.status);
        return response.text();
      })
      .then(() => {
        showToast('사원이 성공적으로 등록되었습니다.', 'success');
        setTimeout(() => {
          window.location.href = '/employee/manager/HRM/hrmEmployeeList';
        }, 1500);
      })
      .catch(e => {
        console.error(e);
        showToast('등록 중 오류가 발생했습니다.', 'error');
        btn.disabled = false;
        btn.textContent = '신규 사원 등록';
      });
    }
  </script>

</body>
</html>
