<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Insert title here</title>
</head>
<body>

	<form id="hrmRegistForm">
		
		<label>부서</label>
		<select name="dept_no">
			<option value="MGMT-001">경영지원부</option>
			<option value="PROD-001">상품기획부</option>	
			<option value="DEV-001">개발부</option>
			<option value="HR-001">인사부</option>
			<option value="MKT-001">마케팅부</option>
		</select>
		
		
		<label>아이디</label>
		<input type="text" name="login_id" placeholder="login_id">
		<label>비밀번호</label>
		<input type="text" name="unHashPassword" placeholder="unHashPassword">
		<label>이름</label>
		<input type="text" name="employee_name" placeholder="employee_name">
		
		<label>성별</label>
		<input type="radio" name="gender" value="M" id="M"> <label for="M">남</label>
		<input type="radio" name="gender" value="F" id="F"> <label for="F">여</label>
		
		<label>생년월일</label>
		<input type="date" name="birth_date">
		
		<label>전화번호</label>
		<input type="text" name="phone_number1" placeholder="010">-
		<input type="text" name="phone_number2" placeholder="xxxx">-
		<input type="text" name="phone_number3" placeholder="xxxx">
		
		
		<label>e-mail</label>
		<input type="text" name="email" placeholder="email">
		<label>집 주소</label>
		<input type="text" name="home_address" placeholder="home_address">
		
		달력<label>입사일</label>
		<input type="date" name="hire_date">
		
		<label>직급</label>
		<select name="job_title">
			<option value="시스템 관리자">시스템 관리자</option>
			<option value="임원">임원</option>
			<option value="부장">부장</option>
			<option value="차장">차장</option>
			<option value="과장">과장</option>
			<option value="주임">주임</option>
			<option value="대리">대리</option>
			<option value="사원">사원</option>
			<option value="인턴">인턴</option>
		</select>
		
		<label>권한</label>
		<input type="text" name="employee_role" placeholder="">
		<input type="radio" name="employee_role" value="ADMIN" id="ADMIN"> <label for="ADMIN">ADMIN</label>
		<input type="radio" name="employee_role" value="MANAGER" id="MANAGER"> <label for="MANAGER">MANAGER</label>
		<input type="radio" name="employee_role" value="EMPLOYEE" id="EMPLOYEE"> <label for="EMPLOYEE">EMPLOYEE</label>
		<input type="radio" name="employee_role" value="INTERN" id="INTERN"> <label for="INTERN">INTERN</label>
		
		멀티파트 폼데이터<label>사진</label>
		<input type="file" name="img">
		
		<input type="submit" value="신규 사원 등록">
	</form>
	
	<div>
		입력값 검증 필요
	</div>

<script>
	
	const hrmRegistForm = document.querySelector("#hrmRegistForm");
	
	hrmRegistForm.addEventListener("submit", (e) => {
		e.preventDefault();
		
		fetch("/api/employee/HRM/regist",{
			method: "POST",
			body: new formData(hrmRegistForm)
		})
		.than(response => response.text())
		.than(data => {
			
		})
		.catch(e => console.log(e));
		
		
		
	});
	
	
	
	
	
</script>



</body>
</html>
