<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 예약 목록</title>

    <th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>

    <!-- 마이페이지 공통 레이아웃/네비 스타일 재사용 -->
    <link rel="stylesheet" href="/css/member/mypage.css">
    <link rel="stylesheet" href="/css/member/member-nav.css">
    <!-- 예약 목록 전용 스타일 -->
    <link rel="stylesheet" th:href="@{/css/member/myReservation.css}">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script th:src="@{/js/members/myReservation.js}" defer></script>
</head>
<body>
	<div th:replace="~{fragments/header :: header_default}"></div>

    <!-- 마이페이지와 동일한 검정 상단 헤더 -->
    <header class="top-header">
	    <div class="header-inner">
	        <div class="header-left">
	            <div class="header-title-group">
	                <h2>마이페이지</h2>
	                <p>회원 정보 · 계좌 · 상품 가입 내역</p>
	            </div>
	        </div>
	        <div th:replace="~{fragments/nav :: member_top_mypage}"></div>
	    </div>
	</header>

    <!-- 마이페이지 서브 네비게이션 (영업점 예약 탭 활성화) -->
    <div th:replace="~{fragments/nav :: member_mypage('myreservation')}"></div>

    <main class="mypage-container">

        <section class="page-header">
            <h3>내 예약 목록</h3>
            <p>영업점 방문 예약 내역을 확인하고 관리하세요.</p>
        </section>

        <div id="resList">
            <div class="loading">예약 목록을 불러오는 중...</div>
        </div>

        <div class="notice">
            · 예약 취소는 <b>접수</b> 또는 <b>확정</b> 상태일 때만 가능합니다.<br>
            · 일정 변경이 필요하면 기존 예약을 취소한 뒤 새로 예약해 주세요.<br>
            · 영업점 사정으로 일정이 변경될 경우 변경통보 상태로 안내됩니다.
        </div>

    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
