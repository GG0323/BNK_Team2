<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>내 예약 목록</title>

    <meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

    <th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>

    <link rel="stylesheet" href="/css/member/member-common.css">
    <link rel="stylesheet" href="/css/member/member-nav.css">
    <link rel="stylesheet" th:href="@{/css/member/myReservation.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <script th:src="@{/js/members/common.js}" defer></script>
    <script th:src="@{/js/members/myReservation.js}" defer></script>
    <script th:src="@{/js/members/member-ui.js}" defer></script>
</head>
<body>
    <div th:replace="~{fragments/header :: header_default}"></div>

    <header class="top-header">
        <div class="header-inner">
            <div class="header-left">
                <div class="header-title-group">
                    <h2>마이페이지</h2>
                    <p>회원 정보 · 계좌 · 상품 가입 내역</p>
                </div>
            </div>
            <div th:replace="~{fragments/nav :: member_top_mypage}"></div>
        </div>
    </header>

    <div th:replace="~{fragments/nav :: member_mypage('myreservation')}"></div>

    <main class="reservation-main">
        <section class="page-header page-motion-row">
            <h3>내 예약 목록</h3>
            <p>영업점 방문 예약 내역을 확인하고 관리하세요.</p>
        </section>

        <section id="resList" class="member-content-panel is-padding page-motion-row motion-list">
            <div class="member-empty">
                <p>예약 목록을 불러오는 중...</p>
            </div>
        </section>

        <div class="member-notice page-motion-row">
            · 예약 취소는 <b>접수</b> 또는 <b>확정</b> 상태일 때만 가능합니다.<br>
            · 일정 변경이 필요하면 기존 예약을 취소한 뒤 새로 예약해 주세요.<br>
            · 영업점 사정으로 일정이 변경될 경우 변경통보 상태로 안내됩니다.
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
