<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>내 예약 목록</title>
    <link rel="stylesheet" th:href="@{/css/reservationView.css}">
    <th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>
    <style>
        .my-res-wrap {
            max-width: 860px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* 헤더 */
        .my-res-header {
            background: linear-gradient(135deg, #111111, #d71920);
            color: white;
            padding: 28px 36px;
            border-radius: 24px;
            box-shadow: 0 14px 30px rgba(215, 25, 32, 0.22);
            margin-bottom: 24px;
        }
        .my-res-header h1 { margin: 0 0 8px; font-size: 26px; }
        .my-res-header p  { margin: 0; opacity: 0.9; font-size: 14px; }

        /* 예약 카드 */
        .res-list { display: flex; flex-direction: column; gap: 16px; }

        .res-card {
            background: white;
            border: 1px solid #eeeeee;
            border-radius: 18px;
            padding: 22px 26px;
            box-shadow: 0 6px 18px rgba(0,0,0,0.05);
        }

        .res-card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            padding-bottom: 14px;
            border-bottom: 1px solid #f0f0f0;
        }

        .res-no {
            font-size: 13px;
            color: #999999;
        }
        .res-no b { color: #d71920; font-size: 15px; }

        .res-badge {
            font-size: 12px;
            font-weight: 700;
            padding: 4px 12px;
            border-radius: 99px;
        }
        .badge-PENDING    { background: #fff3e0; color: #e65100; }
        .badge-CONFIRMED  { background: #e8f5e9; color: #2e7d32; }
        .badge-REASSIGNED { background: #e3f2fd; color: #1565c0; }
        .badge-REJECTED   { background: #fce4ec; color: #c62828; }
        .badge-CANCELED   { background: #f5f5f5; color: #9e9e9e; }

        .res-card-body {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px 24px;
            margin-bottom: 18px;
        }

        .res-field .rf-key {
            font-size: 12px;
            color: #999999;
            margin-bottom: 3px;
        }
        .res-field .rf-val {
            font-size: 14px;
            font-weight: 700;
            color: #111111;
        }

        .res-card-bottom {
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }

        .btn-cancel {
            height: 40px;
            padding: 0 22px;
            border-radius: 10px;
            border: 1px solid #d71920;
            background: white;
            color: #d71920;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
        }
        .btn-cancel:hover {
            background: #d71920;
            color: white;
        }

        .btn-rebook {
            height: 40px;
            padding: 0 22px;
            border-radius: 10px;
            border: none;
            background: #111111;
            color: white;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: 0.15s;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
        }
        .btn-rebook:hover { background: #333333; }

        /* 빈 상태 */
        .empty-state {
            text-align: center;
            padding: 80px 20px;
            background: white;
            border: 1px solid #eeeeee;
            border-radius: 18px;
        }
        .empty-state .empty-icon {
            font-size: 48px;
            margin-bottom: 16px;
        }
        .empty-state p {
            color: #999999;
            font-size: 15px;
            margin: 0 0 24px;
        }

        .btn-new-res {
            display: inline-flex;
            align-items: center;
            height: 46px;
            padding: 0 28px;
            border-radius: 12px;
            background: #d71920;
            color: white;
            font-size: 15px;
            font-weight: 700;
            text-decoration: none;
            transition: 0.15s;
        }
        .btn-new-res:hover { background: #b81218; }

        /* 안내 박스 */
        .notice {
            margin-top: 20px;
            padding: 14px 16px;
            border-radius: 12px;
            background: #fff1f1;
            color: #b81218;
            font-size: 13px;
            line-height: 1.7;
            border: 1px solid #ffd6d8;
        }

        /* 로딩 */
        .loading {
            text-align: center;
            padding: 60px;
            color: #999;
            font-size: 14px;
        }
    </style>
</head>
<body>
<div th:replace="~{fragments/header :: header_default}"></div>

<div class="my-res-wrap">

    <div class="my-res-header">
        <h1>내 예약 목록</h1>
        <p>영업점 방문 예약 내역을 확인하고 관리하세요.</p>
    </div>

    <div id="resList">
        <div class="loading">예약 목록을 불러오는 중...</div>
    </div>

    <div class="notice">
        · 예약 취소는 <b>접수(PENDING)</b> 또는 <b>확정(CONFIRMED)</b> 상태일 때만 가능합니다.<br>
        · 일정 변경이 필요하면 기존 예약을 취소한 뒤 새로 예약해 주세요.<br>
        · 영업점 사정으로 일정이 변경될 경우 변경통보 상태로 안내됩니다.
    </div>

</div>

<div th:replace="~{fragments/footer :: footer}"></div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const STATUS_LABEL = {
        PENDING:    '접수',
        CONFIRMED:  '확정',
        REASSIGNED: '변경통보',
        REJECTED:   '거절',
        CANCELED:   '취소'
    };

    const BIZ_LABEL = {
        DEPOSIT: '예금·적금 상담',
        LOAN:    '대출 상담',
        CARD:    '카드 발급',
        FX:      '외환·송금',
        ETC:     '기타 문의'
    };

    // CSRF 토큰
    const csrfEl = document.querySelector('input[name="_csrf"]');
    const csrfToken = csrfEl ? csrfEl.value : null;

    // 예약 목록 조회
    fetch("/api/member/reservation/list")
        .then(function (r) { return r.json(); })
        .then(function (data) {
            const list = (data && data.data) ? data.data : [];
            render(list);
        })
        .catch(function () {
            document.getElementById("resList").innerHTML =
                '<div class="empty-state"><div class="empty-icon">⚠️</div><p>목록을 불러오지 못했습니다.</p></div>';
        });

    function render(list) {
        const wrap = document.getElementById("resList");

        if (list.length === 0) {
            wrap.innerHTML =
                '<div class="empty-state">' +
                    '<div class="empty-icon">📋</div>' +
                    '<p>예약 내역이 없습니다.</p>' +
                    '<a href="/products" class="btn-new-res">상품 둘러보기</a>' +
                '</div>';
            return;
        }

        wrap.innerHTML = '<div class="res-list" id="resListInner"></div>';
        const inner = document.getElementById("resListInner");

        list.forEach(function (r) {
            const canCancel = (r.status === 'PENDING' || r.status === 'CONFIRMED');
            const card = document.createElement("div");
            card.className = "res-card";
            card.innerHTML =
                '<div class="res-card-top">' +
                    '<span class="res-no">예약번호 <b>BR-' + r.reservation_id + '</b></span>' +
                    '<span class="res-badge badge-' + r.status + '">' + (STATUS_LABEL[r.status] || r.status) + '</span>' +
                '</div>' +
                '<div class="res-card-body">' +
                    field("영업점",    r.branch_name  || '-') +
                    field("예약 일시", formatDt(r.reserved_at)) +
                    field("업무 유형", BIZ_LABEL[r.biz_type] || r.biz_type || '-') +
                    field("방문 목적", r.purpose      || '-') +
                    field("신청 일시", formatDt(r.created_at)) +
                '</div>' +
                '<div class="res-card-bottom">' +
                    (canCancel
                        ? '<button class="btn-cancel" data-id="' + r.reservation_id + '">예약 취소</button>'
                        : '') +
                    (r.status === 'CANCELED' || r.status === 'REJECTED'
                        ? '<a href="/products" class="btn-rebook">다시 예약하기</a>'
                        : '') +
                '</div>';
            inner.appendChild(card);
        });

        // 취소 버튼 이벤트
        document.querySelectorAll(".btn-cancel").forEach(function (btn) {
            btn.addEventListener("click", function () {
                const resId = btn.getAttribute("data-id");
                if (!confirm("예약을 취소하시겠습니까?\n취소 후에는 되돌릴 수 없습니다.")) return;
                cancelReservation(resId);
            });
        });
    }

    function cancelReservation(reservationId) {
        const headers = { "Content-Type": "application/x-www-form-urlencoded" };
        if (csrfToken) headers["X-CSRF-TOKEN"] = csrfToken;

        const params = new URLSearchParams();
        params.append("reservationId", reservationId);

        fetch("/api/member/reservation/cancel", {
            method: "POST",
            headers: headers,
            body: params.toString()
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data && data.success) {
                alert("예약이 취소되었습니다.");
                location.reload();
            } else {
                alert((data && data.message) ? data.message : "취소에 실패했습니다.");
            }
        })
        .catch(function () {
            alert("요청 처리 중 오류가 발생했습니다.");
        });
    }

    function field(key, val) {
        return '<div class="res-field">' +
            '<div class="rf-key">' + key + '</div>' +
            '<div class="rf-val">' + (val || '-') + '</div>' +
        '</div>';
    }

    function formatDt(val) {
        if (!val) return '-';
        return String(val).substring(0, 16).replace('T', ' ');
    }
});
</script>
</body>
</html>
