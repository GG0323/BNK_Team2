<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK 계좌 상세 및 거래내역</title>
    
    <th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>
    
    <link rel="stylesheet" href="/css/member/myhistory.css">
    <link rel="stylesheet" href="/css/member/member-nav.css">
    
    <script src="/js/members/common.js" defer></script>
    <script src="/js/members/myhistory.js" defer></script>
</head>
<body>
	<div th:replace="~{fragments/header :: header_default}"></div>
    <header class="top-header">
        <div class="header-inner">
            <div class="header-left">
                <h1>BNK</h1>
                <div class="header-title-group">
                    <h2>계좌 상세 / 거래내역 조회</h2>
                    <p>선택 계좌 상세 정보 및 최근 거래내역</p>
                </div>
            </div>
            <div th:replace="~{fragments/nav :: member_top_mypage}"></div>
        </div>
    </header>
    
	<div th:replace="~{fragments/nav :: member_mypage('myaccounts')}"></div>

    <main class="history-container">

        <section class="page-header">
            <h3>계좌 상세 / 거래내역 조회</h3>
            <p>선택한 계좌의 상세 정보와 거래내역을 조회합니다.</p>
        </section>

        <div class="top-info-grid">
            <section class="info-card-box">
                <h4>계좌 상세 정보</h4>
                <table class="detail-table">
                    <tbody>
                        <tr><th>계좌 별칭</th><td id="d_alias">-</td></tr>
                        <tr><th>계좌번호</th><td class="account-num" id="d_number">-</td></tr>
                        <tr><th>현재 잔액</th><td><strong id="d_balance">-</strong></td></tr>
                        <tr><th>계좌 상태</th><td><span class="status-badge" id="d_status">-</span></td></tr>
                        <tr><th>개설 일자</th><td id="d_opened">-</td></tr>
                    </tbody>
                </table>
            </section>

            <section class="info-card-box">
                <h4>조회 조건</h4>
                <div class="filter-group">
                    <span class="filter-label">유형</span>
                    <div class="filter-buttons">
                        <button type="button" class="btn-filter active">전체</button>
                        <button type="button" class="btn-filter">입금</button>
                        <button type="button" class="btn-filter">출금</button>
                        <button type="button" class="btn-filter">이체</button>
                    </div>
                </div>
                <div class="filter-row">
                    <span class="filter-label">조회 기간</span>
                    <span class="filter-value">최근 1개월</span>
                </div>
                <div class="filter-row">
                    <span class="filter-label">정렬 기준</span>
                    <span class="filter-value">최신순</span>
                </div>
            </section>
        </div>

        <section class="history-list-section">
            <div class="table-wrapper">
                <table class="history-table">
                    <thead>
                        <tr>
                            <th>거래일시</th>
                            <th>유형</th>
                            <th>거래처명</th>
                            <th>거래금액</th>
                            <th>거래 후 잔액</th>
                            <th>메모</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="6" class="empty-row">불러오는 중...</td></tr>
                    </tbody>
                </table>
            </div>
        </section>

    </main>
    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
