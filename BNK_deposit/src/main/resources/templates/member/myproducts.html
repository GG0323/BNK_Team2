<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK 가입 상품 내역 조회</title>
    <th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>
    
    <link rel="stylesheet" href="/css/member/myproducts.css">
    <link rel="stylesheet" href="/css/member/member-nav.css">
    
    <script src="/js/members/common.js" defer></script>
    <script src="/js/members/myproducts.js" defer></script>
</head>
<body>
	<div th:replace="~{fragments/header :: header_default}"></div>
    <header class="top-header">
        <div class="header-inner">
            <div class="header-left">
                <h1>BNK</h1>
                <div class="header-title-group">
                    <h2>가입 상품 내역 조회</h2>
                    <p>가입한 예금·적금 상품 확인</p>
                </div>
            </div>
            <nav class="header-right">
			    <ul>
			        <li><a href="/">메인</a></li>
			        <li><a href="/myaccounts">계좌조회</a></li>
			        <li><a href="/myaccounts">거래내역</a></li>
			        <li><a href="/myproducts">가입상품</a></li>
			    </ul>
			    <button type="button" class="btn-mypage-header" onclick="location.href='/mypage'">
			        마이페이지
			    </button>
			</nav>
        </div>
    </header>

    <div th:replace="~{fragments/nav :: member_mypage('myproducts')}"></div>

    <main class="products-container">

        <section class="page-header">
            <h3>가입 상품 내역 조회</h3>
            <p>로그인한 회원이 가입한 상품 내역을 확인합니다.</p>
        </section>

        <section class="product-list" id="productList">
            <div class="empty-state">불러오는 중...</div>
        </section>

    </main>
	<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
