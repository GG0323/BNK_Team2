<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>BNK QR 로그인</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans KR", Arial, sans-serif;
            background: #f5f5f5;
            color: #111111;
        }

        .login-wrap {
            width: 520px;
            margin: 70px auto;
            background: white;
            border: 1px solid #dddddd;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
        }

        .top-menu {
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 42px;
            padding: 0 18px;
            border-bottom: 1px solid #dddddd;
            font-size: 13px;
        }

        .logo {
            font-weight: 900;
            font-size: 20px;
        }

        .menu span {
            margin-left: 10px;
            color: #777777;
        }

        .menu .active {
            color: #d71920;
            font-weight: 700;
        }

        .title-box {
            padding: 22px 24px;
            background: #f3f4f8;
            border-bottom: 1px solid #dddddd;
        }

        .title-box h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .title-box p {
            margin: 0;
            font-size: 13px;
            color: #777777;
        }

        .tab-box {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: 54px;
            border-bottom: 1px solid #eeeeee;
        }

        .tab {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 17px;
            background: #f4f4f7;
            border-top: 3px solid transparent;
        }

        .tab.active {
            background: white;
            border-top-color: #d71920;
            font-weight: 700;
        }

        .qr-content {
            padding: 32px 34px 26px;
            text-align: center;
        }

        .qr-content h2 {
            margin: 0 0 18px;
            font-size: 18px;
        }

        .qr-box {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 250px;
            height: 250px;
            border: 1px solid #dddddd;
            background: #ffffff;
            margin-bottom: 18px;
        }

        .qr-box img {
            width: 220px;
            height: 220px;
        }

        .desc {
            margin: 0 0 22px;
            color: #666666;
            font-size: 13px;
            line-height: 1.6;
        }

        .status-box {
            margin: 16px auto 22px;
            padding: 12px;
            width: 320px;
            border-radius: 8px;
            background: #fff1f1;
            color: #d71920;
            font-size: 13px;
            font-weight: 700;
        }

        .step-box {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin-top: 26px;
        }

        .step {
            border: 1px solid #cccccc;
            border-radius: 8px;
            padding: 14px 10px;
            min-height: 95px;
            text-align: center;
        }

        .step-num {
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #111111;
            color: white;
            font-weight: 800;
            margin-bottom: 8px;
        }

        .step p {
            margin: 0;
            color: #666666;
            font-size: 12px;
            line-height: 1.5;
        }

        .bottom-menu {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            border-top: 1px solid #eeeeee;
            background: #f4f4f7;
        }

        .bottom-menu div {
            padding: 14px 4px;
            text-align: center;
            font-size: 12px;
            color: #555555;
            border-right: 1px solid #dddddd;
        }

        .bottom-menu div:last-child {
            border-right: none;
        }
    </style>
</head>
<body>

<div class="login-wrap">

    <div class="top-menu">
        <div class="logo">BNK</div>
        <div class="menu">
            <span class="active">개인</span>
            <span>기업금융</span>
            <span>상품</span>
            <span>고객센터</span>
        </div>
    </div>

    <div class="title-box">
        <h1>로그인</h1>
        <p>QR 로그인 또는 아이디 로그인을 선택하여 로그인할 수 있습니다.</p>
    </div>

    <div class="tab-box">
        <div class="tab active">QR 로그인</div>
        <div class="tab">아이디 로그인</div>
    </div>

    <div class="qr-content">
        <h2>QR 코드로 로그인</h2>

        <div class="qr-box">
            <img th:src="@{/qr-image(authId=${authId})}" alt="QR 로그인 코드">
        </div>

        <p class="desc">
            모바일 앱에서 QR코드를 스캔하면 PC 로그인이 완료됩니다.
        </p>

        <div id="statusBox" class="status-box">
            모바일 인증을 기다리는 중입니다.
        </div>

        <div class="step-box">
            <div class="step">
                <div class="step-num">1</div>
                <p>PC 화면에서<br>QR 코드를 생성합니다.</p>
            </div>

            <div class="step">
                <div class="step-num">2</div>
                <p>모바일 앱에서<br>QR 코드를 스캔합니다.</p>
            </div>

            <div class="step">
                <div class="step-num">3</div>
                <p>인증 완료 후<br>PC 로그인이 처리됩니다.</p>
            </div>
        </div>
    </div>

    <div class="bottom-menu">
        <div>회원가입</div>
        <div>인증센터</div>
        <div>로그인 설정</div>
        <div>이용 안내</div>
    </div>

</div>

<script th:inline="javascript">
    const authId = /*[[${authId}]]*/ "";

    function checkQrStatus() {
        fetch("/qr-status?authId=" + authId)
            .then(response => response.json())
            .then(data => {
                if (data.login === true) {
                    document.getElementById("statusBox").innerText =
                        data.memberName + "님 인증 완료. 로그인 처리 중입니다.";

                    location.href = "/qr-login-success";
                }
            })
            .catch(error => {
                console.log(error);
            });
    }

    setInterval(checkQrStatus, 2000);
</script>

</body>
</html>
