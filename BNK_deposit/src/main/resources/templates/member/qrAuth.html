<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>QR 로그인 인증</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Noto Sans KR", Arial, sans-serif;
            background: #f5f5f5;
            color: #111111;
        }

        .auth-wrap {
            max-width: 430px;
            margin: 70px auto;
            background: white;
            border-radius: 22px;
            padding: 34px 28px;
            box-shadow: 0 10px 28px rgba(0, 0, 0, 0.08);
            border: 1px solid #eeeeee;
        }

        .logo {
            font-size: 22px;
            font-weight: 900;
            margin-bottom: 24px;
            color: #111111;
        }

        .title-box {
            padding: 26px 24px;
            border-radius: 18px;
            background: linear-gradient(135deg, #111111, #d71920);
            color: white;
            margin-bottom: 24px;
        }

        .title-box h1 {
            margin: 0 0 8px;
            font-size: 24px;
        }

        .title-box p {
            margin: 0;
            font-size: 14px;
            line-height: 1.6;
            opacity: 0.92;
        }

        .info-box {
            background: #fafafa;
            border: 1px solid #eeeeee;
            border-radius: 16px;
            padding: 18px;
            margin-bottom: 20px;
        }

        .info-box strong {
            display: block;
            margin-bottom: 8px;
            font-size: 16px;
        }

        .info-box p {
            margin: 0;
            color: #555555;
            font-size: 14px;
            line-height: 1.7;
        }

        .message-box {
            padding: 12px;
            border-radius: 12px;
            background: #fff1f1;
            color: #d71920;
            font-size: 14px;
            font-weight: 700;
            margin-bottom: 18px;
        }

        .auth-btn {
            width: 100%;
            height: 48px;
            border: none;
            border-radius: 14px;
            background: #d71920;
            color: white;
            font-size: 16px;
            font-weight: 800;
            cursor: pointer;
        }

        .auth-btn:hover {
            background: #b81218;
        }

        .sub-text {
            margin-top: 16px;
            color: #777777;
            font-size: 13px;
            line-height: 1.6;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="auth-wrap">

    <div class="logo">BNK</div>

    <div class="title-box">
        <h1>QR 로그인 인증</h1>
        <p>
            PC 화면에 표시된 QR 로그인 요청을 인증합니다.
        </p>
    </div>

    <div class="info-box">
        <strong>모바일 앱 로그인 상태 확인</strong>
        <p>
            실제 서비스에서는 앱에 로그인된 사용자의 회원 정보로 인증됩니다.<br>
            현재 프로젝트에서는 시연용으로 1번 회원을 사용합니다.
        </p>
    </div>

    <div th:if="${message != null}" class="message-box" th:text="${message}">
        메시지
    </div>

    <form th:action="@{/qr-auth}" method="post">
        <input type="hidden" name="authId" th:value="${authId}">
        <input type="hidden" name="member_no" th:value="${member_no}">

        <button type="submit" class="auth-btn">
            QR 로그인 인증하기
        </button>
    </form>

    <p class="sub-text">
        인증을 완료하면 PC 화면에서 자동으로 로그인 완료 화면으로 이동합니다.
    </p>

</div>

</body>
</html>
