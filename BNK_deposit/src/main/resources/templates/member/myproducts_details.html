<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK 가입상품 상세</title>

    <th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>

    <link rel="stylesheet" href="/css/member/member-common.css">
    <link rel="stylesheet" href="/css/member/member-nav.css">
    <link rel="stylesheet" href="/css/member/myproducts.css">
    <link rel="stylesheet" href="/css/member/myproducts_details.css">

    <script src="/js/members/common.js" defer></script>
    <script src="/js/members/myproducts_details.js" defer></script>
    <script th:src="@{/js/members/member-ui.js}" defer></script>
</head>
<body>
    <div th:replace="~{fragments/header :: header_default}"></div>

    <header class="top-header">
        <div class="header-inner">
            <div class="header-left">
                <div class="header-title-group">
                    <h2>마이페이지</h2>
                    <p>회원 정보 · 계좌 · 상품 가입 내역</p>
                </div>
            </div>
            <div th:replace="~{fragments/nav :: member_top_mypage}"></div>
        </div>
    </header>

    <div th:replace="~{fragments/nav :: member_mypage('myproducts')}"></div>

    <main class="products-container">
        <section class="page-header page-motion-row">
            <h3>가입상품 상세</h3>
            <p>가입 상품의 만기일, 남은 기간, 예상 수령액을 확인합니다.</p>
        </section>

        <section id="productDetail" class="page-motion-row">
            <div class="empty-state">불러오는 중...</div>
        </section>
    </main>

    <div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
