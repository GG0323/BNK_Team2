<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Signup Page</title>

	<th:block th:replace="~{fragments/header :: headerCss}"></th:block>
	<th:block th:replace="~{fragments/footer :: footerCss}"></th:block>

	<link rel="stylesheet" th:href="@{/css/member/signup.css}">
	<script th:src="@{/js/members/signup.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header_default}"></div>

<main class="signup-main">
	<section class="signup-card">

		<div class="signup-title-box">
			<p class="signup-label">BNK 부산은행</p>
			<h2>회원가입</h2>
			<p class="signup-desc">금융상품 서비스를 이용하기 위한 회원 정보를 입력해 주세요.</p>
		</div>

		<form id="frm" class="signup-form">
			<!-- <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"> -->

			<div class="form-section">
				<h3>기본 정보</h3>

				<div class="input-group">
					<label for="loginId">아이디</label>
					<div class="inline-row">
						<input type="text" id="loginId" name="login_id" placeholder="아이디를 입력하세요">
						<button type="button" class="sub-btn" onclick="idCheck()">중복확인</button>
					</div>
				</div>

				<div class="input-group">
					<label for="password">비밀번호</label>
					<input type="password" id="password" name="password_hash" placeholder="비밀번호를 입력하세요">
				</div>

				<div class="input-group">
					<label for="pwCheck">비밀번호 확인</label>
					<input id="pwCheck" type="password" placeholder="비밀번호를 다시 입력하세요">
				</div>

				<div class="input-group">
					<label for="memberName">이름</label>
					<input type="text" id="memberName" name="member_name" placeholder="이름을 입력하세요">
				</div>
			</div>

			<div class="form-section">
				<h3>회원 구분</h3>

				<div class="input-group">
					<label for="memberType">회원구분</label>
					<select name="member_type" id="memberType" required onchange="changeMemberType();">
						<option value="">회원구분 선택</option>
						<option value="PERSONAL">개인</option>
						<option value="BUSINESS">기업</option>
					</select>
				</div>

				<div id="personalIdentifier" class="identifier-box" style="display:none;">
					<label>주민등록번호</label>
					<div class="identifier-row personal">
						<input type="password" id="personalId1" maxlength="6" pattern="[0-9]{6}" placeholder="YYMMDD">
						<span>-</span>
						<input type="password" id="personalId2" maxlength="7" pattern="[0-9]{7}" placeholder="ABCDEFG">
					</div>
				</div>

				<div id="businessIdentifier" class="identifier-box" style="display:none;">
				    <label>사업자등록번호</label>
				    <div class="identifier-row business">
				        <input type="password" id="businessId1" maxlength="3" pattern="[0-9]{3}" placeholder="000">
				        <span>-</span>
				        <input type="password" id="businessId2" maxlength="2" pattern="[0-9]{2}" placeholder="00">
				        <span>-</span>
				        <input type="password" id="businessId3" maxlength="5" pattern="[0-9]{5}" placeholder="00000">
				    </div>
				
				    <div class="input-group">
				        <label for="businessOpenDate">개업일자</label>
				        <input type="date" id="businessOpenDate" name="birth_date">
				    </div>
				</div>

				<input type="hidden" name="member_identifier" id="memberIdentifier">
			</div>

			<div class="form-section">
				<h3>연락처 정보</h3>

				<div class="input-group">
					<label for="phoneNumber">휴대폰 번호</label>
					<input type="text" id="phoneNumber" name="phone_number" placeholder="휴대폰 번호를 입력하세요">
				</div>

				<div class="input-group">
					<label for="email">이메일</label>
					<input type="email" id="email" name="email" placeholder="이메일을 입력하세요">
				</div>

				<div class="input-group">
					<label for="address">주소</label>
					<input type="text" id="address" name="adress" placeholder="주소를 입력하세요">
				</div>
			</div>

			<button type="button" class="signup-btn" onclick="signup()">회원가입</button>
		</form>

	</section>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
