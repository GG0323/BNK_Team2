<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK 회원가입</title>

    <th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>

    <link rel="stylesheet" th:href="@{/css/member/signup.css}">

    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js" defer></script>
    <script th:src="@{/js/members/signup.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header_default}"></div>

<header class="top-header">
    <div class="signup-header-inner">
        <div class="header-left">
            <h1>BNK</h1>
            <div class="header-title-group">
                <h2>회원가입</h2>
                <p>BNK 금융상품 서비스 이용을 위한 회원 정보 등록</p>
            </div>
        </div>

        <div class="header-right">
            <ul>
                <li><a th:href="@{/loginPage}">로그인</a></li>
                <li><a th:href="@{/}">메인</a></li>
            </ul>
        </div>
    </div>
</header>

<main class="signup-container">

    <section class="page-header">
        <h3>회원가입</h3>
        <p>금융상품 조회 및 가입 서비스를 이용하기 위해 기본 회원 정보를 입력해 주세요.</p>
    </section>

    <form id="frm">

        <section class="form-section">
            <h4>기본 정보</h4>

            <div class="form-grid">
                <div class="form-group full-width">
                    <label class="required" for="loginId">아이디</label>
                    <div class="inline-row">
                        <input type="text"
                               class="form-control"
                               id="loginId"
                               name="login_id"
                               placeholder="아이디를 입력하세요"
                               autocomplete="off">
                        <button type="button" class="btn-black-small" onclick="idCheck()">중복확인</button>
                    </div>
                    <span id="idCheckText" class="guide-text"></span>
                </div>

                <div class="form-group">
                    <label class="required" for="password">비밀번호</label>
                    <input type="password"
                           class="form-control"
                           id="password"
                           name="password_hash"
                           placeholder="비밀번호를 입력하세요"
                           autocomplete="new-password">
                </div>

                <div class="form-group">
                    <label class="required" for="pwCheck">비밀번호 확인</label>
                    <input type="password"
                           class="form-control"
                           id="pwCheck"
                           placeholder="비밀번호를 다시 입력하세요"
                           autocomplete="new-password">
                    <span id="pwCheckText" class="guide-text"></span>
                </div>

                <div class="form-group">
                    <label class="required" for="memberName">이름 / 법인명</label>
                    <input type="text"
                           class="form-control"
                           id="memberName"
                           name="member_name"
                           placeholder="이름 또는 법인명을 입력하세요"
                           autocomplete="off">
                </div>

                <div class="form-group">
                    <label class="required" for="memberType">회원구분</label>
                    <select name="member_type" id="memberType" class="form-control">
                        <option value="">회원구분 선택</option>
                        <option value="PERSONAL">개인</option>
                        <option value="BUSINESS">기업</option>
                    </select>
                </div>
            </div>
        </section>

        <section class="form-section">
            <h4>본인 확인 정보</h4>

            <div id="identifierEmptyBox" class="empty-info-box">
                <p>회원구분을 선택하면 입력 항목이 표시됩니다.</p>
            </div>

            <div id="personalIdentifier" class="identifier-box" style="display:none;">
                <label class="required">주민등록번호</label>

                <div class="identifier-row personal">
                    <input type="text"
                           class="form-control"
                           id="personalId1"
                           maxlength="6"
                           inputmode="numeric"
                           autocomplete="off"
                           placeholder="YYMMDD">
                    <span>-</span>
                    <input type="password"
                           class="form-control"
                           id="personalId2"
                           maxlength="7"
                           inputmode="numeric"
                           autocomplete="off"
                           placeholder="뒤 7자리">
                </div>

                <p class="info-text">주민등록번호는 회원 식별 및 본인 확인 용도로 사용됩니다.</p>
            </div>

            <div id="businessIdentifier" class="identifier-box" style="display:none;">
                <label class="required">사업자등록번호</label>

                <div class="identifier-row business">
                    <input type="password"
                           class="form-control"
                           id="businessId1"
                           maxlength="3"
                           inputmode="numeric"
                           autocomplete="off"
                           placeholder="000">
                    <span>-</span>
                    <input type="password"
                           class="form-control"
                           id="businessId2"
                           maxlength="2"
                           inputmode="numeric"
                           autocomplete="off"
                           placeholder="00">
                    <span>-</span>
                    <input type="password"
                           class="form-control"
                           id="businessId3"
                           maxlength="5"
                           inputmode="numeric"
                           autocomplete="off"
                           placeholder="00000">
                </div>

                <div class="form-group business-date">
                    <label class="required" for="businessOpenDate">개업일자</label>
                    <input type="date"
                           class="form-control"
                           id="businessOpenDate"
                           name="birth_date">
                </div>

                <p class="info-text">기업 회원은 사업자등록번호와 개업일자를 함께 입력해 주세요.</p>
            </div>

            <input type="hidden" name="member_identifier" id="memberIdentifier">
        </section>

        <section class="form-section">
            <h4>연락처 정보</h4>

            <div class="form-grid">
                <div class="form-group">
                    <label class="required" for="phoneNumber">휴대폰 번호</label>
                    <input type="tel"
                           class="form-control"
                           id="phoneNumber"
                           name="phone_number"
                           placeholder="010-0000-0000"
                           maxlength="13"
                           oninput="autoHyphen(this)">
                </div>

                <div class="form-group full-width">
                    <label class="required">이메일</label>

                    <div class="email-row">
                        <input type="text"
                               class="form-control"
                               id="emailId"
                               placeholder="이메일 아이디"
                               autocomplete="off">
                        <span>@</span>
                        <input type="text"
                               class="form-control"
                               id="emailDomain"
                               placeholder="도메인 입력"
                               autocomplete="off">
                        <select class="form-control" id="domainSelect">
                            <option value="direct">직접 입력</option>
                            <option value="naver.com">naver.com</option>
                            <option value="gmail.com">gmail.com</option>
                            <option value="daum.net">daum.net</option>
                        </select>
                        <button type="button" class="btn-black-small" id="sendEmailCodeBtn">인증번호 발송</button>
                    </div>

                    <!-- 인증번호 발송/입력/확인 UI -->
                    <div class="email-verification-row">
                        <input type="text"
                               class="form-control"
                               id="emailVerificationCode"
                               maxlength="8"
                               inputmode="numeric"
                               placeholder="8자리 인증번호"
                               autocomplete="off">
                        <button type="button" class="btn-black-small" id="confirmEmailCodeBtn">인증확인</button>
                    </div>

                    <span id="emailCheckText" class="guide-text"></span>
                    <input type="hidden" name="email" id="email">
                </div>

                <div class="form-group full-width">
                    <label class="required">주소</label>

                    <div class="address-row">
                        <input type="text"
                               class="form-control"
                               id="addressMain"
                               readonly
                               placeholder="도로명 주소">
                        <button type="button" class="btn-black-small" onclick="execDaumPostcode()">주소 찾기</button>
                    </div>
                </div>

                <div class="form-group full-width">
                    <label for="addressDetail">상세주소</label>
                    <input type="text"
                           class="form-control"
                           id="addressDetail"
                           placeholder="상세주소를 입력하세요">
                </div>

                <input type="hidden" name="adress" id="address">
            </div>
        </section>

        <div class="bottom-btn-group">
            <button type="button" class="btn-red" onclick="signup()">회원가입</button>
            <button type="button" class="btn-black" onclick="location.href='/loginPage'">로그인으로 이동</button>
        </div>
    </form>

</main>

<div id="addressModal" class="modal-overlay" style="display:none;">
    <div class="modal-content">
        <div class="modal-header">
            <h4>우편번호 검색</h4>
            <button type="button" class="btn-close" onclick="closeDaumPostcode()">&times;</button>
        </div>
        <div id="addressWrap" class="modal-body"></div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
