<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Login Page</title>

	<th:block th:replace="~{fragments/header :: headerCss}"></th:block>
    <th:block th:replace="~{fragments/footer :: footerCss}"></th:block>
	<link rel="stylesheet" th:href="@{/css/member/login.css}">
	<script th:src="@{/js/members/login.js}" defer></script>
</head>
<body>

<div th:replace="~{fragments/header :: header_default}"></div>

<main class="login-main">
	<section class="login-card">

		<div class="login-title-box">
			<p class="login-label">BNK 부산은행</p>
			<h2>로그인</h2>
			<p class="login-desc">부산은행 금융상품 서비스를 이용하시려면 로그인해 주세요.</p>
		</div>

		<form id="frm" class="login-form">
			<input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">

			<div class="input-group">
				<label for="username">아이디</label>
				<input type="text" id="username" name="username" placeholder="아이디를 입력하세요" required>
			</div>

			<div class="input-group">
				<label for="password">비밀번호</label>
				<input type="password" id="password" name="password" placeholder="비밀번호를 입력하세요" required>
			</div>

			<button type="button" class="login-btn" onclick="login()">로그인</button>
		</form>

		<div class="login-links">
			<a href="#">아이디 찾기</a>
			<span></span>
			<a href="#">비밀번호 찾기</a>
			<span></span>
			<a href="/signupPage">회원가입</a>
		</div>

	</section>
</main>

<script th:if="${msg != null}" th:inline="javascript">
	alert([[${msg}]]);
</script>

<div th:replace="~{fragments/footer :: footer}"></div>

</body>
</html>
