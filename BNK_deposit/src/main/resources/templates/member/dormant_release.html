<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BNK 휴면 계정 해제</title>
    <link rel="stylesheet" href="/css/member/dormant_release.css">
</head>
<body>

    <main class="dormant-container">
        <section class="dormant-card">
            <h1>휴면 계정 해제</h1>
            <p>
                일정 기간 접속하지 않아 계정이 휴면 상태로 전환되었습니다.<br>
                가입된 이메일로 인증번호를 받아 본인 인증을 완료해 주세요.
            </p>

            <div class="info-box">
                <strong>안내</strong>
                <span>인증번호는 발송 후 5분 동안만 유효합니다.</span>
            </div>

            <div class="button-area">
                <button type="button" class="btn-black" id="sendCodeBtn">
                    인증번호 발송
                </button>
            </div>

            <div class="form-group">
                <label for="verificationCode">인증번호</label>
                <input type="text"
                       id="verificationCode"
                       maxlength="6"
                       placeholder="6자리 인증번호 입력">
            </div>

            <div class="button-area">
                <button type="button" class="btn-red" id="releaseBtn">
                    휴면 해제하기
                </button>
                <button type="button" class="btn-gray" onclick="location.href='/loginPage'">
                    로그인 화면으로
                </button>
            </div>
        </section>
    </main>

    <script src="/js/members/common.js"></script>
    <script src="/js/members/dormant_release.js"></script>
</body>
</html>
