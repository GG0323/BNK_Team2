<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>BNK 금융 용어 사전 상세</title>

<meta name="_csrf" th:if="${_csrf != null}" th:content="${_csrf.token}">
<meta name="_csrf_header" th:if="${_csrf != null}" th:content="${_csrf.headerName}">

<style>
 * {
 box-sizing: border-box;
 margin: 0;
 padding: 0;
}

body {
    font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif;
    background: #F5F5F5;
    color: #111111;
}

.dictionary-popup-wrap {
    width: 100%;
    min-height: 100vh;
    padding: 24px;
}

.popup-topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
}

.popup-logo {
    display: flex;
    align-items: baseline;
    gap: 8px;
}

.popup-logo strong {
    color: #E8282F;
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -0.5px;
}

.popup-logo span {
    color: #111111;
    font-size: 14px;
    font-weight: 600;
}

.popup-close-btn {
    border: 1px solid #E0E0E0;
    background: #ffffff;
    color: #555555;
    border-radius: 6px;
    padding: 7px 14px;
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
}

.popup-close-btn:hover {
    border-color: #111111;
    color: #111111;
}

.dictionary-detail-card {
    background: #ffffff;
    border: 1px solid #E8E8E8;
    border-radius: 18px;
    padding: 28px;
    box-shadow: 0 10px 26px rgba(0, 0, 0, 0.07);
}

.dictionary-detail-head {
    padding-bottom: 20px;
    border-bottom: 1px solid #EFEFEF;
    margin-bottom: 22px;
}

.dictionary-category-badge {
    display: inline-block;
    background: #FFF0F0;
    color: #E8282F;
    border-radius: 999px;
    padding: 6px 12px;
    font-size: 12px;
    font-weight: 700;
    margin-bottom: 12px;
}

.dictionary-detail-head h1 {
    font-size: 26px;
    font-weight: 800;
    color: #111111;
    letter-spacing: -0.6px;
    margin-bottom: 8px;
}

.dictionary-meta {
    font-size: 12px;
    color: #999999;
}

.dictionary-detail-content {
    font-size: 15px;
    line-height: 1.85;
    color: #333333;
    white-space: pre-wrap;
    word-break: keep-all;
}
</style>
</head>
<body>
    <div class="dictionary-popup-wrap">

        <div class="popup-topbar">
            <div class="popup-logo">
                <strong>BNK</strong>
                <span>금융 용어 사전</span>
            </div>

            <button type="button" class="popup-close-btn" onclick="window.close()">
                닫기
            </button>
        </div>

        <main class="dictionary-detail-card">
            <div class="dictionary-detail-head">
                <span class="dictionary-category-badge" id="dictionaryCategory">-</span>
                <h1 id="dictionaryName">금융용어사전</h1>
                <p class="dictionary-meta">
                    조회수 <span id="viewCount">-</span>
                </p>
            </div>

            <div class="dictionary-detail-content" id="dictionaryContent">
                등록된 설명이 없습니다.
            </div>
        </main>

    </div>

    <script src="/js/members/common.js"></script>
    <script src="/js/common/financedictionarydetail.js"></script>
</body>
</html>
