<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>금융 용어 사전 상세</title>

<meta name="_csrf" th:content="${_csrf.token}">
<meta name="_csrf_header" th:content="${_csrf.headerName}">

<style>
    body { font-family: sans-serif; }
    .detail-table { width: 100%; border-collapse: collapse; margin-top: 20px; border-top: 2px solid #8b7355; }
    .detail-table th, .detail-table td { border-bottom: 1px solid #ddd; padding: 15px; }
    .detail-table th { background-color: #f9f9f9; width: 20%; text-align: center; }
    .btn-wrap { text-align: center; margin-top: 30px; }
    .list-btn { padding: 10px 30px; border: 1px solid #ccc; background: white; cursor: pointer; text-decoration: none; color: black; }
</style>
</head>
<body>
    <h1 style="background-color: #8b7355; color: white; padding: 15px;">금융용어사전</h1>
    
    <h2 class="dict-header" id="dictionaryName">금융용어사전</h2>

    <table class="detail-table">
        <tr>
            <th>카테고리</th>
            <td id="dictionaryCategory">-</td>
        </tr>
        <tr>
            <th>조회수</th>
            <td id="viewCount">-</td>
        </tr>
        <tr>
            <th>용어 설명</th>
            <td id="dictionaryContent">-</td>
        </tr>
    </table>

    <div class="btn-wrap">
        <a href="/financedictionary" class="list-btn">목록으로</a>
        <a id="editBtn" href="#" class="list-btn" style="border-color: #d71920; color: #d71920;">수정</a>
        <button type="button" id="deleteBtn" class="list-btn" style="background-color: #d71920; color: white; border: none;">
            삭제
        </button>
    </div>

    <script src="/js/members/common.js"></script>
    <script src="/js/common/financedictionarydetail.js"></script>
</body>
</html>
