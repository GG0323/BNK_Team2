<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>스마트 금융계산기</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<link rel="stylesheet" th:href="@{/css/common/calculator.css}">
</head>
<body>
<div class="calc-container">
    <h2>스마트 금융계산기</h2>
    
    <div class="main-tabs">
        <button type="button" class="main-tab-btn active" id="btnDeposit" onclick="setMainType('deposit')">예금</button>
        <button type="button" class="main-tab-btn" id="btnSavings" onclick="setMainType('savings')">적금</button>
    </div>

    <div class="sub-tabs">
        <button type="button" class="sub-tab-btn active" id="btnFv" onclick="setMode('fv')">목돈 굴리기</button>
        <button type="button" class="sub-tab-btn" id="btnPv" onclick="setMode('pv')">목돈 모으기</button>
    </div>

    <div class="form-group" style="margin-bottom: 25px;">
        <label for="interestType" style="margin-bottom: 8px; display: block;">이자 계산 방식</label>
        <select id="interestType">
            <option value="simple" selected>단리</option>
            <option value="compound">복리 (월복리)</option>
        </select>
    </div>
    
    <div class="form-group">
        <div class="label-row"><label id="labelAmount">예치 금액</label></div>
        <div class="input-wrapper">
            <input type="range" id="amountRange" min="0" max="1000000000" step="10000" value="0" oninput="syncToInput('amount')">
            <div class="text-input-box">
                <input type="text" id="amount" placeholder="0" inputmode="numeric" oninput="validateAmount(this)" onkeydown="handleAmountKeydown(event)">
                <span class="unit">원</span>
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <div class="label-row"><label>예치 기간</label></div>
        <div class="input-wrapper">
            <input type="range" id="monthsRange" min="1" max="120" step="1" value="12" oninput="syncToInput('months')">
            <div class="text-input-box">
                <input type="text" id="months" placeholder="12" value="12" inputmode="numeric" oninput="validateMonths(this)">
                <span class="unit">개월</span>
            </div>
        </div>
    </div>
    
    <div class="form-group">
        <div class="label-row"><label>적용 금리 (연)</label></div>
        <div class="input-wrapper">
            <input type="range" id="rateRange" min="0" max="20" step="0.1" value="3.5" oninput="syncToInput('rate')">
            <div class="text-input-box">
                <input type="text" id="rate" placeholder="0.00" value="3.50" inputmode="decimal" oninput="validateRate(this)" onblur="formatRate(this)">
                <span class="unit">%</span>
            </div>
        </div>
    </div>
    
    <button class="calc-submit" onclick="executeCalc()">결과보기</button>

    <div id="resultSection" class="result-section">
        <div class="chart-container"><canvas id="resultChart"></canvas></div>
        <div class="tax-grid">
            <div class="tax-card">
                <h4>일반과세(15.4%)</h4>
                <div class="result-row"><span>원금 총액:</span> <span id="genPrincipal">0원</span></div>
                <div class="result-row"><span>세전 이자:</span> <span id="genPreTax">0원</span></div>
                <div class="result-row"><span>세금 공제:</span> <span id="genTax" style="color: #d93025;">-0원</span></div>
                <div class="total-row"><span id="genTotalLabel">만기 수령액:</span> <span id="genTotal">0원</span></div>
            </div>
            <div class="tax-card">
                <h4>비과세</h4>
                <div class="result-row"><span>원금 총액:</span> <span id="taxFreePrincipal">0원</span></div>
                <div class="result-row"><span>세전 이자:</span> <span id="taxFreePreTax">0원</span></div>
                <div class="result-row"><span>세금 공제:</span> <span style="color: #0056b3;">0원</span></div>
                <div class="total-row"><span id="taxFreeTotalLabel">만기 수령액:</span> <span id="taxFreeTotal">0원</span></div>
            </div>
        </div>
        <button class="copy-btn" onclick="copyResultToClipboard()">📋 결과 복사하기</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script th:src="@{/js/common/calculator.js}"></script>
</body>
</html>
