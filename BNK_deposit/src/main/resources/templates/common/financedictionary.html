<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>금융 용어 사전</title>
<link rel="stylesheet" href="/css/productView.css">
<style>
    .dict-card { background: white; border-radius: 22px; padding: 24px; margin-bottom: 18px; box-shadow: 0 10px 26px rgba(0,0,0,0.07); border: 1px solid #eeeeee; transition: 0.2s; }
    .dict-card:hover { border-color: #d71920; transform: translateY(-2px); }
    .dict-title { font-size: 18px; font-weight: 700; color: #111; display: block; margin-bottom: 8px; }
    .empty-state { text-align:center; padding:40px; color:#777; background:#f8f8f8; border-radius:14px; }
</style>
</head>
<body>
    <div class="page-wrap">
        <div class="product-header">
            <h1>금융 용어 사전</h1>
            <p>궁금한 금융 용어를 확인해보세요.</p>
        </div>
        
        <div style="text-align: center; margin-bottom: 20px;">
            <form id="searchForm">
                <input type="text" id="keyword" name="keyword" placeholder="검색할 금융 용어를 입력하세요" style="padding: 10px; width: 300px; border-radius: 5px; border: 1px solid #ccc;">
                <button type="submit" style="padding: 10px 20px; background-color: #d71920; color: white; border: none; border-radius: 5px; cursor: pointer;">검색</button>
            </form>
        </div>

        <div class="product-section" id="dictionaryList">
		    <div class="empty-state">불러오는 중...</div>
		</div>
    </div>

    <script src="/js/members/common.js"></script>
    <script src="/js/common/financedictionary.js"></script>
</body>
</html>
